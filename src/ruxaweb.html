    {"id": "raweb-1-3", "ref": "1.3", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque image porteuse d’information ayant une alternative textuelle, cette alternative est-elle pertinente (hors cas particuliers) ?", "libelle_en": "For each image conveying information with a text alternative, is this alternative relevant (excluding special cases)?", "impact": "RAWeb 1.3 (WCAG 1.1.1 / 4.1.2) : une alternative non pertinente (vide, générique comme « image » ou « logo », ou erronée) prive l'utilisateur de lecteur d'écran de l'information que l'image donne aux autres.", "explication": "Ne vérifie pas seulement la présence de l'alternative mais son contenu, tel que l'annonce le lecteur d'écran : il doit transmettre la même information que l'image, et pour une image lien ou bouton, sa fonction ou sa destination (« Accueil », pas « logo »). L'alternative doit rester courte ; une information longue relève de la description détaillée (critère 1.6).", "wcag": ["1.1.1", "4.1.2"]},
    {"id": "raweb-1-4", "ref": "1.4", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "captcha", "etape": "3a", "libelle": "Pour chaque image utilisée comme CAPTCHA ou comme image-test, ayant une alternative textuelle, cette alternative permet-elle d’identifier la nature et la fonction de l’image ?", "libelle_en": "For each image used as a CAPTCHA or test image, with a text alternative, does this alternative make it possible to identify the nature and function of the image?", "impact": "RAWeb 1.4 (WCAG 1.1.1) : sans alternative qui identifie sa nature, l'utilisateur de lecteur d'écran ne comprend pas qu'il fait face à un CAPTCHA, ni ce qu'on attend de lui.", "explication": "Avec le lecteur d'écran, place-toi sur le CAPTCHA imagé : ce qui est annoncé doit dire ce que c'est et ce qu'il faut faire (par exemple « Code de sécurité à recopier »), sans donner la réponse. Une alternative vide ou « image » est non conforme.", "wcag": ["1.1.1"]},
    {"id": "raweb-1-5", "ref": "1.5", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "captcha", "etape": "1", "libelle": "Pour chaque image utilisée comme CAPTCHA, une solution d’accès alternatif au contenu ou à la fonction du CAPTCHA est-elle présente ?", "libelle_en": "For each image used as a CAPTCHA, is there an alternative access solution to the content or to the CAPTCHA function?", "impact": "RAWeb 1.5 (WCAG 1.1.1) : sans alternative au CAPTCHA visuel, les personnes aveugles ou malvoyantes sont totalement bloquées : elles ne peuvent ni s'inscrire, ni se connecter, ni envoyer le formulaire.", "explication": "Le CAPTCHA visuel doit proposer au moins une autre forme non graphique (CAPTCHA audio, question logique) ou une autre solution d'accès à la même fonction (contact par téléphone ou par courriel, par exemple). Vérifie que cette alternative existe vraiment et qu'elle est utilisable au clavier.", "wcag": ["1.1.1"]},
    {"id": "raweb-1-6", "ref": "1.6", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "image-complexe", "etape": "3a", "libelle": "Chaque image porteuse d’information a-t-elle, si nécessaire, une description détaillée ?", "libelle_en": "Does each image conveying information have, if necessary, a detailed description?", "impact": "RAWeb 1.6 (WCAG 1.1.1) : sans description détaillée, une image complexe (graphique, schéma, carte, infographie) reste incompréhensible pour l'utilisateur de lecteur d'écran, même avec une alternative courte.", "explication": "Pour chaque image complexe, cherche une description détaillée en plus de l'alternative courte : texte adjacent signalé par l'alternative, lien ou bouton vers une description, ou aria-describedby. Le lecteur d'écran doit permettre de la trouver depuis l'image.", "wcag": ["1.1.1"]},
    {"id": "raweb-1-7", "ref": "1.7", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "image-complexe", "etape": "3a", "libelle": "Pour chaque image porteuse d’information ayant une description détaillée, cette description est-elle pertinente ?", "libelle_en": "For each image conveying information with a detailed description, is this description relevant?", "impact": "RAWeb 1.7 (WCAG 1.1.1) : une description détaillée incomplète ou erronée transmet une information fausse ou partielle : les données d'un graphique, par exemple, ne sont pas toutes restituées.", "explication": "Lis la description détaillée en regardant l'image : elle doit donner la même information (valeurs d'un graphique, étapes d'un schéma, trajet d'une carte). Un simple titre ou une phrase vague n'est pas pertinent.", "wcag": ["1.1.1"]},
    {"id": "raweb-2-1", "ref": "2.1", "theme_ruxal": "Navigation & structure", "theme_ref": "2. Cadres", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "cadre", "etape": "2", "libelle": "Chaque cadre a-t-il un titre de cadre ?", "libelle_en": "Does each frame have a frame title?", "impact": "RAWeb 2.1 (WCAG 4.1.2) : un cadre sans titre est annoncé « cadre » sans autre information : l'utilisateur de lecteur d'écran ne sait pas ce qu'il contient (vidéo, carte, formulaire externe) avant d'y entrer.", "explication": "Repère les contenus intégrés dans un cadre (vidéo, carte, formulaire externe : balise iframe). Dans l'inspecteur, chaque cadre doit avoir un titre (attribut title), que le lecteur d'écran annonce en entrant dans le cadre. Note aussi un titre vide de sens (« iframe », un nom de fichier).", "wcag": ["4.1.2"]},
    {"id": "raweb-3-1", "ref": "3.1", "theme_ruxal": "Couleurs & contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, l’information ne doit pas être donnée uniquement par la couleur. Cette règle est-elle respectée ?", "libelle_en": "On each web page, the information must not be provided by colour alone. Is this rule respected?", "impact": "RAWeb 3.1 (WCAG 1.3.1 / 1.4.1) : les personnes daltoniennes, malvoyantes ou utilisant un lecteur d'écran ne perçoivent pas une information donnée seulement par la couleur (champ en erreur en rouge, statut vert ou rouge, lien seulement coloré dans un texte).", "explication": "Repère les cas où seule la couleur porte l'information (texte en rouge pour une erreur, légende de graphique par couleur, lien distingué du texte par sa seule couleur, onglet actif). Un autre repère visible doit exister (texte, icône, soulignement, motif) et l'information doit aussi être restituée au lecteur d'écran. Astuce : affiche la page en niveaux de gris.", "wcag": ["1.3.1", "1.4.1"]},
    {"id": "raweb-3-2", "ref": "3.2", "theme_ruxal": "Couleurs & contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, le contraste entre la couleur du texte et la couleur de son arrière-plan est-il suffisamment élevé (hors cas particuliers) ?", "libelle_en": "On each web page, is the contrast between the colour of the text and the colour of its background sufficiently high (excluding special cases)?", "impact": "RAWeb 3.2 (WCAG 1.4.3) : un contraste insuffisant rend le texte difficile ou impossible à lire pour les personnes malvoyantes, âgées, ou qui consultent la page en plein soleil.", "explication": "Mesure le contraste entre le texte et son fond avec un outil de mesure du contraste, en priorité sur les textes clairs ou petits, posés sur une image ou un dégradé, et dans les états au survol et au focus. Seuils : 4,5:1 pour le texte courant, 3:1 pour un texte d'au moins 24 px, ou 18,5 px en gras.", "wcag": ["1.4.3"]},
    {"id": "raweb-3-3", "ref": "3.3", "theme_ruxal": "Couleurs & contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les couleurs utilisées dans les composants d’interface ou les éléments graphiques porteurs d’informations sont-elles suffisamment contrastées (hors cas particuliers) ?", "libelle_en": "On each web page, are the colours used in the user interface components or graphic element conveying information sufficiently contrasting (excluding special cases)?", "impact": "RAWeb 3.3 (WCAG 1.4.11) : une icône, une bordure de champ, un indicateur de focus ou un graphique trop peu contrasté passe inaperçu pour les personnes malvoyantes ou qui consultent sur un écran au soleil : elles ne trouvent pas le champ à remplir ni l'élément actif.", "explication": "Repère les éléments graphiques qui portent une information ou permettent d'agir : icônes seules, bordures de champs, cases à cocher, boutons sans fond, indicateur de focus, courbes et zones de graphique. Mesure le contraste de chacun avec la couleur voisine : il doit atteindre au moins 3:1. Les éléments purement décoratifs et les composants désactivés ne sont pas concernés.", "wcag": ["1.4.11"]},
    {"id": "raweb-4-1", "ref": "4.1", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque média temporel pré-enregistré a-t-il, si nécessaire, une transcription textuelle ou une audiodescription (hors cas particuliers) ?", "libelle_en": "Does each pre-recorded time-based media have, if necessary, a transcript or an audio description (excluding special cases)?", "impact": "RAWeb 4.1 (WCAG 1.2.1 / 1.2.3) : sans transcription ni audiodescription, une personne sourde, aveugle ou sourdaveugle n'a pas accès au contenu d'un audio ou d'une vidéo pré-enregistrés.", "explication": "Pour chaque audio seul, cherche une transcription textuelle adjacente ou liée. Pour chaque vidéo pré-enregistrée, cherche une transcription ou une version audiodécrite. L'alternative doit être atteignable depuis le média, au clavier et au lecteur d'écran.", "wcag": ["1.2.1", "1.2.3"]},
    {"id": "raweb-4-2", "ref": "4.2", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Pour chaque média temporel pré-enregistré ayant une transcription textuelle ou une audiodescription synchronisée, celles-ci sont-elles pertinentes (hors cas particuliers) ?", "libelle_en": "For each pre-recorded time-based media with a synchronised transcript or audio description, are these relevant (excluding special cases)?", "impact": "RAWeb 4.2 (WCAG 1.2.1 / 1.2.3) : une transcription ou une audiodescription incomplète fait manquer une partie de l'information (paroles résumées, informations visuelles absentes).", "explication": "Compare la transcription ou l'audiodescription au média : toutes les paroles et les informations visuelles utiles (texte affiché, actions, changements de lieu) doivent s'y retrouver, dans le bon ordre.", "wcag": ["1.2.1", "1.2.3"]},
    {"id": "raweb-4-3", "ref": "4.3", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque média temporel synchronisé a-t-il, si nécessaire, des sous-titres synchronisés (hors cas particuliers) ?", "libelle_en": "Does each synchronised time-based media have, if necessary, synchronised captions (excluding special cases)?", "impact": "RAWeb 4.3 (WCAG 1.2.2 / 1.2.4) : sans sous-titres, les personnes sourdes ou malentendantes n'ont accès à aucune parole de la vidéo.", "explication": "Lis la vidéo : si le son porte de l'information (quelqu'un parle, par exemple), des sous-titres synchronisés doivent pouvoir s'afficher, directement ou dans une version sous-titrée. Les sous-titres incrustés dans l'image comptent.", "wcag": ["1.2.2", "1.2.4"]},
    {"id": "raweb-4-4", "ref": "4.4", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Pour chaque média temporel synchronisé ayant des sous-titres synchronisés, ces sous-titres sont-ils pertinents (hors cas particuliers) ?", "libelle_en": "For each synchronised time-based media with synchronised captions, are these captions relevant (excluding special cases)?", "impact": "RAWeb 4.4 (WCAG 1.2.2 / 1.2.4) : des sous-titres décalés, incomplets ou dans une autre langue que la vidéo font perdre le sens du contenu.", "explication": "Regarde un extrait avec les sous-titres activés : ils doivent être dans la langue de la vidéo, reprendre les paroles et les sons utiles (« [applaudissements] », changement de locuteur) et rester synchronisés avec l'image.", "wcag": ["1.2.2", "1.2.4"]},
    {"id": "raweb-4-8", "ref": "4.8", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-non-temporel", "etape": "1", "libelle": "Chaque média non temporel a-t-il, si nécessaire, une alternative (hors cas particuliers) ?", "libelle_en": "Does each non-time-based media have, if necessary, an alternative (excluding special cases)?", "impact": "RAWeb 4.8 (WCAG 1.1.1) : sans alternative, un média non temporel (carte interactive, visite virtuelle, animation ou objet embarqué sans déroulement) reste inaccessible aux personnes qui ne peuvent pas l'utiliser.", "explication": "Repère les médias non temporels (contenu embarqué interactif ou animé, sans lecture du début à la fin). Un lien ou un bouton adjacent et clairement identifiable doit mener à une alternative, dans la page ou dans une autre page, elle-même accessible.", "wcag": ["1.1.1"]},
    {"id": "raweb-4-9", "ref": "4.9", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-non-temporel", "etape": "1", "libelle": "Pour chaque média non temporel ayant une alternative, cette alternative est-elle pertinente ?", "libelle_en": "For each non-time-based media having an alternative, is this alternative relevant?", "impact": "RAWeb 4.9 (WCAG 1.1.1) : une alternative qui ne donne pas le même contenu (adresse sans plan d'accès, liste partielle de points) laisse l'utilisateur avec une information incomplète.", "explication": "Compare l'alternative au média : elle doit donner accès au même contenu et à des fonctionnalités similaires (par exemple, pour une carte : adresses, horaires, itinéraire en texte).", "wcag": ["1.1.1"]},
    {"id": "raweb-4-10", "ref": "4.10", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque son déclenché automatiquement est-il contrôlable par l’utilisateur ?", "libelle_en": "Is each automatically triggered sound controllable by the user?", "impact": "RAWeb 4.10 (WCAG 1.4.2) : un son qui se lance seul et ne peut pas être coupé couvre la voix du lecteur d'écran et gêne fortement les personnes sensibles au bruit.", "explication": "Ouvre la page avec le son activé : un son qui démarre seul doit durer 3 secondes au plus, ou pouvoir être arrêté (bouton atteignable au clavier en début de page), ou avoir un volume réglable indépendamment de celui du système.", "wcag": ["1.4.2"]},
    {"id": "raweb-4-11", "ref": "4.11", "theme_ruxal": "Images & médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "4", "libelle": "La consultation de chaque média temporel est-elle, si nécessaire, contrôlable par le clavier et tout dispositif de pointage ?", "libelle_en": "Is the viewing of each time-based media, if required, accessible and operable by keyboard and any pointing device?", "impact": "RAWeb 4.11 (WCAG 2.1.1 / 2.1.2) : sans commandes utilisables au clavier, l'utilisateur ne peut pas lancer, mettre en pause, couper le son ou activer les sous-titres d'un média.", "explication": "Au clavier seul, atteins le lecteur de chaque média : les commandes nécessaires (lecture, pause ou arrêt, son, sous-titres et audiodescription s'ils existent) doivent être atteignables avec Tab et activables avec Entrée ou Espace, sans piège. Vérifie aussi à la souris.", "wcag": ["2.1.1", "2.1.2"]},
    {"id": "raweb-5-6", "ref": "5.6", "theme_ruxal": "Contenu & lisibilité", "theme_ref": "5. Tableaux", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "tableau-donnees", "etape": "2", "libelle": "Pour chaque tableau de données, chaque en-tête de colonne et chaque en-tête de ligne sont-ils correctement déclarés ?", "libelle_en": "For each data table, are each column header and each row header correctly declared?", "impact": "RAWeb 5.6 (WCAG 1.3.1) : des en-têtes de tableau non déclarés font lire au lecteur d'écran une suite de valeurs sans contexte : l'utilisateur ne sait plus à quoi correspond chaque chiffre.", "explication": "À l'inspecteur, vérifie que chaque en-tête de colonne et de ligne est structuré par une balise th (ou un rôle columnheader ou rowheader), et pas par une cellule td mise en gras.", "wcag": ["1.3.1"]},
    {"id": "raweb-5-7", "ref": "5.7", "theme_ruxal": "Contenu & lisibilité", "theme_ref": "5. Tableaux", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "tableau-donnees", "etape": "2", "libelle": "Pour chaque tableau de données, la technique appropriée permettant d’associer chaque cellule avec ses en-têtes est-elle utilisée (hors cas particuliers) ?", "libelle_en": "For each data table, is the appropriate technique used to associate each cell with its headers (excluding special cases)?", "impact": "RAWeb 5.7 (WCAG 1.3.1) : une mauvaise association cellule et en-tête fait annoncer par le lecteur d'écran un en-tête faux ou aucun en-tête.", "explication": "Avec le lecteur d'écran, parcours quelques cellules du tableau : chacune doit être annoncée avec son ou ses en-têtes de ligne et de colonne. Si ce n'est pas le cas, le lien entre les cellules et leurs en-têtes est mal codé (attribut scope, ou id et headers pour un tableau complexe).", "wcag": ["1.3.1"]},
    {"id": "raweb-6-1", "ref": "6.1", "theme_ruxal": "Navigation & structure", "theme_ref": "6. Liens", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Chaque lien est-il explicite (hors cas particuliers) ?", "libelle_en": "Is every link explicit (except in special cases)?", "impact": "RAWeb 6.1 (WCAG 1.1.1 / 2.4.4 / 2.5.3) : un lien vague (« cliquez ici », « en savoir plus ») ne dit pas où il mène : l'utilisateur de lecteur d'écran qui parcourt la liste des liens ne sait pas lequel choisir.", "explication": "Affiche la liste des liens proposée par le lecteur d'écran : chaque intitulé, seul ou avec son contexte (phrase, titre, cellule), doit dire la fonction ou la destination du lien. Si le lien a un texte visible, le nom annoncé doit contenir ce texte.", "wcag": ["1.1.1", "2.4.4", "2.5.3"]},
    {"id": "raweb-6-2", "ref": "6.2", "theme_ruxal": "Navigation & structure", "theme_ref": "6. Liens", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, chaque lien a-t-il un intitulé ?", "libelle_en": "On each web page, does each link have an accessible name?", "impact": "RAWeb 6.2 (WCAG 1.1.1 / 2.4.4) : un lien sans intitulé est annoncé « lien » sans autre information : l'utilisateur de lecteur d'écran ne peut pas savoir où il mène, ni le distinguer des autres.", "explication": "Affiche la liste des liens proposée par le lecteur d'écran et cherche les liens annoncés sans nom (« lien » seul) : ce sont souvent des icônes ou des images cliquables (réseaux sociaux, logo). Chaque lien doit avoir un intitulé : son texte, l'alternative de son image, ou un libellé caché.", "wcag": ["1.1.1", "2.4.4"]},
    {"id": "raweb-7-1", "ref": "7.1", "theme_ruxal": "Composants interactifs", "theme_ref": "7. Scripts", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Chaque script est-il, si nécessaire, compatible avec les technologies d’assistance ?", "libelle_en": "Is each script, if necessary, compatible with assistive technologies?", "impact": "RAWeb 7.1 (WCAG 4.1.2 / 2.5.3) : un composant construit en script (bouton, onglet, menu, accordéon, case maison) dont le nom, le rôle ou l'état ne sont pas restitués est inutilisable au lecteur d'écran : on entend « groupe » ou rien, sans savoir à quoi il sert ni s'il est ouvert, sélectionné ou coché. Pour la commande vocale, un nom qui ne reprend pas le texte visible empêche de l'activer.", "explication": "Au lecteur d'écran, parcours chaque composant qui réagit à un script. Pour chacun, vérifie que sont restitués : son nom (pertinent, et qui contient le texte visible quand il y en a un), son rôle (bouton, onglet, case à cocher, menu...), et son état quand il en a un (ouvert ou fermé, sélectionné, coché, désactivé). Active-le : le changement d'état doit être restitué. Dans le code, un élément cliquable doit être un élément natif (button, a, input) ou porter le rôle et les propriétés adaptés.", "wcag": ["2.5.3", "4.1.2"]},
    {"id": "raweb-7-3", "ref": "7.3", "theme_ruxal": "Navigation & structure", "theme_ref": "7. Scripts", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Chaque script est-il contrôlable par le clavier et par tout dispositif de pointage (hors cas particuliers) ?", "libelle_en": "Is each script accessible and operable by keyboard and any pointing device (excluding special cases)?", "impact": "RAWeb 7.3 (WCAG 1.3.1 / 2.1.1 / 2.4.7) : un composant scripté (menu, accordéon, onglet, carrousel, bouton fait d'un div) inutilisable au clavier bloque totalement les utilisateurs de clavier, de contacteur ou de commande vocale.", "explication": "Au clavier seul (Tab, Maj+Tab, Entrée, Espace, flèches), atteins et active chaque élément qui réagit à un script : il doit fonctionner comme à la souris. Un div ou un span cliquable sans tabindex ni gestion du clavier est non conforme. Vérifie aussi qu'aucun script ne retire le focus d'un élément qui vient de le recevoir.", "wcag": ["1.3.1", "2.1.1", "2.4.7"]},
    {"id": "raweb-7-5", "ref": "7.5", "theme_ruxal": "Composants interactifs", "theme_ref": "7. Scripts", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, les messages de statut sont-ils correctement restitués par les technologies d’assistance ?", "libelle_en": "On each web page, are status messages correctly rendered (by assistive technologies)?", "impact": "RAWeb 7.5 (WCAG 4.1.3) : un message de statut non restitué (« Article ajouté au panier », « 3 résultats », « Enregistrement en cours ») laisse l'utilisateur de lecteur d'écran sans retour : il ne sait pas si son action a réussi et la répète, ou abandonne.", "explication": "Déclenche les actions qui affichent un message sans déplacer le focus : ajout au panier, filtre ou recherche qui met à jour un nombre de résultats, enregistrement, chargement, erreur générale. Au lecteur d'écran, le message doit être lu automatiquement, sans que tu aies à le chercher, et sans que le focus bouge. Dans le code, la zone du message porte un rôle de statut ou d'alerte, présent avant l'apparition du message.", "wcag": ["4.1.3"]},
    {"id": "raweb-8-2", "ref": "8.2", "theme_ruxal": "Fondations techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Pour chaque page web, le code source généré est-il valide selon le type de document spécifié ?", "libelle_en": "For each web page, is the generated source code valid for the specified document type?", "impact": "RAWeb 8.2 (WCAG 4.1.1 / 4.1.2) : un code ARIA ou HTML incorrect (attribut ARIA invalide, rôle sans ses enfants requis, identifiant dupliqué référencé) fausse ce que restituent les technologies d'assistance.", "explication": "Vérifie que le code ne trompe pas les technologies d'assistance : rôles et attributs ARIA valides et complets, listes bien construites, identifiants uniques quand d'autres éléments s'y réfèrent. Un outil de test automatique repère vite la plupart de ces erreurs ; vérifie ensuite chacune dans l'inspecteur. La validation complète du code n'est plus exigée.", "wcag": ["4.1.1", "4.1.2"]},
    {"id": "raweb-8-3", "ref": "8.3", "theme_ruxal": "Fondations techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Dans chaque page web, la langue par défaut est-elle présente ?", "libelle_en": "On each web page, is the default language present?", "impact": "RAWeb 8.3 (WCAG 3.1.1) : sans langue déclarée, le lecteur d'écran lit la page avec une prononciation par défaut, souvent incompréhensible (texte français lu avec un accent anglais).", "explication": "Dans l'inspecteur, vérifie que l'élément html de la page porte un attribut lang (par exemple lang=\"fr\").", "wcag": ["3.1.1"]},
    {"id": "raweb-8-4", "ref": "8.4", "theme_ruxal": "Fondations techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Pour chaque page web ayant une langue par défaut, le code de langue est-il pertinent ?", "libelle_en": "For each web page with a default language, is the language code relevant?", "impact": "RAWeb 8.4 (WCAG 3.1.1) : un code de langue faux ou invalide fait lire la page avec la mauvaise voix de synthèse.", "explication": "Vérifie que le code de langue de la page (attribut lang de l'élément html) est valide (fr, de, en, lb) et correspond à la langue principale réelle de la page. Une page en allemand déclarée lang=\"fr\" est non conforme.", "wcag": ["3.1.1"]},
    {"id": "raweb-8-5", "ref": "8.5", "theme_ruxal": "Navigation & structure", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Chaque page web a-t-elle un titre de page ?", "libelle_en": "Does every web page have a page title?", "impact": "RAWeb 8.5 (WCAG 2.4.2) : sans titre de page, l'utilisateur de lecteur d'écran, qui entend d'abord le titre, ne sait pas où il est, et les onglets ou favoris ne se distinguent pas.", "explication": "À l'inspecteur ou dans l'onglet du navigateur, vérifie que chaque page a une balise title non vide.", "wcag": ["2.4.2"]},
    {"id": "raweb-8-6", "ref": "8.6", "theme_ruxal": "Navigation & structure", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque page web ayant un titre de page, ce titre est-il pertinent ?", "libelle_en": "For each web page with a page title, is this title relevant?", "impact": "RAWeb 8.6 (WCAG 2.4.2) : un titre de page générique ou identique sur toutes les pages (« Accueil », nom du site seul) empêche de savoir sur quelle page on se trouve, surtout après une action (erreur de formulaire, étape suivante).", "explication": "Lis le titre de chaque page (onglet du navigateur, ou annonce du lecteur d'écran à l'ouverture) : il doit identifier le contenu de la page, idéalement suivi du nom du site (« Contact : Nom du site »). Vérifie aussi les étapes d'un formulaire et les pages d'erreur.", "wcag": ["2.4.2"]},
    {"id": "raweb-8-7", "ref": "8.7", "theme_ruxal": "Fondations techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "AA", "siPresent": true, "horsSelection": false, "declencheur": "changement-langue", "etape": "3a", "libelle": "Dans chaque page web, chaque changement de langue est-il indiqué dans le code source (hors cas particuliers) ?", "libelle_en": "On each web page, is each language change indicated in the source code (excluding special cases)?", "impact": "RAWeb 8.7 (WCAG 3.1.2) : un passage en langue étrangère non signalé est lu avec la prononciation de la langue de la page et devient incompréhensible.", "explication": "Repère les passages dans une autre langue que celle de la page (citation, nom d'une langue dans un sélecteur, document en anglais) : l'élément qui les contient doit porter un attribut lang. Les noms propres et les mots passés dans l'usage courant ne sont pas concernés.", "wcag": ["3.1.2"]},
    {"id": "raweb-8-8", "ref": "8.8", "theme_ruxal": "Fondations techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "AA", "siPresent": true, "horsSelection": false, "declencheur": "changement-langue", "etape": "2", "libelle": "Dans chaque page web, le code de langue de chaque changement de langue est-il valide et pertinent ?", "libelle_en": "On each web page, is the language code for each language change valid and relevant?", "impact": "RAWeb 8.8 (WCAG 3.1.2) : un code de langue faux sur un passage le fait lire avec une mauvaise voix de synthèse.", "explication": "Pour chaque passage marqué dans une autre langue, vérifie que son code de langue est valide et correspond bien à la langue du passage (par exemple lang=\"en\" sur une citation en anglais, lang=\"lb\" sur un texte en luxembourgeois).", "wcag": ["3.1.2"]},
    {"id": "raweb-9-1", "ref": "9.1", "theme_ruxal": "Navigation & structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, l’information est-elle structurée par l’utilisation appropriée de titres ?", "libelle_en": "On each web page, is the information structured by the appropriate use of headings?", "impact": "RAWeb 9.1 (WCAG 1.3.1 / 2.4.1 / 2.4.6 / 4.1.2) : sans titres structurés, les utilisateurs de lecteur d'écran, qui naviguent souvent de titre en titre, ne peuvent ni survoler la page ni sauter à la partie qui les intéresse.", "explication": "Affiche la liste des titres proposée par le lecteur d'écran (ou par une extension de navigateur) : chaque texte qui joue visuellement le rôle de titre doit y figurer, avec un contenu pertinent et une hiérarchie cohérente (pas de saut de niveau illogique).", "wcag": ["1.3.1", "2.4.1", "2.4.6", "4.1.2"]},
    {"id": "raweb-9-2", "ref": "9.2", "theme_ruxal": "Navigation & structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Dans chaque page web, la structure du document est-elle cohérente ?", "libelle_en": "On each web page, is the document structure consistent (excluding special cases)?", "impact": "RAWeb 9.2 (WCAG 1.3.1) : sans zones structurantes (en-tête, navigation, contenu principal, pied de page), l'utilisateur de lecteur d'écran ne peut pas aller directement au contenu ou au menu.", "explication": "Affiche la liste des repères du lecteur d'écran (ou les zones dans l'inspecteur) : la page doit avoir un en-tête, une navigation principale, un seul contenu principal et un pied de page, chacun identifié comme tel (header, nav, main, footer).", "wcag": ["1.3.1"]},
    {"id": "raweb-9-3", "ref": "9.3", "theme_ruxal": "Navigation & structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, chaque liste est-elle correctement structurée ?", "libelle_en": "On each web page, is each list correctly structured?", "impact": "RAWeb 9.3 (WCAG 1.3.1) : une liste visuelle qui n'est pas déclarée comme liste est lue comme une suite de lignes sans lien : l'utilisateur de lecteur d'écran ne sait pas combien d'éléments elle contient ni où elle se termine, et ne peut pas la sauter.", "explication": "Repère tout contenu présenté comme une liste : énumérations à puces ou numérotées, menus, suites de liens, de cartes ou de résultats. Au lecteur d'écran, chacune doit être annoncée comme une liste avec son nombre d'éléments. Dans le code, elle utilise les éléments de liste (ul, ol et li, ou dl pour une liste de définitions), sans tirets ni retours à la ligne pour simuler les puces.", "wcag": ["1.3.1"]},
    {"id": "raweb-10-4", "ref": "10.4", "theme_ruxal": "Contenu & lisibilité", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, le texte reste-t-il lisible lorsque la taille des caractères est augmentée jusqu’à 200 %, au moins (hors cas particuliers) ?", "libelle_en": "On each web page, is the text still readable when the font size is increased by at least 200% (excluding special cases)?", "impact": "RAWeb 10.4 (WCAG 1.4.4) : quand le texte est agrandi, un contenu tronqué, superposé ou qui sort de son cadre devient illisible ou masque des boutons : les personnes malvoyantes qui agrandissent le texte perdent l'information ou ne peuvent plus agir.", "explication": "Agrandis le texte jusqu'à 200 % : avec le zoom du navigateur, puis avec le réglage de la taille du texte seule quand il existe. Parcours tout l'écran : aucun texte ne doit être coupé, superposé à un autre ou masqué, et toutes les fonctions doivent rester disponibles. Un défilement horizontal reste acceptable pour les tableaux et les contenus qui en ont besoin.", "wcag": ["1.4.4"]},
    {"id": "raweb-10-7", "ref": "10.7", "theme_ruxal": "Navigation & structure", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, pour chaque élément recevant le focus du clavier, la prise de focus est-elle visible ?", "libelle_en": "On each web page, for each element receiving keyboard focus, is the focus visible?", "impact": "RAWeb 10.7 (WCAG 1.4.1 / 2.4.7) : sans indicateur de focus visible, l'utilisateur au clavier ne sait plus où il se trouve dans la page et ne peut plus l'utiliser.", "explication": "Parcours la page avec Tab : chaque élément qui reçoit le focus doit être clairement signalé (contour natif non supprimé, ou style de focus défini par le site et bien visible). Cherche dans les styles un outline: none ou outline: 0 sans remplacement.", "wcag": ["1.4.1", "2.4.7"]},
    {"id": "raweb-10-8", "ref": "10.8", "theme_ruxal": "Fondations techniques", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque page web, les contenus cachés ont-ils vocation à être ignorés par les technologies d’assistance ?", "libelle_en": "For each web page, should hidden content be ignored by assistive technologies?", "impact": "RAWeb 10.8 (WCAG 1.3.2 / 4.1.2) : un contenu masqué visuellement mais lu par le lecteur d'écran (ou l'inverse) crée des annonces fantômes, ou cache une information utile aux seuls utilisateurs de lecteur d'écran.", "explication": "Repère les contenus cachés (menus repliés, fenêtres fermées, textes réservés aux lecteurs d'écran). Un contenu caché doit soit être vraiment ignoré par le lecteur d'écran, soit devenir accessible par une action (bouton, onglet). Un élément qu'on atteint au clavier mais que le lecteur d'écran n'annonce pas est non conforme.", "wcag": ["1.3.2", "4.1.2"]},
    {"id": "raweb-10-9", "ref": "10.9", "theme_ruxal": "Couleurs & contrastes", "theme_ref": "10. Présentation de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, l’information ne doit pas être donnée uniquement par la forme, taille ou position. Cette règle est-elle respectée ?", "libelle_en": "On each web page, information must not be conveyed solely by shape, size or location. Is this rule respected?", "impact": "RAWeb 10.9 (WCAG 1.3.3 / 1.4.1) : une information donnée seulement par la forme, la taille ou la position (« cliquez sur le bouton rond », « voir colonne de droite ») est inaccessible à qui ne voit pas la page ou la consulte sur un petit écran.", "explication": "Repère les consignes et repères qui s'appuient sur la forme, la taille ou la position (« bouton à droite », icône seule pour un état, élément actif signalé par sa seule taille). Un autre moyen doit donner la même information (texte visible, intitulé explicite).", "wcag": ["1.3.3", "1.4.1"]},
    {"id": "raweb-10-10", "ref": "10.10", "theme_ruxal": "Couleurs & contrastes", "theme_ref": "10. Présentation de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, l’information ne doit pas être donnée par la forme, taille ou position uniquement. Cette règle est-elle implémentée de façon pertinente ?", "libelle_en": "On each web page, information must not be conveyed by shape, size or location only. Is this rule implemented appropriately?", "impact": "RAWeb 10.10 (WCAG 1.3.3 / 1.4.1) : un moyen de remplacement qui ne fonctionne pas dans tous les contextes (texte masqué non restitué, info-bulle inaccessible au clavier) laisse certains utilisateurs sans l'information.", "explication": "Pour chaque information donnée par la forme, la taille ou la position et doublée par un autre moyen (critère 10.9), vérifie que ce moyen fonctionne vraiment : il doit être visible ou restitué par le lecteur d'écran, et accessible au clavier comme à la souris.", "wcag": ["1.3.3", "1.4.1"]},
    {"id": "raweb-10-14", "ref": "10.14", "theme_ruxal": "Navigation & structure", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, les contenus additionnels apparaissant via les styles CSS uniquement peuvent-ils être rendus visibles au clavier et par tout dispositif de pointage ?", "libelle_en": "On each web page, can additional content that appears using CSS styles only be made visible using the keyboard and any pointing device?", "impact": "RAWeb 10.14 (WCAG 2.1.1) : un contenu qui n'apparaît qu'au survol de la souris (sous-menu, info-bulle CSS) reste hors de portée des utilisateurs de clavier.", "explication": "Repère les contenus qui apparaissent au survol ou au focus grâce aux styles CSS (sous-menus, info-bulles). Au clavier seul, ils doivent aussi apparaître à la prise de focus ou à l'activation du composant (ou d'un autre composant).", "wcag": ["2.1.1"]},
    {"id": "raweb-11-1", "ref": "11.1", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Chaque champ de formulaire a-t-il une étiquette ?", "libelle_en": "Does each form input field have a label?", "impact": "RAWeb 11.1 (WCAG 1.3.1 / 2.4.6 / 3.3.2 / 4.1.2) : un champ sans étiquette est annoncé « zone d'édition » sans autre information : l'utilisateur de lecteur d'écran ne sait pas quoi saisir et le formulaire devient impossible à remplir.", "explication": "Avec le lecteur d'écran, place-toi sur chaque champ (texte, liste, case, bouton radio) : une étiquette doit être annoncée. Dans l'inspecteur, elle passe par une balise label liée au champ, ou par un libellé ARIA. Un texte indicatif dans le champ (placeholder) n'est pas une étiquette.", "wcag": ["1.3.1", "2.4.6", "3.3.2", "4.1.2"]},
    {"id": "raweb-11-2", "ref": "11.2", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Chaque étiquette associée à un champ de formulaire est-elle pertinente (hors cas particuliers) ?", "libelle_en": "Is each label associated with a form input field relevant (excluding special cases)?", "impact": "RAWeb 11.2 (WCAG 2.4.6 / 2.5.3 / 3.3.2) : une étiquette imprécise (« Champ 1 », « Valeur ») fait saisir une mauvaise information ; un nom accessible différent du texte visible empêche aussi la commande vocale de viser le champ.", "explication": "Avec le lecteur d'écran, écoute l'étiquette de chaque champ : elle doit dire précisément ce qui est attendu. Si le champ a un intitulé visible, son nom accessible doit le contenir (attention aux aria-label qui le remplacent par un autre texte).", "wcag": ["2.4.6", "2.5.3", "3.3.2"]},
    {"id": "raweb-11-5", "ref": "11.5", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, les champs de même nature sont-ils regroupés, si nécessaire ?", "libelle_en": "In each form, are the related form controls grouped together, if necessary?", "impact": "RAWeb 11.5 (WCAG 1.3.1 / 3.3.2) : si des champs liés ne sont pas regroupés (boutons radio Oui / Non, jour / mois / année), l'utilisateur de lecteur d'écran entend les choix sans la question à laquelle ils répondent.", "explication": "Repère les champs qui forment un ensemble (boutons radio d'une même question, cases d'une même liste, date en trois champs, adresse) : ils doivent être regroupés dans un fieldset, ou dans un élément avec role=\"group\" (ou radiogroup pour des boutons radio).", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-6", "ref": "11.6", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, chaque regroupement de champs de même nature a-t-il une légende ?", "libelle_en": "In each form, does each group of related form controls have a legend?", "impact": "RAWeb 11.6 (WCAG 1.3.1 / 3.3.2) : un regroupement sans légende ne donne pas la question commune : les choix « Oui » et « Non » restent annoncés sans contexte.", "explication": "Pour chaque regroupement trouvé au critère 11.5, vérifie qu'il a une légende : legend dans le fieldset, ou aria-label ou aria-labelledby sur l'élément role=\"group\". Au lecteur d'écran, la légende doit être annoncée en entrant dans le groupe.", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-7", "ref": "11.7", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, chaque légende associée à un regroupement de champs de même nature est-elle pertinente ?", "libelle_en": "In each form, is each legend associated with a group of related form controls relevant?", "impact": "RAWeb 11.7 (WCAG 1.3.1 / 3.3.2) : une légende vague (« Choix », « Informations ») ne dit pas à quoi répondent les champs du groupe.", "explication": "Lis chaque légende de regroupement : elle doit énoncer la question ou le thème commun aux champs (« Souhaitez-vous recevoir la newsletter ? », « Date de naissance »).", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-9", "ref": "11.9", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, l’intitulé de chaque bouton est-il pertinent (hors cas particuliers) ?", "libelle_en": "In each form, is the label of each button relevant (excluding special cases)?", "impact": "RAWeb 11.9 (WCAG 2.5.3 / 4.1.2) : un bouton sans intitulé ou à l'intitulé vague (« OK », icône seule) ne dit pas ce qu'il va faire ; un nom accessible différent du texte visible gêne aussi la commande vocale.", "explication": "Écoute chaque bouton du formulaire au lecteur d'écran : l'intitulé doit dire l'action (« Envoyer la demande », « Rechercher »), y compris pour un bouton icône. Si le bouton a un texte visible, le nom annoncé doit le contenir.", "wcag": ["2.5.3", "4.1.2"]},
    {"id": "raweb-11-10", "ref": "11.10", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, le contrôle de saisie est-il utilisé de manière pertinente (hors cas particuliers) ?", "libelle_en": "In each form, is the error management used appropriately (excluding special cases)?", "impact": "RAWeb 11.10 (WCAG 3.3.1 / 3.3.2) : un champ obligatoire ou un format attendu signalés seulement par un astérisque coloré, ou des erreurs non reliées à leur champ, font échouer la saisie sans que l'utilisateur comprenne pourquoi.", "explication": "Avant toute saisie, vérifie que les champs obligatoires et les formats attendus (date, téléphone) sont indiqués de façon visible et restitués au lecteur d'écran (dans l'étiquette, ou par required, aria-required ou aria-describedby). Puis envoie le formulaire vide ou mal rempli : chaque message d'erreur doit être visible, nommer le champ concerné et être restitué (étiquette, aria-describedby ou aria-invalid avec son message).", "wcag": ["3.3.1", "3.3.2"]},
    {"id": "raweb-12-6", "ref": "12.6", "theme_ruxal": "Navigation & structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Les zones de regroupement de contenus présentes dans plusieurs pages web (à l’exception des zones principales constituant la structure du document) peuvent-elles être atteintes ou évitées, si nécessaire ?", "libelle_en": "Can content grouping blocks present on several web pages (with the exception of the main regions composing the document structure) be reached or avoided, if necessary?", "impact": "RAWeb 12.6 (WCAG 1.3.1 / 2.4.1 / 4.1.2) : les blocs répétés de page en page (menu secondaire, encart, outils) sans moyen de les identifier ou de les éviter obligent à les reparcourir à chaque page.", "explication": "Repère les zones de contenu qui se répètent sur plusieurs pages, hors en-tête, navigation principale, contenu principal et pied de page. Chacune doit avoir un repère (landmark adapté), un titre, ou pouvoir être masquée ou évitée par un lien ou un bouton placé juste avant.", "wcag": ["1.3.1", "2.4.1", "4.1.2"]},
    {"id": "raweb-12-7", "ref": "12.7", "theme_ruxal": "Navigation & structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, un lien d’évitement ou d’accès rapide à la zone de contenu principal est-il présent (hors cas particuliers) ?", "libelle_en": "On each web page, is there a bypass or skip link to the main content region (excluding special cases)?", "impact": "RAWeb 12.7 (WCAG 2.4.1 / 2.4.3 / 3.2.3) : sans lien d'évitement, l'utilisateur au clavier doit traverser tout l'en-tête et le menu, à chaque page, avant d'atteindre le contenu.", "explication": "Charge la page et appuie sur Tab : un lien « Aller au contenu » (visible au moins quand il reçoit le focus) doit apparaître parmi les premiers et amener réellement le focus au début du contenu principal. Il doit être au même endroit sur toutes les pages.", "wcag": ["2.4.1", "2.4.3", "3.2.3"]},
    {"id": "raweb-12-8", "ref": "12.8", "theme_ruxal": "Navigation & structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, l’ordre de tabulation est-il cohérent ?", "libelle_en": "On each web page, is the navigation sequence consistent?", "impact": "RAWeb 12.8 (WCAG 2.4.3) : un ordre de tabulation illogique désoriente l'utilisateur au clavier, qui saute d'une zone à l'autre et perd le fil.", "explication": "Parcours la page avec Tab et Maj+Tab : l'ordre doit rester logique et suivre le sens de lecture. Vérifie aussi après une action qui insère ou met à jour un contenu (fenêtre modale, message, liste filtrée). Repère les tabindex positifs à l'inspecteur.", "wcag": ["2.4.3"]},
    {"id": "raweb-12-9", "ref": "12.9", "theme_ruxal": "Navigation & structure", "theme_ref": "12. Navigation", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, la navigation ne doit pas contenir de piège au clavier. Cette règle est-elle respectée ?", "libelle_en": "On each web page, navigation must not contain any keyboard traps. Is this rule respected?", "impact": "RAWeb 12.9 (WCAG 2.1.1 / 2.1.2) : un piège au clavier bloque totalement l'utilisateur, qui ne peut plus quitter un composant ni continuer dans la page.", "explication": "Au clavier seul, parcours toute la page, y compris les lecteurs vidéo, cartes, iframes et fenêtres modales : depuis chaque élément, Tab et Maj+Tab (ou une touche dont l'utilisateur est informé, comme les flèches ou Échap) doivent permettre d'en sortir.", "wcag": ["2.1.1", "2.1.2"]},
    {"id": "raweb-12-11", "ref": "12.11", "theme_ruxal": "Composants interactifs", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, les contenus additionnels apparaissant au survol, à la prise de focus ou à l’activation d’un composant d’interface sont-ils si nécessaire atteignables au clavier ?", "libelle_en": "On each web page, is the additional content that appears when hovering, focusing or activating a user interface component accessible by keyboard if necessary?", "impact": "RAWeb 12.11 (WCAG 2.1.1) : un contenu additionnel (sous-menu, info-bulle, panneau) qui apparaît mais reste hors d'atteinte au clavier prive l'utilisateur de ses liens et de ses informations.", "explication": "Fais apparaître chaque contenu additionnel (survol, focus ou activation d'un composant) puis, au clavier, essaie d'y entrer : ses liens, boutons et informations doivent être atteignables avec Tab ou les flèches.", "wcag": ["2.1.1"]},
    {"id": "raweb-13-1", "ref": "13.1", "theme_ruxal": "Composants interactifs", "theme_ref": "13. Consultation", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Pour chaque page web, l’utilisateur a-t-il le contrôle de chaque limite de temps modifiant le contenu (hors cas particuliers) ?", "libelle_en": "For each web page, does the user have control over each time limit modifying the content (excluding special cases)?", "impact": "RAWeb 13.1 (WCAG 2.2.1 / 2.2.2) : une limite de temps non contrôlable (session qui expire, page qui se recharge ou redirige seule) fait perdre la saisie ou le contenu aux personnes qui lisent ou saisissent plus lentement.", "explication": "Repère les rafraîchissements, les redirections automatiques et les limites de session. Pour chacun, l'utilisateur doit pouvoir arrêter ou supprimer la limite, l'allonger, ou être prévenu avant l'échéance avec la possibilité de la prolonger. Une redirection automatique doit être immédiate. Une limite de session d'au moins 20 heures est acceptée.", "wcag": ["2.2.1", "2.2.2"]},
    {"id": "raweb-13-7", "ref": "13.7", "theme_ruxal": "Contenu & lisibilité", "theme_ref": "13. Consultation", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les changements brusques de luminosité ou les effets de flash sont-ils correctement utilisés ?", "libelle_en": "On each web page, are sudden changes in brightness or blinking used correctly?", "impact": "RAWeb 13.7 (WCAG 2.3.1) : un flash ou un changement brusque de luminosité au-delà du seuil peut déclencher une crise chez les personnes épileptiques photosensibles.", "explication": "Repère tout contenu qui clignote ou flashe rapidement (vidéo, animation, image animée). L'effet doit rester sous 3 flashs par seconde, ou couvrir une très petite surface. En cas de doute, utilise un outil d'analyse des flashs.", "wcag": ["2.3.1"]},
    {"id": "raweb-13-8", "ref": "13.8", "theme_ruxal": "Contenu & lisibilité", "theme_ref": "13. Consultation", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, chaque contenu en mouvement ou clignotant est-il contrôlable par l’utilisateur (hors cas particuliers) ?", "libelle_en": "On each web page, is every moving or blinking content controllable by the user (excluding special cases)?", "impact": "RAWeb 13.8 (WCAG 2.2.1 / 2.2.2) : un contenu qui bouge ou clignote sans fin (carrousel, bandeau défilant, animation) gêne la lecture et la concentration, et peut devenir illisible pour certaines personnes.", "explication": "Repère chaque contenu en mouvement ou clignotant lancé automatiquement (carrousel, bandeau défilant, animation) : il doit durer 5 secondes au plus, ou pouvoir être arrêté et relancé, masqué, ou affiché sans mouvement, par un contrôle atteignable au clavier.", "wcag": ["2.2.1", "2.2.2"]},
    {"id": "raweb-13-11", "ref": "13.11", "theme_ruxal": "Composants interactifs", "theme_ref": "13. Consultation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les actions déclenchées au moyen d’un dispositif de pointage sur un point unique de l’écran peuvent-elles faire l’objet d’une annulation (hors cas particuliers) ?", "libelle_en": "On each web page, can actions triggered by a pointing device on a single point on the screen be cancelled (except in special cases)?", "impact": "RAWeb 13.11 (WCAG 2.5.2) : une action déclenchée dès l'appui (mousedown, touchstart) part sur une simple erreur de visée, sans rattrapage possible, ce qui pénalise surtout les personnes qui ont des tremblements ou une motricité réduite.", "explication": "Sur les boutons, liens et contrôles qui déclenchent une action, appuie (souris ou doigt), puis fais glisser le pointeur hors de la cible avant de relâcher : l'action ne doit pas avoir lieu. Elle doit se déclencher au relâchement (événement click) et pas dès l'appui, sauf si l'action peut être annulée ensuite, ou si l'appui est indispensable (touche de piano virtuel, par exemple). À l'inspecteur, repère les gestionnaires mousedown, pointerdown ou touchstart qui déclenchent une action.", "wcag": ["2.5.2"]},
    {"id": "bp1", "horsRef": true, "ref": "", "theme_ruxal": "Composants interactifs", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "1", "niveau": "modere", "niveau_wcag": "", "libelle": "Chaque cible isolée (bouton, icône, case à cocher, lien hors d'un texte) mesure au moins 24×24 px CSS, ou est assez espacée de ses voisines pour être activée sans erreur.", "libelle_en": "Each isolated target (button, icon, checkbox, link outside a text) is at least 24×24 CSS px, or is spaced enough from its neighbours to be activated without error.", "impact": "Une cible trop petite, ou collée à sa voisine, provoque des clics ou des appuis ratés ou involontaires, surtout pour les personnes ayant des tremblements, une préhension limitée, ou sur écran tactile.", "explication": "Mesure à l'inspecteur la zone cliquable réelle des boutons, icônes, cases et liens isolés (pas seulement l'icône visible) : au moins 24 × 24 px CSS, ou assez d'espace autour pour qu'un cercle de 24 px centré sur la cible ne touche aucune autre cible. Les liens dans un paragraphe de texte ne sont pas concernés.", "note": "Pas une exigence du RAWeb 1.1 : le référentiel repose sur les WCAG 2.1, où la taille de cible n'est qu'un critère AAA (2.5.5, 44 × 44 px). Le seuil de 24 px vient du critère 2.5.8 des WCAG 2.2 (niveau AA).", "sources": [{"t": "W3C, WCAG 2.2, SC 2.5.8 Target Size (Minimum), niveau AA : 24×24 px", "u": "https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html"}, {"t": "W3C, WCAG 2.1, SC 2.5.5 Target Size, niveau AAA : 44×44 px", "u": "https://www.w3.org/WAI/WCAG21/Understanding/target-size.html"}]},
    {"id": "bp2", "horsRef": true, "ref": "", "theme_ruxal": "Navigation & structure", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "4", "niveau": "serieux", "niveau_wcag": "", "libelle": "Chaque fenêtre modale se ferme par un bouton visible atteignable au clavier et par la touche Échap.", "libelle_en": "Each modal window closes with a visible button reachable by keyboard and with the Escape key.", "impact": "Sans moyen évident de fermer une fenêtre modale, l'utilisateur au clavier ou au lecteur d'écran reste bloqué devant, ou doit recharger la page et perd ce qu'il faisait.", "explication": "Ouvre chaque fenêtre modale (boîte de dialogue, panneau, bannière de consentement) : elle doit se fermer par un bouton visible et atteignable au clavier, et par la touche Échap. Vérifie aussi que le focus est placé dans la fenêtre à l'ouverture.", "note": "Aucun critère du RAWeb 1.1 ne l'exige en tant que tel ; une fenêtre impossible à quitter au clavier relève en revanche du critère 12.9 (piège au clavier). Pattern décrit par les WAI-ARIA Authoring Practices.", "sources": [{"t": "W3C, WAI-ARIA Authoring Practices, Modal Dialog Pattern (Keyboard Interaction : Échap ferme la fenêtre)", "u": "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}]},
    {"id": "bp3", "horsRef": true, "ref": "", "theme_ruxal": "Navigation & structure", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "4", "niveau": "modere", "niveau_wcag": "", "libelle": "Quand une fenêtre modale se ferme, le focus revient sur l'élément qui l'avait ouverte (s'il existe encore).", "libelle_en": "When a modal window closes, focus returns to the element that opened it (if it still exists).", "impact": "Le focus retombe en haut de la page ou sur un élément sans rapport : l'utilisateur de lecteur d'écran ou de clavier perd sa position et doit reparcourir la page depuis le début.", "explication": "Au clavier, ouvre une fenêtre modale depuis un bouton puis ferme-la (bouton Fermer, Échap) : le focus doit revenir sur ce bouton (ou, s'il n'existe plus, sur un élément logique proche). Un focus perdu ou renvoyé au début de la page est à signaler ; selon l'appréciation de l'auditeur, il peut aussi se rattacher au critère 12.8 (ordre de tabulation).", "note": "Aucun critère du RAWeb 1.1 ne l'exige en tant que tel. Pattern décrit par les WAI-ARIA Authoring Practices.", "sources": [{"t": "W3C, WAI-ARIA Authoring Practices, Modal Dialog Pattern (Keyboard Interaction : le focus revient à l'élément qui a ouvert la fenêtre)", "u": "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}]}
  ];

  function ico(n){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+ICO[n]+'</svg>'; }
  // Deux noms d'élément qui ne diffèrent que par la casse, les accents ou les espaces désignent le même élément.
  function cleNom(n){ return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }

  // Ancienne notation (Écran[type "Libellé"].état) convertie en notation actuelle ("Libellé" type (état)).
  // Le nom d'écran devant les crochets disparaît (l'outil l'ajoute) ; un autre préfixe (ex. bottom menu) devient le conteneur.
  function nomNotation(n, ecrans){

  // Compteur du menu : critères RAWeb non conformes, puis bonnes pratiques non suivies entre parenthèses.
  function compteurNC(nc, bp){

    if(bp) lu.push(bp + (bp > 1 ? ' bonnes pratiques non suivies' : ' bonne pratique non suivie'));

  function refTxt(c){ return c.horsRef ? 'Bonne pratique ' + c.id.replace(/\D/g, '') : 'RAWeb ' + c.ref; }

  // ---------- Fonctions primaires (niveau du projet) ----------
  // Une fonction primaire (navigation principale, recherche...) appartient au projet : testée une fois, ses observations

  var FONCTIONS_DEFAUT = [['nav','Navigation principale'],['menu','Menu ou menu burger'],['recherche','Recherche'],['form','Formulaire type'],

  function fonctions(){ if(!state.fonctions) state.fonctions = FONCTIONS_DEFAUT.map(function(f){ return {id:f[0], nom:f[1], presente:false, etapes:{}}; }); return state.fonctions; }

  function obsFRemplacee(x){ return x.criteres.length > 0 && x.criteres.every(function(id){ return x.n <= dernierRetestF(x.fonction, id); }); }

  function etatFonction(f){

    var refs = []; nc.forEach(function(x){ x.criteres.forEach(function(id){ var r = PAR_ID[id].ref || 'BP'; if(refs.indexOf(r) === -1) refs.push(r); }); });
    var nbE = 0; state.onglets.forEach(function(o){ nbE += ecransFonction(o, f.id).length; });

  // ---------- Calcul des statuts ----------

  // Même règle pour une fonction primaire : son retest annule ses observations plus anciennes sur ce critère.
  function dernierRetestF(fid, cid){
    var n = 0; obsF().forEach(function(y){ if(y.tag === 'nt' && y.fonction === fid && y.criteres.indexOf(cid) > -1 && y.n > n) n = y.n; }); return n;

  // Statut d'un critère sur un écran, tiré des observations. Une observation qui vaut sur plusieurs écrans n'a pas de
  // statut propre : elle s'écrit dans les écrans cochés, comme une saisie faite sur chacun. Un #nc partagé vaut NC ; un #c
  // partagé laisse « à confirmer » (AC) sur les autres écrans, car d'autres éléments peuvent violer le critère.
  function concerne(obs, ecranId, c){

  // ---------- Suggestions par mots-clés ----------

  // Le panneau des étapes occupe toujours la même place et garde la même structure : les étapes, puis « À faire » et « À chercher ».
  // Quand le panneau des étapes défile, il doit être atteignable au clavier pour faire défiler son contenu.
  function focusPanneauEtapes(){

  }
  window.addEventListener('resize', function(){ focusPanneauEtapes(); });
  function vuePanneauEtapes(o){
    var html = '<ol class="liste-etapes" id="liste-etapes">';
    var dansOnglet = !!o && state.vue !== 'projet' && state.vue !== 'referentiel';
    var e = o ? ecranDe(o, state.ecranId) : null;
    var tous = [];
    function pas(marque, txt, sous, ici, fait, fin, action, extra){
      tous.push({txt:txt, sous:sous, ici:ici, fait:fait, action:action, extra:extra || ''});
      var inner = '<span class="rond" aria-hidden="true">'+(fait ? '&#10003;' : marque)+'</span><span class="lib">'+txt+(sous ? '<small>'+sous+'</small>' : '')+(fait ? '<span class="sr"> (fait)</span>' : '')+'</span>';
      var c = (ici ? 'ici ' : '') + (fait ? 'fait' : '');
      var li = '<li class="pas-li'+(fait ? ' ok' : '')+(fin ? ' fin' : '')+'">';
      if(dansOnglet && action) return li+'<button type="button" class="'+c+'" data-action="'+action+'"'+(extra||'')+(ici ? ' aria-current="step"' : '')+'>'+inner+'</button></li>';
      return li+'<span class="pas '+c+'">'+inner+'</span></li>';
    }
    html += '<li class="phase">Avant</li>';
    html += pas(ico('etape-prep'), 'Préparer les écrans', 'noms et contenus', state.vue === 'preparer', !!o && o.ecrans.length > 0, true, 'vue', ' data-vue="preparer"');
    html += '<li class="phase"><span>Étapes, sur tous les écrans</span></li>';
    ETAPES.forEach(function(et, i){
      var fait = !!(o && etapeComplete(o, et.id));
      var sousE = et.outil + (o && dansOnglet && o.ecrans.length ? ' · '+faitsEtape(o, et.id)+'/'+cibles(o).length+' validés' : '');
      html += pas(et.id === 'vide' ? ico('etape-vide') : et.id, et.court || et.nom, sousE, state.vue === 'audit' && state.etape === et.id, fait, i === ETAPES.length - 1, 'etape', ' data-etape="'+et.id+'"');
    });
    html += '<li class="phase">Pour finir</li>';
    if(o && o.type === 'scenario'){
      var ux = scoreUx(o);
      html += pas(ico('etape-ux'), 'Lecture POUR/UX', 'parcours entier', state.vue === 'ux', ux.vide === 0, false, 'vue', ' data-vue="ux"');
    }
    html += pas(ico('etape-grille'), 'Compléter la grille', 'définir les NT', state.vue === 'grille' && ui.grilleFiltre === 'definir', !!(o && o.valide), false, 'grille-definir', '');
    html += pas(ico('etape-resume'), 'Résumé et exports', 'deux taux', state.vue === 'resume', false, true, 'vue', ' data-vue="resume"');
    html += '</ol>';
    // Panneau replié : une ligne de pastilles et l'étape en cours ; la liste détaillée se déplie à la demande.
    var ouvert = state.parcoursOuvert === undefined || state.parcoursOuvert === null ? (state.vue === 'projet' || state.vue === 'referentiel') : !!state.parcoursOuvert;
    var k = -1; tous.forEach(function(t, i){ if(t.ici) k = i; });
    // L'étape en cours dit en clair ce que compte « x/y validés » : les fonctions primaires puis les écrans de l'onglet.
    var avancement = '';
    if(k > -1 && dansOnglet && state.vue === 'audit' && o.ecrans.length){
      var nf = fonctionsOnglet(o).length, ne = o.ecrans.length;

    }
    var resume = k > -1 ? '<p class="en-cours">En cours : '+tous[k].txt+(ETAPE[state.etape] && state.vue === 'audit' ? ' <span class="doux">('+ETAPE[state.etape].outil+')</span>' : (tous[k].sous ? ' <span class="doux">('+tous[k].sous+')</span>' : ''))+'</p>'+avancement : '';
    var points = '<span class="points" aria-hidden="true">'+tous.map(function(t){ return '<i class="'+(t.ici ? 'ici' : t.fait ? 'fait' : '')+'"></i>'; }).join('')+'</span>';

    var ecr = fA ? '<p class="petit doux">Fonction primaire : <b>'+esc(fA.nom)+'</b></p>' : (e && dansOnglet ? '<p class="petit doux">Écran : <b>'+esc(e.nom)+'</b></p>' : '');
    // Navigation sans déplier : étape précédente et suivante, ou reprise à la première étape non faite.
    // Précédente et Suivante ont le même poids : l'action principale reste « Valider puis passer à ».
    function aller(t, sens, lib){ return '<button type="button" class="btn btn-s" data-action="'+t.action+'"'+t.extra+' aria-label="'+lib+' : '+esc(t.txt)+'">'+(sens === 'prec' ? '&larr; ' : '')+lib+(sens === 'suiv' ? ' &rarr;' : '')+'</button>'; }
    var nav = '';
    if(dansOnglet){
      if(k > -1){
        if(k > 0) nav += aller(tous[k - 1], 'prec', 'Précédente');
        if(k < tous.length - 1) nav += aller(tous[k + 1], 'suiv', 'Suivante');
      } else {
        var r = tous.filter(function(t){ return !t.fait; })[0] || tous[tous.length - 1];

    var a = state.vue === 'audit' ? ETAPE[state.etape] : (CONSIGNES[state.vue] || CONSIGNES.projet);
    if(state.vue === 'grille') a = CONSIGNES.grille;

    return html;
  }

  function ligneObs(o, x, e){
