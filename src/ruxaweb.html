    html += '<div class="audit"><nav class="ecrans" aria-label="Écrans et éléments partagés">';
    var fo = fonctionsOnglet(o);
    if(fo.length){
      html += '<div class="carte"><h2>Fonctions primaires</h2>' + fo.map(function(f){
        var fait = vue === 'audit' && (f.etapes || {})[state.etape];
        var nf = obsF().filter(function(x){ return x.fonction === f.id && x.tag === 'nc' && x.criteres.length && !obsFRemplacee(x); }).length;
        return '<button type="button" data-action="cible-fonction" data-id="'+f.id+'"'+(fC === f ? ' aria-current="true"' : '')+'><span>'+(fait ? '<span class="coche" aria-hidden="true">&#10003;</span>' : '')+esc(f.nom)+(fait ? '<span class="sr"> (étape faite)</span>' : '')+'</span><span class="petit">'+(nf ? nf+' NC' : '')+'</span></button>';
      }).join('') + '</div>';
    }
    html += '<div class="carte"><h2>Écrans</h2>';
    o.ecrans.forEach(function(x, i){
      var nc = RAWEB.filter(function(c){ return statutEcran(o, x, c).s === 'NC'; }).length;
      var faitIci = vue === 'audit' && (x.etapes || {})[state.etape];
      html += '<button type="button" data-action="ecran" data-id="'+x.id+'"'+(x.id === e.id && !fC ? ' aria-current="true"' : '')+'><span>'+(faitIci ? '<span class="coche" aria-hidden="true">&#10003;</span>' : '')+(o.type === 'scenario' ? (i+1)+'. ' : '')+esc(x.nom)+(faitIci ? '<span class="sr"> (étape faite)</span>' : '')+'</span><span class="petit">'+(nc ? nc+' NC' : '')+'</span></button>';
    });
    html += '<button type="button" data-action="vue" data-vue="preparer" style="color:var(--accent);font-weight:600;margin-top:4px">Gérer les écrans</button></div>';
    var elts = {};
    // Un élément est répété quand ses observations, une ou plusieurs, touchent au moins deux écrans.
    var libelles = {};
    o.obs.forEach(function(x){ if(x.elementNom){ var k = cleNom(x.elementNom); libelles[k] = libelles[k] || x.elementNom; var l = elts[k] = elts[k] || []; [x.ecran].concat(x.partage ? x.partage.ecrans : []).forEach(function(id){ if(l.indexOf(id) === -1) l.push(id); }); } });
    var noms = Object.keys(elts).filter(function(n){ return elts[n].length > 1; });
    html += '<div class="carte"><h2>Éléments répétés</h2>' + (noms.length ? noms.map(function(n){ return '<div class="elt"><span>'+esc(libelles[n])+'</span><span class="doux petit">'+elts[n].length+' écrans</span></div>'; }).join('')
      : '<p class="doux petit" style="margin:4px 8px">Un élément observé sur plusieurs écrans apparaît ici.</p>') + '</div>';
    return html + '</nav><div class="centre">' + contenu + '</div></div>';
  }
  // Fin d'étape : l'outil passe à la cible suivante (fonction ou écran), puis à l'étape suivante.
  function boutonFin(o, et, curId){
    var nx = ecranSuivant(o, et.id, curId), nxEt = nx ? null : etapeSuivante(o, et);
    var ici = fonctionDe(curId) && fonctionCourante(o) ? 'cette fonction' : 'cet écran';
    var lib = nx ? 'Fait sur '+ici+', '+(nx.type === 'f' ? 'fonction suivante : ' : 'écran suivant : ')+esc(nx.nom) : (nxEt ? 'Fait sur '+ici+', étape suivante : '+esc(nxEt.nom) : 'Fait sur '+ici+', passer à la clôture');
    return '<div class="rangee" style="justify-content:flex-end"><button type="button" class="btn btn-p" data-action="etape-faite">'+lib+'</button></div>';
  }
  function ligneObsF(x){
    var remplacee = x.tag !== 'nt' && obsFRemplacee(x);
    var cl = x.tag === 'nt' ? 'NT' : (x.criteres.length ? x.tag.toUpperCase() : 'NOTE');
    var lib = {C:'C', NC:'NC', NA:'NA', NT:'Retest', NOTE:'Note'}[cl];

      '<span class="texte">'+esc(x.texte)+(x.attendu ? ' <span class="doux">Attendu : '+esc(x.attendu)+'</span>' : '')+'</span>' +
      '<span class="rangee">'+x.criteres.map(function(id){ return '<span class="etiq etiq-ref">'+esc(refTxt(PAR_ID[id]))+'</span>'; }).join('')+(remplacee ? '<span class="doux petit">remplacé par un retest</span>' : '')+'</span></div>' +
      '<span class="rangee" style="flex:none">'+(x.tag === 'nc' && x.criteres.length && !remplacee ? '<button type="button" class="btn btn-s" data-action="retest-fonction" data-id="'+x.id+'">Retester</button>' : '') +
      (x.tag !== 'nt' ? (brouillon.modif === x.id ? '<span class="doux petit">en cours de modification</span>' : '<button type="button" class="btn btn-s" data-action="modif-obs" data-id="'+x.id+'">'+ico('crayon')+'Modifier</button>') : '') +
      '<button type="button" class="btn btn-s btn-danger" data-action="suppr-obs" data-id="'+x.id+'">'+ico('corbeille')+(confirmation === 'obs-'+x.id ? 'Confirmer' : 'Supprimer')+'</button></span></div>';
  }
  function vueFonction(o, f, et){
    var ecr = [];
    state.onglets.forEach(function(x){ ecransFonction(x, f.id).forEach(function(id){ ecr.push((x.id === o.id ? '' : x.nom+' : ')+ecranDe(x, id).nom); }); });
    var html = '<div class="rangee entre"><span class="rangee"><h2 class="titre-ecran">'+esc(f.nom)+'</h2><span class="pastille s-NT">fonction primaire</span></span><span class="doux petit">'+esc(etatFonction(f))+'</span></div>';
    html += '<p class="doux petit" style="margin:0">Vaut sur : '+esc(ecr.join(', '))+'. Une observation ici s\'applique à tous ces écrans, dans tous les onglets du projet.</p>';
    html += formulaireObs(o, null, et, f);

    html += '<section class="carte" aria-labelledby="t-obs"><h2 id="t-obs">Observations de cette fonction ('+liste.length+')</h2>' + (liste.length ? liste.map(ligneObsF).join('') : '<p class="doux">Aucune observation pour l\'instant.</p>') + '</section>';

  function vueAudit(o){

  // ---------- Suggestions par mots-clés ----------

  // Lecture d'un rapport : axe-core (axe.run ou CLI, un objet ou un tableau) ou Lighthouse (rapport JSON).

  // Export CSV de l'extension axe : une colonne de règle, et si possible sélecteur, description, revue manuelle.
  function csvVersListe(texte){

  function aTrancher(o){

  // Clôture critère par critère : un critère à la fois, avec sa consigne, pour définir le statut en connaissance de cause

  // Observation de clôture d'un critère sur un écran (la dernière), modifiable tant qu'on est en clôture.

  // Statut d'un critère sur chaque écran, à poser sans observation (C, NA) ou avec une courte observation (NC).

        (clotureNc === cle ? '<div class="rangee"><label class="sr" for="clo-txt">Observation de non-conformité sur '+esc(e.nom)+'</label><input type="text" id="clo-txt" aria-required="true" placeholder="Observation (obligatoire pour un NC)" autocomplete="off" style="flex:1 1 240px;width:auto"><button type="button" class="btn btn-s btn-p" data-action="clo-nc-ok" data-ecran="'+e.id+'" data-crit="'+c.id+'">Enregistrer</button></div>' : '') +

  function vueCloture(o){

    // Le critère en cours reste affiché une fois son statut défini : le choix reste visible, on passe au suivant quand on veut.

  function ouvrirCritere(id){

  // ---------- Actions ----------
  function focusCloture(){ var h = document.getElementById('clo-titre') || $main.querySelector('h1'); if(h){ h.setAttribute('tabindex','-1'); h.focus(); } }
  function message(txt, erreur){
    var s = document.getElementById('statut'); s.textContent = txt; s.className = erreur ? 'erreur' : ''; s.hidden = false;
    clearTimeout(message.t); message.t = setTimeout(function(){ s.hidden = true; }, 6000);
  }
  function lireBrouillon(){
    var f = document.getElementById('form-obs'); if(!f) return;
    var g = function(id){ var el = document.getElementById(id); return el ? el.value : null; };
    if(g('obs-texte') !== null) brouillon.texte = g('obs-texte');
    if(g('obs-attendu') !== null) brouillon.attendu = g('obs-attendu');
    if(g('obs-partage-nom') !== null) brouillon.nomPartage = g('obs-partage-nom');
    if(g('obs-vers') !== null) brouillon.vers = g('obs-vers');
    var cr = f.querySelectorAll('[data-crit]');
    if(cr.length) brouillon.crits = Array.prototype.filter.call(cr, function(x){ return x.checked; }).map(function(x){ return x.getAttribute('data-crit'); });
    var ep = f.querySelectorAll('[data-ecran-partage]');
    if(ep.length) brouillon.ecransPartage = Array.prototype.filter.call(ep, function(x){ return x.checked; }).map(function(x){ return x.getAttribute('data-ecran-partage'); });
  }
  function viderBrouillon(){ brouillon = {texte:'', attendu:'', point:'', element:'', crits:[], tag:brouillon.modif ? 'nc' : brouillon.tag, nomPartage:'', ecransPartage:[], vers:'', candidat:null, modif:null}; }
  var MAX_AUDIT = 5;
  function nouvelOnglet(type){
    var n = state.onglets.length + 1, sc = type === 'scenario';
    var o = {id:uid(), nom:(sc ? 'Scénario ' : 'Audit ')+n, type:sc ? 'scenario' : 'rapide', ecrans:['Accueil','Écran avec formulaire','Écran au contenu particulier'].map(function(nom){ return {id:uid(), nom:nom, contenus:{}, etapes:{}}; }), obs:[], valide:false};
    state.onglets.push(o); state.ongletId = o.id; state.ecranId = o.ecrans[0].id; state.etape = 'vide'; state.vue = 'preparer';
  }
  function enregistrerObs(){
    lireBrouillon();
    var o = onglet(), e = ecranDe(o, state.ecranId), fE = fonctionCourante(o);
    var texte = brouillon.texte.trim();
    if(!texte){ message('Écris l\'observation avant d\'enregistrer.', true); var t = document.getElementById('obs-texte'); if(t){ t.setAttribute('aria-invalid', 'true'); t.focus(); } return; }
    if(fE){
      var xf = {id:uid(), n:suivant(), fonction:fE.id, etape:state.etape, texte:texte, attendu:brouillon.attendu.trim(), point:brouillon.point, criteres:brouillon.crits.slice(), tag:brouillon.tag, elementNom:fE.nom, partage:null};
      var avf = brouillon.modif ? obsF().filter(function(y){ return y.id === brouillon.modif; })[0] : null;
      if(avf){ xf.id = avf.id; xf.n = avf.n; xf.etape = avf.etape; obsF()[obsF().indexOf(avf)] = xf; } else obsF().push(xf);
      state.onglets.forEach(function(x){ if(fonctionsOnglet(x).indexOf(fE) > -1) x.valide = false; });
      viderBrouillon(); rendre();
      message(avf ? 'Observation modifiée.' : (xf.criteres.length ? 'Observation enregistrée sur '+fE.nom+' : elle vaut sur tous ses écrans, dans tous les onglets.' : 'Note enregistrée : aucun critère, aucun statut modifié.'));
      var tf = document.getElementById('obs-texte'); if(tf) tf.focus();
      return;
    }
    var x = {id:uid(), n:suivant(), ecran:e.id, etape:state.etape, texte:texte, attendu:brouillon.attendu.trim(), point:brouillon.point, criteres:brouillon.crits.slice(), tag:brouillon.tag, partage:null};
    x.elementNom = nomExistant(o, brouillon.nomPartage);
    if(o.type === 'scenario' && brouillon.vers) x.vers = brouillon.vers;
    if(brouillon.ecransPartage.length) x.partage = {nom:x.elementNom, ecrans:brouillon.ecransPartage.slice()};
    if(brouillon.candidat){
      var k = (o.candidats || []).filter(function(y){ return y.id === brouillon.candidat; })[0];
      if(k){ k.etat = 'repris'; x.source = {outil:k.outil, regle:k.regle}; }
    }
    var avant = brouillon.modif ? o.obs.filter(function(y){ return y.id === brouillon.modif; })[0] : null;
    if(avant){
      // Même observation : identifiant, ordre, écran, étape et origine gardés (retests et mémoire Jira restent valables).
      x.id = avant.id; x.n = avant.n; x.ecran = avant.ecran; x.etape = avant.etape; if(avant.source) x.source = avant.source;
      if(x.partage) x.partage.ecrans = x.partage.ecrans.filter(function(id){ return id !== x.ecran; });
      if(x.partage && !x.partage.ecrans.length) x.partage = null;
      o.obs[o.obs.indexOf(avant)] = x;
    } else o.obs.push(x);
    o.valide = false;
    var msg = avant ? 'Observation modifiée.' : (x.criteres.length ? 'Observation enregistrée.' : 'Note enregistrée : aucun critère, aucun statut modifié.');
    if(x.tag === 'nc' && x.criteres.length && !x.attendu) msg += ' Pense à préciser l\'attendu pour le ticket.';
    if(x.partage) msg += ' Elle concerne '+(x.partage.ecrans.length + 1)+' écrans.';
    viderBrouillon(); rendre(); message(msg);
    var t2 = document.getElementById('obs-texte'); if(t2) t2.focus();
  }

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-action]');
    var menu = document.getElementById('menu-fichier');
    if(!ev.target.closest('.menu')){ menu.hidden = true; document.getElementById('btn-menu').setAttribute('aria-expanded','false'); }
    if(!b) return;
    var a = b.getAttribute('data-action'), o = onglet();
    var dansFiche = !!b.closest('#dlg') && ['clo','clo-nc','clo-nc-ok','clo-tous'].indexOf(a) > -1;
    // Un choix dans le menu Fichier le referme (sauf la première demande de « Nouvel audit », qui attend sa confirmation).
    if(b.closest('#menu-fichier') && !(a === 'reinit' && confirmation !== 'reinit')){
      menu.hidden = true; var bm = document.getElementById('btn-menu'); bm.setAttribute('aria-expanded','false');
      setTimeout(function(){ var f = document.activeElement; if(!f || f === document.body || menu.contains(f)) bm.focus(); }, 0);
    }
    if(['suppr-obs','suppr-ecran','suppr-onglet','reinit'].indexOf(a) === -1) confirmation = null;
    lireBrouillon();
    if(a === 'parcours-bascule'){
      var ouvert = b.getAttribute('aria-expanded') === 'true';
      state.parcoursOuvert = !ouvert; sauver();
      $aide.innerHTML = vueAide(onglet()); focusParcours();
      var nb = $aide.querySelector('[data-action="parcours-bascule"]'); if(nb) nb.focus();
      return;
    }
    if(a === 'accueil'){ state.vue = 'accueil'; rendre(true); }
    else if(a === 'referentiel'){ state.vue = 'referentiel'; rendre(true); }
    else if(a === 'imprimer-ref'){ window.print(); }
    else if(a === 'nouvel-onglet'){ nouvelOnglet(b.getAttribute('data-type')); rendre(true); }
    else if(a === 'support'){ state.support = b.getAttribute('data-support'); sauver(); rendre(); }
    else if(a === 'ouvrir'){
      var deja = state.ongletId === b.getAttribute('data-id') && state.vue !== 'accueil';
      state.ongletId = b.getAttribute('data-id'); o = onglet();
      if(!deja || !ecranDe(o, state.ecranId)) state.ecranId = o.ecrans.length ? o.ecrans[0].id : null;
      if(!deja){
        // Reprise : la première étape pas encore faite partout, sur le premier écran qui l'attend.
        var stp = ETAPES.filter(function(et){ return !etapeComplete(o, et.id); })[0];
        state.fonctionId = null;
        if(stp){ state.etape = stp.id; var ne = cibles(o).filter(function(x){ return !cibleFaite(x, stp.id); })[0]; if(ne) allerCible(ne); }
      }
      state.vue = deja || o.obs.length ? 'audit' : 'preparer'; rendre(true);
    }
    else if(a === 'vue'){ var v = b.getAttribute('data-vue'); if(v === 'audit' && o.ecrans.length < (o.type === 'scenario' ? 2 : 3)){ message((o.type === 'scenario' ? 'Un scénario' : 'Un audit simple')+' demande '+(o.type === 'scenario' ? 2 : 3)+' écrans au moins.', true); return; } if(v === 'audit' && state.vue === 'preparer'){ var pc = cibles(o).filter(function(x){ return !cibleFaite(x, state.etape); })[0]; if(pc) allerCible(pc); } state.vue = v; rendre(true); }
    else if(a === 'etape'){ if(o.ecrans.length < (o.type === 'scenario' ? 2 : 3)){ state.vue = 'preparer'; rendre(true); return; } state.etape = b.getAttribute('data-etape'); state.vue = 'audit'; rendre(true); }
    else if(a === 'ecran'){ if(brouillon.modif) viderBrouillon(); state.fonctionId = null; state.ecranId = b.getAttribute('data-id'); rendre(true); }
    else if(a === 'cible-fonction'){ if(brouillon.modif) viderBrouillon(); state.fonctionId = b.getAttribute('data-id'); state.vue = 'audit'; rendre(true); }
    else if(a === 'etape-faite'){
      var cur = cibles(o).filter(function(x){ return x.id === cibleCourante(o); })[0];
      cur.ref.etapes = cur.ref.etapes || {}; cur.ref.etapes[state.etape] = true;
      var e = cur.ref;
      var etC = ETAPE[state.etape], nx = ecranSuivant(o, etC.id, cur.id);
      if(nx){ allerCible(nx); message((nx.type === 'f' ? 'Fonction suivante : ' : 'Écran suivant : ')+nx.nom+', toujours à l\'étape '+etC.nom+'.'); }
      else {
        var suiv = etapeSuivante(o, etC);
        if(suiv){
          state.etape = suiv.id;
          var prem = cibles(o).filter(function(x){ return !cibleFaite(x, suiv.id); })[0]; if(prem) allerCible(prem);
          message('Étape '+etC.nom+' faite sur tous les écrans. Étape suivante : '+suiv.nom+', à partir de '+(prem || e).nom+'.');
        }
        else { state.vue = 'cloture'; message('Toutes les étapes sont faites sur tous les écrans : place à la clôture.'); }
      }
      rendre(true);
    }
    else if(a === 'tag'){ brouillon.tag = b.getAttribute('data-tag'); rendre(); var bt = document.querySelector('.tag[data-tag="'+brouillon.tag+'"]'); if(bt) bt.focus(); }
    else if(a === 'suppr-onglet'){
      var oid = b.getAttribute('data-id'), cible = state.onglets.filter(function(x){ return x.id === oid; })[0]; if(!cible) return;
      if(confirmation !== 'onglet-'+oid){
        confirmation = 'onglet-'+oid; rendre();
        var bc = document.querySelector('[data-action="suppr-onglet"][data-id="'+oid+'"]'); if(bc) bc.focus();
        return;
      }
      confirmation = null;
      state.onglets = state.onglets.filter(function(x){ return x.id !== oid; });
      state.exportesJira = (state.exportesJira || []).filter(function(k){ return k.indexOf(oid + ':') !== 0; });
      if(state.ongletId === oid){ state.ongletId = state.onglets.length ? state.onglets[0].id : null; state.ecranId = null; }
      state.vue = 'accueil'; sauver(); rendre(true); message('Onglet « '+cible.nom+' » supprimé.');
    }
    else if(a === 'modif-obs'){
      var xm = o.obs.concat(obsF()).filter(function(y){ return y.id === b.getAttribute('data-id'); })[0]; if(!xm) return;
      brouillon = {texte:xm.texte, attendu:xm.attendu || '', point:xm.point || '', element:'', crits:xm.criteres.slice(), tag:xm.tag, nomPartage:xm.elementNom || '',
        ecransPartage:xm.partage ? xm.partage.ecrans.slice() : [], vers:xm.vers || '', candidat:null, modif:xm.id};
      rendre(); var tm = document.getElementById('obs-texte'); if(tm){ tm.focus(); tm.scrollIntoView({block:'center'}); }
      message('Observation chargée dans le formulaire : modifie-la, puis enregistre.');
    }
    else if(a === 'retest-fonction'){
      // Retest commun : la fonction est la même partout, le critère repart à NT dans tous les onglets.
      var xr = obsF().filter(function(y){ return y.id === b.getAttribute('data-id'); })[0]; if(!xr) return;
      obsF().push({id:uid(), n:suivant(), fonction:xr.fonction, etape:state.etape, texte:'Retest après correction', attendu:'', point:'', criteres:xr.criteres.slice(), tag:'nt', partage:null});
      state.onglets.forEach(function(x){ x.valide = false; });

    else if(a === 'annuler-modif'){
      viderBrouillon(); rendre(); var ta2 = document.getElementById('obs-texte'); if(ta2) ta2.focus(); message('Modification annulée.');
    }
    else if(a === 'suppr-obs'){
      var id = b.getAttribute('data-id');

    obsF().forEach(function(x){
      var f = fonctionDe(x.fonction);
      if(!f || !f.presente || x.tag !== 'nc' || !x.criteres.length || obsFRemplacee(x)) return;
      var cle = 'projet:' + x.id;
      if(!tout && deja.indexOf(cle) > -1){ ignores++; return; }
      nouveaux.push(cle);
      var ecr = []; state.onglets.forEach(function(o){ ecransFonction(o, f.id).forEach(function(id){ ecr.push((state.onglets.length > 1 ? o.nom+' : ' : '')+ecranDe(o, id).nom); }); });
      lignes.push(ticketJira(x, '['+f.nom+']', '['+f.nom+'] ('+ecr.join(', ')+')'));
      n++;
    });
    if(!n){
      if(ignores) message('Aucun nouveau ticket : '+(ignores > 1 ? 'les '+ignores+' tickets ont déjà été exportés' : 'le ticket a déjà été exporté')+'. Pour les reprendre : Fichier, « Tickets Jira : tout réexporter ».', true);
      else message('Aucun ticket à créer : aucune observation non conforme.', true);
      return;
    }
    telecharger(nomFichier('jira','csv'), '﻿' + lignes.join('\r\n'));
    state.exportesJira = deja.concat(nouveaux.filter(function(k){ return deja.indexOf(k) === -1; })); sauver();
    message((tout ? pluriel(n, 'ticket Jira réexporté', 'tickets Jira réexportés') : pluriel(n, 'nouveau ticket Jira', 'nouveaux tickets Jira'))+' (CSV, à importer dans Jira).'+(ignores ? ' '+pluriel(ignores, 'ticket déjà exporté non repris', 'tickets déjà exportés non repris')+'.' : ''));
  }

  // Classeur Excel écrit sans bibliothèque (archive ZIP sans compression).
  var CRC = (function(){ var t = [], c; for(var n = 0; n < 256; n++){ c = n; for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(u){ var c = 0xFFFFFFFF; for(var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(fichiers){
    var enc = new TextEncoder(), m = [], central = [], off = 0;
    fichiers.forEach(function(f){
      var nom = enc.encode(f.nom), data = enc.encode(f.contenu), crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nom.length, true);
      m.push(new Uint8Array(h.buffer), nom, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nom.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nom);
      off += 30 + nom.length + data.length;
    });
    var tc = central.reduce(function(t, x){ return t + x.length; }, 0), fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, fichiers.length, true); fin.setUint16(10, fichiers.length, true); fin.setUint32(12, tc, true); fin.setUint32(16, off, true);
    var tout = m.concat(central, [new Uint8Array(fin.buffer)]), out = new Uint8Array(tout.reduce(function(t, x){ return t + x.length; }, 0)), p = 0;
    tout.forEach(function(x){ out.set(x, p); p += x.length; });
    return out;
  }
  function xmlEsc(v){ return String(v == null ? '' : v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function col(i){ var t = ''; i++; while(i > 0){ var m = (i - 1) % 26; t = String.fromCharCode(65 + m) + t; i = Math.floor((i - 1) / 26); } return t; }
  var STYLE_STATUT = {C:3, NC:4, NT:5, NA:6};
  function construireXlsx(f){
    var der = col(f.colonnes.length - 1) + (f.lignes.length + 1);
    var cel = function(r, v, s){ return '<c r="'+r+'" t="inlineStr" s="'+s+'"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>'; };
    var rows = ['<row r="1">' + f.colonnes.map(function(c, i){ return cel(col(i)+'1', c.titre, 1); }).join('') + '</row>'];
    f.lignes.forEach(function(l, r){ rows.push('<row r="'+(r+2)+'">' + l.map(function(v, i){ return cel(col(i)+(r+2), v, (f.colonnes[i].statut && STYLE_STATUT[v]) ? STYLE_STATUT[v] : 2); }).join('') + '</row>'); });
    var ent = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', NS = 'http://schemas.openxmlformats.org/', NSR = NS+'officeDocument/2006/relationships';
    var fill = function(rgb){ return '<fill><patternFill patternType="solid"><fgColor rgb="FF'+rgb+'"/><bgColor indexed="64"/></patternFill></fill>'; };
    var xf = function(p, fo, c){ return '<xf numFmtId="49" fontId="'+p+'" fillId="'+fo+'" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"'+(c ? ' horizontal="center"' : '')+'/></xf>'; };
    return zip([
      {nom:'[Content_Types].xml', contenu: ent+'<Types xmlns="'+NS+'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
      {nom:'_rels/.rels', contenu: ent+'<Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NSR+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
      {nom:'xl/workbook.xml', contenu: ent+'<workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NSR+'"><sheets><sheet name="'+xmlEsc(f.nom)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
      {nom:'xl/_rels/workbook.xml.rels', contenu: ent+'<Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NSR+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+NSR+'/styles" Target="styles.xml"/></Relationships>'},
      {nom:'xl/styles.xml', contenu: ent+'<styleSheet xmlns="'+NS+'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="7"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+fill('E0EEF2')+fill('E0F3E8')+fill('FBE5E2')+fill('FBF1D3')+fill('E6ECF0')+'</fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+xf(1,2,false)+xf(0,0,false)+xf(1,3,true)+xf(1,4,true)+xf(1,5,true)+xf(1,6,true)+'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
      {nom:'xl/worksheets/sheet1.xml', contenu: ent+'<worksheet xmlns="'+NS+'spreadsheetml/2006/main"><dimension ref="A1:'+der+'"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+f.colonnes.map(function(c, i){ return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c.largeur+'" customWidth="1"/>'; }).join('')+'</cols><sheetData>'+rows.join('')+'</sheetData><autoFilter ref="A1:'+der+'"/></worksheet>'}
    ]);
  }

  // La hauteur de l'en-tête change avec la largeur (onglets, retour à la ligne) : l'aide se cale toujours dessous.
  (function(){
    var barre = document.querySelector('header.barre');
    function caler(){ document.documentElement.style.setProperty('--barre-h', barre.offsetHeight + 'px'); focusParcours(); }
    caler();
    if(window.ResizeObserver) new ResizeObserver(caler).observe(barre); else window.addEventListener('resize', caler);
  })();

  window.RUXAWEB = {state: function(){ return state; }, taux: function(id, elargi){ var o = state.onglets.filter(function(x){ return x.id === id; })[0]; return taux(o, elargi ? RAWEB : SELECTION); }, version: VERSION};
  rendre();
})();
