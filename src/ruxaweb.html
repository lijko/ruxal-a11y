<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* Jetons de design (couleurs des deux thèmes, rayons, ombres). */
  :root{
    --ink:#1c2630; --ink-soft:#4a5864; --ink-faint:#5c6a76;
    --surface:#ffffff; --surface-alt:#f1f4f6; --surface-raised:#ffffff;
    --border:#cdd6dc; --border-soft:#e3e8ec;
    --accent:#2f6a7d; --accent-soft:#e0eef2; --accent-ink:#ffffff;
    --c-conforme:#1f7a4d; --c-conforme-soft:#e0f3e8;
    --c-nc:#b83a30; --c-nc-soft:#fbe5e2;
    --c-nt:#7a5c00; --c-nt-soft:#fbf1d3; --c-nt-ink:#3d2e00;
    --c-na:#4d5f6c; --c-na-soft:#e6ecf0;
    /* Badges d'approche (RAWeb / POUR·UX) : hors de la famille bleue pour ne pas se fondre dans l'onglet actif. */
    --c-ref:#6b4fd1; --c-ref-ink:#ffffff;
    --c-pourux:#a82f93; --c-pourux-ink:#ffffff;
    --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(20,30,40,.08), 0 4px 14px rgba(20,30,40,.08);
    --shadow-pop:0 6px 20px rgba(20,30,40,.16);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7edf2; --ink-soft:#aebac3; --ink-faint:#748089;
      --surface:#141a1f; --surface-alt:#1b232a; --surface-raised:#1c252c;
      --border:#2c363f; --border-soft:#242e36;
      --accent:#84a7b1; --accent-soft:#20343c; --accent-ink:#0d1418;
      --c-conforme:#57b585; --c-conforme-soft:#17301f;
      --c-nc:#e2776e; --c-nc-soft:#3a201d;
      --c-nt:#d8b969; --c-nt-soft:#332a15; --c-nt-ink:#241d08;
      --c-na:#93a7b6; --c-na-soft:#1e2932;
      --c-ref:#a58ff0; --c-ref-ink:#1c1533;
      --c-pourux:#e08fce; --c-pourux-ink:#2e1526;
      --radius:10px; --radius-lg:14px;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.22);
      --shadow-pop:0 6px 20px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7edf2; --ink-soft:#aebac3; --ink-faint:#748089;
    --surface:#141a1f; --surface-alt:#1b232a; --surface-raised:#1c252c;
    --border:#2c363f; --border-soft:#242e36;
    --accent:#84a7b1; --accent-soft:#20343c; --accent-ink:#0d1418;
    --c-conforme:#57b585; --c-conforme-soft:#17301f;
    --c-nc:#e2776e; --c-nc-soft:#3a201d;
    --c-nt:#d8b969; --c-nt-soft:#332a15; --c-nt-ink:#241d08;
    --c-na:#93a7b6; --c-na-soft:#1e2932;
    --c-ref:#a58ff0; --c-ref-ink:#1c1533;
    --c-pourux:#e08fce; --c-pourux-ink:#2e1526;
    --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.22);
    --shadow-pop:0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--surface-alt);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .lien-evitement{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:30}
  .lien-evitement:focus{top:8px}

  header.barre{position:sticky;top:0;z-index:10;background:var(--surface-raised);border-bottom:1px solid var(--border)}
  .barre-in{max-width:1440px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
  .marque{font-weight:800;font-size:18px;background:none;border:0;padding:4px 0;cursor:pointer}
  .marque small{font-weight:600;color:var(--ink-soft);font-size:13px;margin-left:6px}
  .barre input.nom-audit{flex:1 1 220px;width:auto;max-width:380px;min-height:40px;font-weight:600;border:1px solid transparent;background:transparent;color:var(--ink)}
  .barre input.nom-audit:hover,.barre input.nom-audit:focus{border-color:var(--border);background:var(--surface)}
  .barre .tags .tag{min-height:34px;font-weight:700}
  .vide{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:56px 16px}
  .vide p{margin:0;color:var(--ink-soft);max-width:46ch}
  .vide-choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:620px}
  .vide-choix .tuile{min-height:120px;justify-content:center}
  .vide-choix .tuile b{color:var(--accent)}
  nav.onglets{max-width:1440px;margin:0 auto;padding:0 24px 10px;display:flex;gap:6px;overflow-x:auto}
  .onglet-tab{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;text-align:left;padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;min-width:130px}
  .onglet-tab b{font-size:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .onglet-tab span{font-size:11.5px;color:var(--ink-soft)}
  .onglet-tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .onglet-tab[aria-current="page"] span{color:var(--accent-ink);opacity:.85}
  .onglet-tab.ajout{border-style:dashed;color:var(--ink-soft);font-weight:700;justify-content:center;min-width:0}
  .onglet-tab.ajout:hover{border-color:var(--accent);color:var(--accent)}
  nav.onglet-nav{display:flex;gap:4px;flex-wrap:wrap}
  nav.onglet-nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer;color:var(--ink-soft);font-weight:600}
  nav.onglet-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
  .espace{flex:1}
  .menu{position:relative}
  .menu-liste{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;min-width:260px;display:flex;flex-direction:column;z-index:20;box-shadow:var(--shadow-pop)}
  .menu-liste button{text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
  .menu-liste button:hover{background:var(--accent-soft)}

  .page{max-width:1440px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
  aside.aide{flex:1 1 280px;max-width:340px;position:sticky;top:calc(var(--barre-h, 130px) + 20px);max-height:calc(100vh - var(--barre-h, 130px) - 40px);overflow-y:auto;background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  html{scroll-padding-top:calc(var(--barre-h, 130px) + 16px)}
  aside.aide h2{margin:0;font-size:16px}
  aside.aide h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  aside.aide p{margin:0}
  aside.aide:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .parcours-court{display:flex;flex-direction:column;gap:6px}
  .parcours-court .points{display:flex;gap:5px;flex-wrap:wrap}
  .parcours-court .points i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-faint);background:var(--surface)}
  .parcours-court .points i.fait{background:var(--c-conforme);border-color:var(--c-conforme)}
  .parcours-court .points i.ici{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .parcours-court .en-cours{font-weight:700}
  .nav-parcours{gap:8px;flex-wrap:wrap}
  .lien-parcours{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .lien-parcours:hover{text-decoration-thickness:2px}
  .parcours{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .parcours .phase{display:flex;flex-direction:column;gap:6px;padding:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
  .parcours .phase:first-child{padding-top:0}
  .parcours .phase b{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
  .prog{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px}
  .prog span.barre-prog{flex:1;height:6px;border-radius:99px;background:var(--border-soft);overflow:hidden}
  .prog span.barre-prog i{display:block;height:100%;background:var(--c-conforme);border-radius:99px}
  .parcours .pas-li{position:relative}
  .parcours .pas-li:not(.fin)::after{content:"";position:absolute;left:21px;top:40px;bottom:-6px;width:2px;background:var(--border);border-radius:2px}
  .parcours .pas-li.ok:not(.fin)::after{background:var(--c-conforme)}
  .parcours button,.parcours span.pas{position:relative;z-index:1;width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-radius:12px;padding:6px 8px;min-height:46px}
  .parcours button{cursor:pointer}
  .parcours button:hover{background:var(--surface-alt)}
  .parcours .lib{display:flex;flex-direction:column;line-height:1.25}
  .parcours .lib small{font-size:12px;color:var(--ink-soft);font-weight:500}
  .parcours .rond{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-soft)}
  .parcours .rond svg{width:15px;height:15px}
  .parcours .fait .rond{background:var(--c-conforme);border-color:var(--c-conforme);color:var(--surface)}
  .parcours .ici{background:var(--accent-soft)}
  .parcours .ici .lib{font-weight:800;color:var(--accent)}
  .parcours .ici .rond{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft),0 0 0 6px var(--accent)}
  @media (prefers-reduced-motion: no-preference){ .parcours .ici .rond{transition:box-shadow .2s} }

  h1{margin:0;font-size:24px;text-wrap:balance}
  h2{font-size:16px;font-weight:800;margin:0}
  .carte{background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
  .pile{display:flex;flex-direction:column;gap:12px}
  .rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .entre{justify-content:space-between}
  .doux{color:var(--ink-soft)}
  .petit{font-size:13px}
  .btn{min-height:44px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .btn-p:hover{filter:brightness(1.06)}
  .btn-l{border-color:var(--accent);color:var(--accent)}
  .btn-d{border-style:dashed}
  .btn-s{min-height:36px;padding:0 10px;font-size:13px}
  .btn-danger{border-color:var(--c-nc);color:var(--c-nc)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  label.lbl,.lbl{font-weight:700;font-size:13px;color:var(--ink-soft)}
  input[type=text],select,textarea{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:9px 12px;min-height:44px;width:100%}
  textarea{resize:vertical;min-height:72px}
  .champ{display:flex;flex-direction:column;gap:4px;min-width:0}
  .grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .choix{display:flex;gap:10px;align-items:center;min-height:36px}
  .choix input{width:18px;height:18px;accent-color:var(--accent);flex:none}

  .tuile-bloc{display:flex;flex-direction:column;gap:8px}
  .tuile-bloc .tuile{flex:1}
  .tuile-bloc .btn-danger{align-self:flex-start}
  .sous-titre-form{margin:6px 0 -4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--border);padding-top:12px}
  .tags.tags-resultat{align-self:flex-start}
  .pied-form{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;margin-top:4px}
  .form-modif{outline:2px solid var(--accent);outline-offset:2px}
  .ico{width:16px;height:16px;flex:none;margin-right:6px}
  .btn{display:inline-flex;align-items:center;justify-content:center}
  .consigne summary{cursor:pointer;font-weight:700;color:var(--accent)}
  .consigne textarea{width:100%;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .sugg:empty{display:none}
  .pastille-btn{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:800;text-decoration:underline;text-underline-offset:2px}
  .oblig{color:var(--c-nc);font-weight:800;margin-left:3px}
  [aria-invalid="true"]{border-color:var(--c-nc) !important;box-shadow:0 0 0 1px var(--c-nc)}
  .prefixe-projet{font-weight:800;white-space:nowrap}
  .tuile-avenir{opacity:1;border-style:dashed;cursor:default;box-shadow:none}
  .fonction-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--border)}
  .fonction-nom{flex:1 1 240px}
  .fonction-ecrans{border:0;margin:0;padding:0 0 0 48px;display:flex;flex-wrap:wrap;gap:4px 18px;flex-basis:100%}
  .coche{color:var(--c-conforme);font-weight:800;margin-right:6px}
  .grav{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:2px}
  .grav::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ink-faint);vertical-align:1px}
  .grav-critique::before{background:var(--c-nc)} .grav-serieux::before{background:var(--c-nt)}
  h3 .grav{vertical-align:middle;margin:0 0 0 8px}
  .ref-groupe{display:flex;flex-direction:column;gap:10px}
  .ref-groupe h2{margin:8px 0 0;font-size:18px}
  .ref-fiche{gap:6px}
  @media print{
    :root{color-scheme:light}
    body{background:#fff !important}
    .barre,aside.aide,.lien-evitement,.ref-tete button,.ref-outils,#statut{display:none !important}
    .page{display:block;padding:0;max-width:none;zoom:.8}
    .carte{box-shadow:none !important;border:1px solid #888 !important;background:#fff !important;break-inside:avoid;display:block !important;margin-bottom:10px}
    .carte > * + *{margin-top:6px !important}
    main,.ref-groupe{display:block !important}
    .ref-groupe h2{break-after:avoid;margin:14px 0 8px !important}
    main,main *{color:#000 !important}
    a{text-decoration:underline}
  }
  .pastille{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;flex:none}
  .s-C{background:var(--c-conforme-soft);color:var(--c-conforme)} .s-NC{background:var(--c-nc-soft);color:var(--c-nc)}
  .s-NT{background:var(--c-nt-soft);color:var(--c-nt)} .s-NA{background:var(--c-na-soft);color:var(--c-na)}
  .s-AC{background:var(--c-nt-soft);color:var(--c-nt);outline:1px dashed var(--c-nt);outline-offset:-1px}
  .s-NOTE{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border)}
  .etiq{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--c-ref);color:var(--c-ref-ink)}
  .etiq-ref{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* Interrupteur à trois positions : une seule position allumée, les autres éteintes. */
  .tags{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none;align-self:center}
  .tag{min-width:48px;min-height:36px;padding:0 12px;border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-weight:800;font-size:13px}
  .tag:last-child{border-right:0}
  .tag:hover{background:var(--surface-alt);color:var(--ink)}
  .tag[disabled]{cursor:not-allowed}
  .tag:not(.tag-c):not(.tag-nc):not(.tag-na)[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .tag-c[aria-pressed="true"]{background:var(--c-conforme);color:var(--accent-ink)}
  .tag-nc[aria-pressed="true"]{background:var(--c-nc);color:var(--accent-ink)}
  .tag-na[aria-pressed="true"]{background:var(--c-na);color:var(--accent-ink)}
  .tag:focus-visible{outline-offset:-3px}

  .audit{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .ecrans{flex:1 1 200px;max-width:250px;display:flex;flex-direction:column;gap:12px}
  .ecrans .carte{padding:8px;display:flex;flex-direction:column;gap:2px}
  .ecrans h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:4px 8px}
  .ecrans button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px;min-height:40px;cursor:pointer}
  .ecrans button:hover{background:var(--surface-alt)}
  .ecrans button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .ecrans .elt{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;font-size:14px}
  .centre{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .titre-onglet{margin-bottom:-4px}
  h2.titre-ecran{font-size:22px}
  th.col-ici{color:var(--accent)}
  td.col-ici{background:var(--accent-soft)}
  .obs{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-soft)}
  .obs:last-child{border-bottom:0}
  .obs .corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .obs .texte{overflow-wrap:anywhere}
  .obs.invalide .texte{text-decoration:line-through;color:var(--ink-soft)}
  .crit-choix{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius);padding:6px 10px}
  .ailleurs{border:1px dashed var(--c-ref);border-radius:var(--radius);padding:12px}

  .tableau{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-raised);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top}
  thead th{position:sticky;top:0;background:var(--surface-alt);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
  tbody th{font-weight:400}
  tr.theme th{background:var(--surface-alt);font-weight:800;font-size:13px}
  .ref-btn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  td.statut{text-align:center;white-space:nowrap}
  thead th.col-ecran{white-space:normal;text-align:center;min-width:72px;max-width:120px}
  td.intitule{min-width:260px}

  .taux{display:flex;flex-wrap:wrap;gap:16px 48px;align-items:flex-end}
  .taux .val{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .taux .val.second{color:var(--ink-soft);font-size:32px}
  .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .tuile{text-align:left;background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-height:140px}
  .tuile:hover{border-color:var(--accent)}
  .tuile b{font-size:17px}
  .tuile .val{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
  .tuile.nouveau{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700;align-items:center;justify-content:center}
  .ecran-ligne{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft)}
  .ecran-ligne:last-child{border-bottom:0}
  .ecran-ligne input[type=text]{flex:1 1 200px;width:auto}
  .contenus{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
  .switch{position:relative;width:40px;height:24px;border-radius:99px;border:1px solid var(--ink-soft);background:var(--surface-alt);cursor:pointer;padding:0;vertical-align:middle;flex:none}
  .switch .bouton{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-soft);box-shadow:0 1px 2px rgba(0,0,0,.35)}
  .switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .switch[aria-checked="true"] .bouton{left:18px;background:var(--accent-ink)}
  @media (prefers-reduced-motion: no-preference){ .switch .bouton{transition:left .15s} }
  table.contenus-table th,table.contenus-table td{text-align:center}
  table.contenus-table th:first-child,table.contenus-table tbody th{text-align:left}
  /* Colonnes d'écrans de même largeur, quelle que soit la longueur de leur nom. */
  table.contenus-table{table-layout:fixed;width:100%}
  table.contenus-table thead th:first-child{width:28%}
  table.contenus-table thead th{white-space:normal;overflow-wrap:break-word;hyphens:auto;vertical-align:bottom}
  .puce{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 12px;min-height:34px;cursor:pointer;font-size:13px;background:var(--surface)}
  .puce[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

  dialog{border:1px solid var(--border);border-radius:var(--radius-lg);padding:0;max-width:720px;width:calc(100% - 32px);background:var(--surface-raised);color:var(--ink);box-shadow:var(--shadow-pop)}
  dialog::backdrop{background:rgba(10,15,20,.5)}
  .dlg{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:80vh;overflow:auto}
  .dlg h2{font-size:19px}
  #statut{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface-alt);padding:10px 16px;border-radius:var(--radius);max-width:min(560px,calc(100% - 32px));z-index:40;font-weight:600}
  #statut.erreur{background:var(--c-nc);color:var(--surface)}
  footer.pied{max-width:1440px;margin:0 auto;padding:0 24px 32px;font-size:12.5px;color:var(--ink-soft)}
  @media (max-width:900px){ aside.aide{position:static;max-width:none;max-height:none;flex-basis:100%;order:-1} }
  /* Écran large : la page défile normalement ; l'en-tête, la colonne des écrans, l'aide et l'en-tête de la grille restent visibles. */
  @media (min-width:901px){
    .ecrans{position:sticky;top:calc(var(--barre-h, 130px) + 20px);max-height:calc(100vh - var(--barre-h, 130px) - 40px);overflow-y:auto}
    .tableau{overflow:visible}
    .tableau.large{overflow-x:auto}
    thead th{top:var(--barre-h, 130px);z-index:2}
  }
  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

    {"id": "raweb-1-2", "ref": "1.2", "theme_ruxal": "Images & Médias", "theme_ref": "1. Images", "niveau": "mineur", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Chaque image de décoration, sans légende, est-elle correctement ignorée par les technologies d’assistance ?", "impact": "RAWeb 1.2 (WCAG 1.1.1 / 4.1.2) : une image décorative non masquée est annoncée inutilement par le lecteur d'écran (nom de fichier, « image »), ce qui alourdit l'écoute sans rien apporter.", "explication": "À l'inspecteur, repère les images purement décoratives (fond, séparateur, illustration d'ambiance) : une balise img doit avoir alt=\"\" et aucun autre attribut d'alternative (title, aria-label) ; un svg, un canvas ou un object décoratif doit porter aria-hidden=\"true\". Une image décorative accompagnée d'une légende relève du critère 1.1, pas de celui-ci.", "wcag": ["1.1.1", "4.1.2"]},
    {"id": "raweb-1-3", "ref": "1.3", "theme_ruxal": "Images & Médias", "theme_ref": "1. Images", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque image porteuse d’information ayant une alternative textuelle, cette alternative est-elle pertinente (hors cas particuliers) ?", "impact": "RAWeb 1.3 (WCAG 1.1.1 / 4.1.2) : une alternative non pertinente (vide, générique comme « image » ou « logo », ou erronée) prive l'utilisateur de lecteur d'écran de l'information que l'image donne aux autres.", "explication": "Ne vérifie pas seulement la présence de l'alternative mais son contenu, tel que l'annonce le lecteur d'écran : il doit transmettre la même information que l'image, et pour une image lien ou bouton, sa fonction ou sa destination (« Accueil », pas « logo »). L'alternative doit rester courte ; une information longue relève de la description détaillée (critère 1.6).", "wcag": ["1.1.1", "4.1.2"]},
    {"id": "raweb-1-4", "ref": "1.4", "theme_ruxal": "Images & Médias", "theme_ref": "1. Images", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "captcha", "etape": "3a", "libelle": "Pour chaque image utilisée comme CAPTCHA ou comme image-test, ayant une alternative textuelle, cette alternative permet-elle d’identifier la nature et la fonction de l’image ?", "impact": "RAWeb 1.4 (WCAG 1.1.1) : sans alternative qui identifie sa nature, l'utilisateur de lecteur d'écran ne comprend pas qu'il fait face à un CAPTCHA, ni ce qu'on attend de lui.", "explication": "Avec le lecteur d'écran, place-toi sur le CAPTCHA imagé : ce qui est annoncé doit dire ce que c'est et ce qu'il faut faire (par exemple « Code de sécurité à recopier »), sans donner la réponse. Une alternative vide ou « image » est non conforme.", "wcag": ["1.1.1"]},
    {"id": "raweb-1-5", "ref": "1.5", "theme_ruxal": "Images & Médias", "theme_ref": "1. Images", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "captcha", "etape": "1", "libelle": "Pour chaque image utilisée comme CAPTCHA, une solution d’accès alternatif au contenu ou à la fonction du CAPTCHA est-elle présente ?", "impact": "RAWeb 1.5 (WCAG 1.1.1) : sans alternative au CAPTCHA visuel, les personnes aveugles ou malvoyantes sont totalement bloquées : elles ne peuvent ni s'inscrire, ni se connecter, ni envoyer le formulaire.", "explication": "Le CAPTCHA visuel doit proposer au moins une autre forme non graphique (CAPTCHA audio, question logique) ou une autre solution d'accès à la même fonction (contact par téléphone ou par courriel, par exemple). Vérifie que cette alternative existe vraiment et qu'elle est utilisable au clavier.", "wcag": ["1.1.1"]},
    {"id": "raweb-1-6", "ref": "1.6", "theme_ruxal": "Images & Médias", "theme_ref": "1. Images", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "image-complexe", "etape": "3a", "libelle": "Chaque image porteuse d’information a-t-elle, si nécessaire, une description détaillée ?", "impact": "RAWeb 1.6 (WCAG 1.1.1) : sans description détaillée, une image complexe (graphique, schéma, carte, infographie) reste incompréhensible pour l'utilisateur de lecteur d'écran, même avec une alternative courte.", "explication": "Pour chaque image complexe, cherche une description détaillée en plus de l'alternative courte : texte adjacent signalé par l'alternative, lien ou bouton vers une description, ou aria-describedby. Le lecteur d'écran doit permettre de la trouver depuis l'image.", "wcag": ["1.1.1"]},

    {"id": "raweb-2-1", "ref": "2.1", "theme_ruxal": "Navigation & Structure", "theme_ref": "2. Cadres", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "cadre", "etape": "2", "libelle": "Chaque cadre a-t-il un titre de cadre ?", "impact": "RAWeb 2.1 (WCAG 4.1.2) : un cadre sans titre est annoncé « cadre » sans autre information : l'utilisateur de lecteur d'écran ne sait pas ce qu'il contient (vidéo, carte, formulaire externe) avant d'y entrer.", "explication": "Repère les contenus intégrés dans un cadre (vidéo, carte, formulaire externe : balise iframe). Dans l'inspecteur, chaque cadre doit avoir un titre (attribut title), que le lecteur d'écran annonce en entrant dans le cadre. Note aussi un titre vide de sens (« iframe », un nom de fichier).", "wcag": ["4.1.2"]},
    {"id": "raweb-3-1", "ref": "3.1", "theme_ruxal": "Couleurs & Contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, l’information ne doit pas être donnée uniquement par la couleur. Cette règle est-elle respectée ?", "impact": "RAWeb 3.1 (WCAG 1.3.1 / 1.4.1) : les personnes daltoniennes, malvoyantes ou utilisant un lecteur d'écran ne perçoivent pas une information donnée seulement par la couleur (champ en erreur en rouge, statut vert ou rouge, lien seulement coloré dans un texte).", "explication": "Repère les cas où seule la couleur porte l'information (texte en rouge pour une erreur, légende de graphique par couleur, lien distingué du texte par sa seule couleur, onglet actif). Un autre repère visible doit exister (texte, icône, soulignement, motif) et l'information doit aussi être restituée au lecteur d'écran. Astuce : affiche la page en niveaux de gris.", "wcag": ["1.3.1", "1.4.1"]},
    {"id": "raweb-3-2", "ref": "3.2", "theme_ruxal": "Couleurs & Contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, le contraste entre la couleur du texte et la couleur de son arrière-plan est-il suffisamment élevé (hors cas particuliers) ?", "impact": "RAWeb 3.2 (WCAG 1.4.3) : un contraste insuffisant rend le texte difficile ou impossible à lire pour les personnes malvoyantes, âgées, ou qui consultent la page en plein soleil.", "explication": "Mesure le contraste entre le texte et son fond avec un outil de mesure du contraste, en priorité sur les textes clairs ou petits, posés sur une image ou un dégradé, et dans les états au survol et au focus. Seuils : 4,5:1 pour le texte courant, 3:1 pour un texte d'au moins 24 px, ou 18,5 px en gras.", "wcag": ["1.4.3"]},
    {"id": "raweb-3-3", "ref": "3.3", "theme_ruxal": "Couleurs & Contrastes", "theme_ref": "3. Couleurs", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les couleurs utilisées dans les composants d’interface ou les éléments graphiques porteurs d’informations sont-elles suffisamment contrastées (hors cas particuliers) ?", "impact": "RAWeb 3.3 (WCAG 1.4.11) : une icône, une bordure de champ, un indicateur de focus ou un graphique trop peu contrasté passe inaperçu pour les personnes malvoyantes ou qui consultent sur un écran au soleil : elles ne trouvent pas le champ à remplir ni l'élément actif.", "explication": "Repère les éléments graphiques qui portent une information ou permettent d'agir : icônes seules, bordures de champs, cases à cocher, boutons sans fond, indicateur de focus, courbes et zones de graphique. Mesure le contraste de chacun avec la couleur voisine : il doit atteindre au moins 3:1. Les éléments purement décoratifs et les composants désactivés ne sont pas concernés.", "wcag": ["1.4.11"]},
    {"id": "raweb-4-1", "ref": "4.1", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque média temporel pré-enregistré a-t-il, si nécessaire, une transcription textuelle ou une audiodescription (hors cas particuliers) ?", "impact": "RAWeb 4.1 (WCAG 1.2.1 / 1.2.3) : sans transcription ni audiodescription, une personne sourde, aveugle ou sourdaveugle n'a pas accès au contenu d'un audio ou d'une vidéo pré-enregistrés.", "explication": "Pour chaque audio seul, cherche une transcription textuelle adjacente ou liée. Pour chaque vidéo pré-enregistrée, cherche une transcription ou une version audiodécrite. L'alternative doit être atteignable depuis le média, au clavier et au lecteur d'écran.", "wcag": ["1.2.1", "1.2.3"]},
    {"id": "raweb-4-2", "ref": "4.2", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Pour chaque média temporel pré-enregistré ayant une transcription textuelle ou une audiodescription synchronisée, celles-ci sont-elles pertinentes (hors cas particuliers) ?", "impact": "RAWeb 4.2 (WCAG 1.2.1 / 1.2.3) : une transcription ou une audiodescription incomplète fait manquer une partie de l'information (paroles résumées, informations visuelles absentes).", "explication": "Compare la transcription ou l'audiodescription au média : toutes les paroles et les informations visuelles utiles (texte affiché, actions, changements de lieu) doivent s'y retrouver, dans le bon ordre.", "wcag": ["1.2.1", "1.2.3"]},
    {"id": "raweb-4-3", "ref": "4.3", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque média temporel synchronisé a-t-il, si nécessaire, des sous-titres synchronisés (hors cas particuliers) ?", "impact": "RAWeb 4.3 (WCAG 1.2.2 / 1.2.4) : sans sous-titres, les personnes sourdes ou malentendantes n'ont accès à aucune parole de la vidéo.", "explication": "Lis la vidéo : si le son porte de l'information (quelqu'un parle, par exemple), des sous-titres synchronisés doivent pouvoir s'afficher, directement ou dans une version sous-titrée. Les sous-titres incrustés dans l'image comptent.", "wcag": ["1.2.2", "1.2.4"]},
    {"id": "raweb-4-4", "ref": "4.4", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Pour chaque média temporel synchronisé ayant des sous-titres synchronisés, ces sous-titres sont-ils pertinents (hors cas particuliers) ?", "impact": "RAWeb 4.4 (WCAG 1.2.2 / 1.2.4) : des sous-titres décalés, incomplets ou dans une autre langue que la vidéo font perdre le sens du contenu.", "explication": "Regarde un extrait avec les sous-titres activés : ils doivent être dans la langue de la vidéo, reprendre les paroles et les sons utiles (« [applaudissements] », changement de locuteur) et rester synchronisés avec l'image.", "wcag": ["1.2.2", "1.2.4"]},
    {"id": "raweb-4-8", "ref": "4.8", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-non-temporel", "etape": "1", "libelle": "Chaque média non temporel a-t-il, si nécessaire, une alternative (hors cas particuliers) ?", "impact": "RAWeb 4.8 (WCAG 1.1.1) : sans alternative, un média non temporel (carte interactive, visite virtuelle, animation ou objet embarqué sans déroulement) reste inaccessible aux personnes qui ne peuvent pas l'utiliser.", "explication": "Repère les médias non temporels (contenu embarqué interactif ou animé, sans lecture du début à la fin). Un lien ou un bouton adjacent et clairement identifiable doit mener à une alternative, dans la page ou dans une autre page, elle-même accessible.", "wcag": ["1.1.1"]},
    {"id": "raweb-4-9", "ref": "4.9", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-non-temporel", "etape": "1", "libelle": "Pour chaque média non temporel ayant une alternative, cette alternative est-elle pertinente ?", "impact": "RAWeb 4.9 (WCAG 1.1.1) : une alternative qui ne donne pas le même contenu (adresse sans plan d'accès, liste partielle de points) laisse l'utilisateur avec une information incomplète.", "explication": "Compare l'alternative au média : elle doit donner accès au même contenu et à des fonctionnalités similaires (par exemple, pour une carte : adresses, horaires, itinéraire en texte).", "wcag": ["1.1.1"]},
    {"id": "raweb-4-10", "ref": "4.10", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "1", "libelle": "Chaque son déclenché automatiquement est-il contrôlable par l’utilisateur ?", "impact": "RAWeb 4.10 (WCAG 1.4.2) : un son qui se lance seul et ne peut pas être coupé couvre la voix du lecteur d'écran et gêne fortement les personnes sensibles au bruit.", "explication": "Ouvre la page avec le son activé : un son qui démarre seul doit durer 3 secondes au plus, ou pouvoir être arrêté (bouton atteignable au clavier en début de page), ou avoir un volume réglable indépendamment de celui du système.", "wcag": ["1.4.2"]},
    {"id": "raweb-4-11", "ref": "4.11", "theme_ruxal": "Images & Médias", "theme_ref": "4. Multimédia", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "media-temporel", "etape": "4", "libelle": "La consultation de chaque média temporel est-elle, si nécessaire, contrôlable par le clavier et tout dispositif de pointage ?", "impact": "RAWeb 4.11 (WCAG 2.1.1 / 2.1.2) : sans commandes utilisables au clavier, l'utilisateur ne peut pas lancer, mettre en pause, couper le son ou activer les sous-titres d'un média.", "explication": "Au clavier seul, atteins le lecteur de chaque média : les commandes nécessaires (lecture, pause ou arrêt, son, sous-titres et audiodescription s'ils existent) doivent être atteignables avec Tab et activables avec Entrée ou Espace, sans piège. Vérifie aussi à la souris.", "wcag": ["2.1.1", "2.1.2"]},
    {"id": "raweb-5-6", "ref": "5.6", "theme_ruxal": "Contenu & Lisibilité", "theme_ref": "5. Tableaux", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "tableau-donnees", "etape": "2", "libelle": "Pour chaque tableau de données, chaque en-tête de colonne et chaque en-tête de ligne sont-ils correctement déclarés ?", "impact": "RAWeb 5.6 (WCAG 1.3.1) : des en-têtes de tableau non déclarés font lire au lecteur d'écran une suite de valeurs sans contexte : l'utilisateur ne sait plus à quoi correspond chaque chiffre.", "explication": "À l'inspecteur, vérifie que chaque en-tête de colonne et de ligne est structuré par une balise th (ou un rôle columnheader ou rowheader), et pas par une cellule td mise en gras.", "wcag": ["1.3.1"]},
    {"id": "raweb-5-7", "ref": "5.7", "theme_ruxal": "Contenu & Lisibilité", "theme_ref": "5. Tableaux", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "tableau-donnees", "etape": "2", "libelle": "Pour chaque tableau de données, la technique appropriée permettant d’associer chaque cellule avec ses en-têtes est-elle utilisée (hors cas particuliers) ?", "impact": "RAWeb 5.7 (WCAG 1.3.1) : une mauvaise association cellule et en-tête fait annoncer par le lecteur d'écran un en-tête faux ou aucun en-tête.", "explication": "Avec le lecteur d'écran, parcours quelques cellules du tableau : chacune doit être annoncée avec son ou ses en-têtes de ligne et de colonne. Si ce n'est pas le cas, le lien entre les cellules et leurs en-têtes est mal codé (attribut scope, ou id et headers pour un tableau complexe).", "wcag": ["1.3.1"]},
    {"id": "raweb-6-1", "ref": "6.1", "theme_ruxal": "Navigation & Structure", "theme_ref": "6. Liens", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Chaque lien est-il explicite (hors cas particuliers) ?", "impact": "RAWeb 6.1 (WCAG 1.1.1 / 2.4.4 / 2.5.3) : un lien vague (« cliquez ici », « en savoir plus ») ne dit pas où il mène : l'utilisateur de lecteur d'écran qui parcourt la liste des liens ne sait pas lequel choisir.", "explication": "Affiche la liste des liens proposée par le lecteur d'écran : chaque intitulé, seul ou avec son contexte (phrase, titre, cellule), doit dire la fonction ou la destination du lien. Si le lien a un texte visible, le nom annoncé doit contenir ce texte.", "wcag": ["1.1.1", "2.4.4", "2.5.3"]},
    {"id": "raweb-6-2", "ref": "6.2", "theme_ruxal": "Navigation & Structure", "theme_ref": "6. Liens", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, chaque lien a-t-il un intitulé ?", "impact": "RAWeb 6.2 (WCAG 1.1.1 / 2.4.4) : un lien sans intitulé est annoncé « lien » sans autre information : l'utilisateur de lecteur d'écran ne peut pas savoir où il mène, ni le distinguer des autres.", "explication": "Affiche la liste des liens proposée par le lecteur d'écran et cherche les liens annoncés sans nom (« lien » seul) : ce sont souvent des icônes ou des images cliquables (réseaux sociaux, logo). Chaque lien doit avoir un intitulé : son texte, l'alternative de son image, ou un libellé caché.", "wcag": ["1.1.1", "2.4.4"]},
    {"id": "raweb-7-1", "ref": "7.1", "theme_ruxal": "Composants Interactifs", "theme_ref": "7. Scripts", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Chaque script est-il, si nécessaire, compatible avec les technologies d’assistance ?", "impact": "RAWeb 7.1 (WCAG 4.1.2 / 2.5.3) : un composant construit en script (bouton, onglet, menu, accordéon, case maison) dont le nom, le rôle ou l'état ne sont pas restitués est inutilisable au lecteur d'écran : on entend « groupe » ou rien, sans savoir à quoi il sert ni s'il est ouvert, sélectionné ou coché. Pour la commande vocale, un nom qui ne reprend pas le texte visible empêche de l'activer.", "explication": "Au lecteur d'écran, parcours chaque composant qui réagit à un script. Pour chacun, vérifie que sont restitués : son nom (pertinent, et qui contient le texte visible quand il y en a un), son rôle (bouton, onglet, case à cocher, menu...), et son état quand il en a un (ouvert ou fermé, sélectionné, coché, désactivé). Active-le : le changement d'état doit être restitué. Dans le code, un élément cliquable doit être un élément natif (button, a, input) ou porter le rôle et les propriétés adaptés.", "wcag": ["2.5.3", "4.1.2"]},
    {"id": "raweb-7-3", "ref": "7.3", "theme_ruxal": "Navigation & Structure", "theme_ref": "7. Scripts", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Chaque script est-il contrôlable par le clavier et par tout dispositif de pointage (hors cas particuliers) ?", "impact": "RAWeb 7.3 (WCAG 1.3.1 / 2.1.1 / 2.4.7) : un composant scripté (menu, accordéon, onglet, carrousel, bouton fait d'un div) inutilisable au clavier bloque totalement les utilisateurs de clavier, de contacteur ou de commande vocale.", "explication": "Au clavier seul (Tab, Maj+Tab, Entrée, Espace, flèches), atteins et active chaque élément qui réagit à un script : il doit fonctionner comme à la souris. Un div ou un span cliquable sans tabindex ni gestion du clavier est non conforme. Vérifie aussi qu'aucun script ne retire le focus d'un élément qui vient de le recevoir.", "wcag": ["1.3.1", "2.1.1", "2.4.7"]},
    {"id": "raweb-7-5", "ref": "7.5", "theme_ruxal": "Composants Interactifs", "theme_ref": "7. Scripts", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, les messages de statut sont-ils correctement restitués par les technologies d’assistance ?", "impact": "RAWeb 7.5 (WCAG 4.1.3) : un message de statut non restitué (« Article ajouté au panier », « 3 résultats », « Enregistrement en cours ») laisse l'utilisateur de lecteur d'écran sans retour : il ne sait pas si son action a réussi et la répète, ou abandonne.", "explication": "Déclenche les actions qui affichent un message sans déplacer le focus : ajout au panier, filtre ou recherche qui met à jour un nombre de résultats, enregistrement, chargement, erreur générale. Au lecteur d'écran, le message doit être lu automatiquement, sans que tu aies à le chercher, et sans que le focus bouge. Dans le code, la zone du message porte un rôle de statut ou d'alerte, présent avant l'apparition du message.", "wcag": ["4.1.3"]},
    {"id": "raweb-8-2", "ref": "8.2", "theme_ruxal": "Fondations Techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Pour chaque page web, le code source généré est-il valide selon le type de document spécifié ?", "impact": "RAWeb 8.2 (WCAG 4.1.1 / 4.1.2) : un code ARIA ou HTML incorrect (attribut ARIA invalide, rôle sans ses enfants requis, identifiant dupliqué référencé) fausse ce que restituent les technologies d'assistance.", "explication": "Vérifie que le code ne trompe pas les technologies d'assistance : rôles et attributs ARIA valides et complets, listes bien construites, identifiants uniques quand d'autres éléments s'y réfèrent. Un outil de test automatique repère vite la plupart de ces erreurs ; vérifie ensuite chacune dans l'inspecteur. La validation complète du code n'est plus exigée.", "wcag": ["4.1.1", "4.1.2"]},
    {"id": "raweb-8-3", "ref": "8.3", "theme_ruxal": "Fondations Techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Dans chaque page web, la langue par défaut est-elle présente ?", "impact": "RAWeb 8.3 (WCAG 3.1.1) : sans langue déclarée, le lecteur d'écran lit la page avec une prononciation par défaut, souvent incompréhensible (texte français lu avec un accent anglais).", "explication": "Dans l'inspecteur, vérifie que l'élément html de la page porte un attribut lang (par exemple lang=\"fr\").", "wcag": ["3.1.1"]},
    {"id": "raweb-8-4", "ref": "8.4", "theme_ruxal": "Fondations Techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Pour chaque page web ayant une langue par défaut, le code de langue est-il pertinent ?", "impact": "RAWeb 8.4 (WCAG 3.1.1) : un code de langue faux ou invalide fait lire la page avec la mauvaise voix de synthèse.", "explication": "Vérifie que le code de langue de la page (attribut lang de l'élément html) est valide (fr, de, en, lb) et correspond à la langue principale réelle de la page. Une page en allemand déclarée lang=\"fr\" est non conforme.", "wcag": ["3.1.1"]},
    {"id": "raweb-8-5", "ref": "8.5", "theme_ruxal": "Navigation & Structure", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Chaque page web a-t-elle un titre de page ?", "impact": "RAWeb 8.5 (WCAG 2.4.2) : sans titre de page, l'utilisateur de lecteur d'écran, qui entend d'abord le titre, ne sait pas où il est, et les onglets ou favoris ne se distinguent pas.", "explication": "À l'inspecteur ou dans l'onglet du navigateur, vérifie que chaque page a une balise title non vide.", "wcag": ["2.4.2"]},
    {"id": "raweb-8-6", "ref": "8.6", "theme_ruxal": "Navigation & Structure", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque page web ayant un titre de page, ce titre est-il pertinent ?", "impact": "RAWeb 8.6 (WCAG 2.4.2) : un titre de page générique ou identique sur toutes les pages (« Accueil », nom du site seul) empêche de savoir sur quelle page on se trouve, surtout après une action (erreur de formulaire, étape suivante).", "explication": "Lis le titre de chaque page (onglet du navigateur, ou annonce du lecteur d'écran à l'ouverture) : il doit identifier le contenu de la page, idéalement suivi du nom du site (« Contact : Nom du site »). Vérifie aussi les étapes d'un formulaire et les pages d'erreur.", "wcag": ["2.4.2"]},
    {"id": "raweb-8-7", "ref": "8.7", "theme_ruxal": "Fondations Techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "AA", "siPresent": true, "horsSelection": false, "declencheur": "changement-langue", "etape": "3a", "libelle": "Dans chaque page web, chaque changement de langue est-il indiqué dans le code source (hors cas particuliers) ?", "impact": "RAWeb 8.7 (WCAG 3.1.2) : un passage en langue étrangère non signalé est lu avec la prononciation de la langue de la page et devient incompréhensible.", "explication": "Repère les passages dans une autre langue que celle de la page (citation, nom d'une langue dans un sélecteur, document en anglais) : l'élément qui les contient doit porter un attribut lang. Les noms propres et les mots passés dans l'usage courant ne sont pas concernés.", "wcag": ["3.1.2"]},
    {"id": "raweb-8-8", "ref": "8.8", "theme_ruxal": "Fondations Techniques", "theme_ref": "8. Éléments obligatoires", "niveau": "modere", "niveau_wcag": "AA", "siPresent": true, "horsSelection": false, "declencheur": "changement-langue", "etape": "2", "libelle": "Dans chaque page web, le code de langue de chaque changement de langue est-il valide et pertinent ?", "impact": "RAWeb 8.8 (WCAG 3.1.2) : un code de langue faux sur un passage le fait lire avec une mauvaise voix de synthèse.", "explication": "Pour chaque passage marqué dans une autre langue, vérifie que son code de langue est valide et correspond bien à la langue du passage (par exemple lang=\"en\" sur une citation en anglais, lang=\"lb\" sur un texte en luxembourgeois).", "wcag": ["3.1.2"]},
    {"id": "raweb-9-1", "ref": "9.1", "theme_ruxal": "Navigation & Structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, l’information est-elle structurée par l’utilisation appropriée de titres ?", "impact": "RAWeb 9.1 (WCAG 1.3.1 / 2.4.1 / 2.4.6 / 4.1.2) : sans titres structurés, les utilisateurs de lecteur d'écran, qui naviguent souvent de titre en titre, ne peuvent ni survoler la page ni sauter à la partie qui les intéresse.", "explication": "Affiche la liste des titres proposée par le lecteur d'écran (ou par une extension de navigateur) : chaque texte qui joue visuellement le rôle de titre doit y figurer, avec un contenu pertinent et une hiérarchie cohérente (pas de saut de niveau illogique).", "wcag": ["1.3.1", "2.4.1", "2.4.6", "4.1.2"]},
    {"id": "raweb-9-2", "ref": "9.2", "theme_ruxal": "Navigation & Structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Dans chaque page web, la structure du document est-elle cohérente ?", "impact": "RAWeb 9.2 (WCAG 1.3.1) : sans zones structurantes (en-tête, navigation, contenu principal, pied de page), l'utilisateur de lecteur d'écran ne peut pas aller directement au contenu ou au menu.", "explication": "Affiche la liste des repères du lecteur d'écran (ou les zones dans l'inspecteur) : la page doit avoir un en-tête, une navigation principale, un seul contenu principal et un pied de page, chacun identifié comme tel (header, nav, main, footer).", "wcag": ["1.3.1"]},
    {"id": "raweb-9-3", "ref": "9.3", "theme_ruxal": "Navigation & Structure", "theme_ref": "9. Structuration de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, chaque liste est-elle correctement structurée ?", "impact": "RAWeb 9.3 (WCAG 1.3.1) : une liste visuelle qui n'est pas déclarée comme liste est lue comme une suite de lignes sans lien : l'utilisateur de lecteur d'écran ne sait pas combien d'éléments elle contient ni où elle se termine, et ne peut pas la sauter.", "explication": "Repère tout contenu présenté comme une liste : énumérations à puces ou numérotées, menus, suites de liens, de cartes ou de résultats. Au lecteur d'écran, chacune doit être annoncée comme une liste avec son nombre d'éléments. Dans le code, elle utilise les éléments de liste (ul, ol et li, ou dl pour une liste de définitions), sans tirets ni retours à la ligne pour simuler les puces.", "wcag": ["1.3.1"]},
    {"id": "raweb-10-4", "ref": "10.4", "theme_ruxal": "Contenu & Lisibilité", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "AA", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, le texte reste-t-il lisible lorsque la taille des caractères est augmentée jusqu’à 200 %, au moins (hors cas particuliers) ?", "impact": "RAWeb 10.4 (WCAG 1.4.4) : quand le texte est agrandi, un contenu tronqué, superposé ou qui sort de son cadre devient illisible ou masque des boutons : les personnes malvoyantes qui agrandissent le texte perdent l'information ou ne peuvent plus agir.", "explication": "Agrandis le texte jusqu'à 200 % : avec le zoom du navigateur, puis avec le réglage de la taille du texte seule quand il existe. Parcours tout l'écran : aucun texte ne doit être coupé, superposé à un autre ou masqué, et toutes les fonctions doivent rester disponibles. Un défilement horizontal reste acceptable pour les tableaux et les contenus qui en ont besoin.", "wcag": ["1.4.4"]},
    {"id": "raweb-10-7", "ref": "10.7", "theme_ruxal": "Navigation & Structure", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, pour chaque élément recevant le focus du clavier, la prise de focus est-elle visible ?", "impact": "RAWeb 10.7 (WCAG 1.4.1 / 2.4.7) : sans indicateur de focus visible, l'utilisateur au clavier ne sait plus où il se trouve dans la page et ne peut plus l'utiliser.", "explication": "Parcours la page avec Tab : chaque élément qui reçoit le focus doit être clairement signalé (contour natif non supprimé, ou style de focus défini par le site et bien visible). Cherche dans les styles un outline: none ou outline: 0 sans remplacement.", "wcag": ["1.4.1", "2.4.7"]},
    {"id": "raweb-10-8", "ref": "10.8", "theme_ruxal": "Fondations Techniques", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Pour chaque page web, les contenus cachés ont-ils vocation à être ignorés par les technologies d’assistance ?", "impact": "RAWeb 10.8 (WCAG 1.3.2 / 4.1.2) : un contenu masqué visuellement mais lu par le lecteur d'écran (ou l'inverse) crée des annonces fantômes, ou cache une information utile aux seuls utilisateurs de lecteur d'écran.", "explication": "Repère les contenus cachés (menus repliés, fenêtres fermées, textes réservés aux lecteurs d'écran). Un contenu caché doit soit être vraiment ignoré par le lecteur d'écran, soit devenir accessible par une action (bouton, onglet). Un élément qu'on atteint au clavier mais que le lecteur d'écran n'annonce pas est non conforme.", "wcag": ["1.3.2", "4.1.2"]},
    {"id": "raweb-10-9", "ref": "10.9", "theme_ruxal": "Couleurs & Contrastes", "theme_ref": "10. Présentation de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, l’information ne doit pas être donnée uniquement par la forme, taille ou position. Cette règle est-elle respectée ?", "impact": "RAWeb 10.9 (WCAG 1.3.3 / 1.4.1) : une information donnée seulement par la forme, la taille ou la position (« cliquez sur le bouton rond », « voir colonne de droite ») est inaccessible à qui ne voit pas la page ou la consulte sur un petit écran.", "explication": "Repère les consignes et repères qui s'appuient sur la forme, la taille ou la position (« bouton à droite », icône seule pour un état, élément actif signalé par sa seule taille). Un autre moyen doit donner la même information (texte visible, intitulé explicite).", "wcag": ["1.3.3", "1.4.1"]},
    {"id": "raweb-10-10", "ref": "10.10", "theme_ruxal": "Couleurs & Contrastes", "theme_ref": "10. Présentation de l’information", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Dans chaque page web, l’information ne doit pas être donnée par la forme, taille ou position uniquement. Cette règle est-elle implémentée de façon pertinente ?", "impact": "RAWeb 10.10 (WCAG 1.3.3 / 1.4.1) : un moyen de remplacement qui ne fonctionne pas dans tous les contextes (texte masqué non restitué, info-bulle inaccessible au clavier) laisse certains utilisateurs sans l'information.", "explication": "Pour chaque information donnée par la forme, la taille ou la position et doublée par un autre moyen (critère 10.9), vérifie que ce moyen fonctionne vraiment : il doit être visible ou restitué par le lecteur d'écran, et accessible au clavier comme à la souris.", "wcag": ["1.3.3", "1.4.1"]},
    {"id": "raweb-10-14", "ref": "10.14", "theme_ruxal": "Navigation & Structure", "theme_ref": "10. Présentation de l’information", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, les contenus additionnels apparaissant via les styles CSS uniquement peuvent-ils être rendus visibles au clavier et par tout dispositif de pointage ?", "impact": "RAWeb 10.14 (WCAG 2.1.1) : un contenu qui n'apparaît qu'au survol de la souris (sous-menu, info-bulle CSS) reste hors de portée des utilisateurs de clavier.", "explication": "Repère les contenus qui apparaissent au survol ou au focus grâce aux styles CSS (sous-menus, info-bulles). Au clavier seul, ils doivent aussi apparaître à la prise de focus ou à l'activation du composant (ou d'un autre composant).", "wcag": ["2.1.1"]},
    {"id": "raweb-11-1", "ref": "11.1", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "critique", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Chaque champ de formulaire a-t-il une étiquette ?", "impact": "RAWeb 11.1 (WCAG 1.3.1 / 2.4.6 / 3.3.2 / 4.1.2) : un champ sans étiquette est annoncé « zone d'édition » sans autre information : l'utilisateur de lecteur d'écran ne sait pas quoi saisir et le formulaire devient impossible à remplir.", "explication": "Avec le lecteur d'écran, place-toi sur chaque champ (texte, liste, case, bouton radio) : une étiquette doit être annoncée. Dans l'inspecteur, elle passe par une balise label liée au champ, ou par un libellé ARIA. Un texte indicatif dans le champ (placeholder) n'est pas une étiquette.", "wcag": ["1.3.1", "2.4.6", "3.3.2", "4.1.2"]},
    {"id": "raweb-11-2", "ref": "11.2", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Chaque étiquette associée à un champ de formulaire est-elle pertinente (hors cas particuliers) ?", "impact": "RAWeb 11.2 (WCAG 2.4.6 / 2.5.3 / 3.3.2) : une étiquette imprécise (« Champ 1 », « Valeur ») fait saisir une mauvaise information ; un nom accessible différent du texte visible empêche aussi la commande vocale de viser le champ.", "explication": "Avec le lecteur d'écran, écoute l'étiquette de chaque champ : elle doit dire précisément ce qui est attendu. Si le champ a un intitulé visible, son nom accessible doit le contenir (attention aux aria-label qui le remplacent par un autre texte).", "wcag": ["2.4.6", "2.5.3", "3.3.2"]},
    {"id": "raweb-11-5", "ref": "11.5", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, les champs de même nature sont-ils regroupés, si nécessaire ?", "impact": "RAWeb 11.5 (WCAG 1.3.1 / 3.3.2) : si des champs liés ne sont pas regroupés (boutons radio Oui / Non, jour / mois / année), l'utilisateur de lecteur d'écran entend les choix sans la question à laquelle ils répondent.", "explication": "Repère les champs qui forment un ensemble (boutons radio d'une même question, cases d'une même liste, date en trois champs, adresse) : ils doivent être regroupés dans un fieldset, ou dans un élément avec role=\"group\" (ou radiogroup pour des boutons radio).", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-6", "ref": "11.6", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, chaque regroupement de champs de même nature a-t-il une légende ?", "impact": "RAWeb 11.6 (WCAG 1.3.1 / 3.3.2) : un regroupement sans légende ne donne pas la question commune : les choix « Oui » et « Non » restent annoncés sans contexte.", "explication": "Pour chaque regroupement trouvé au critère 11.5, vérifie qu'il a une légende : legend dans le fieldset, ou aria-label ou aria-labelledby sur l'élément role=\"group\". Au lecteur d'écran, la légende doit être annoncée en entrant dans le groupe.", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-7", "ref": "11.7", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "modere", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, chaque légende associée à un regroupement de champs de même nature est-elle pertinente ?", "impact": "RAWeb 11.7 (WCAG 1.3.1 / 3.3.2) : une légende vague (« Choix », « Informations ») ne dit pas à quoi répondent les champs du groupe.", "explication": "Lis chaque légende de regroupement : elle doit énoncer la question ou le thème commun aux champs (« Souhaitez-vous recevoir la newsletter ? », « Date de naissance »).", "wcag": ["1.3.1", "3.3.2"]},
    {"id": "raweb-11-9", "ref": "11.9", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, l’intitulé de chaque bouton est-il pertinent (hors cas particuliers) ?", "impact": "RAWeb 11.9 (WCAG 2.5.3 / 4.1.2) : un bouton sans intitulé ou à l'intitulé vague (« OK », icône seule) ne dit pas ce qu'il va faire ; un nom accessible différent du texte visible gêne aussi la commande vocale.", "explication": "Écoute chaque bouton du formulaire au lecteur d'écran : l'intitulé doit dire l'action (« Envoyer la demande », « Rechercher »), y compris pour un bouton icône. Si le bouton a un texte visible, le nom annoncé doit le contenir.", "wcag": ["2.5.3", "4.1.2"]},
    {"id": "raweb-11-10", "ref": "11.10", "theme_ruxal": "Formulaires", "theme_ref": "11. Formulaires", "niveau": "serieux", "niveau_wcag": "A", "siPresent": true, "horsSelection": false, "declencheur": "formulaire", "etape": "3b", "libelle": "Dans chaque formulaire, le contrôle de saisie est-il utilisé de manière pertinente (hors cas particuliers) ?", "impact": "RAWeb 11.10 (WCAG 3.3.1 / 3.3.2) : un champ obligatoire ou un format attendu signalés seulement par un astérisque coloré, ou des erreurs non reliées à leur champ, font échouer la saisie sans que l'utilisateur comprenne pourquoi.", "explication": "Avant toute saisie, vérifie que les champs obligatoires et les formats attendus (date, téléphone) sont indiqués de façon visible et restitués au lecteur d'écran (dans l'étiquette, ou par required, aria-required ou aria-describedby). Puis envoie le formulaire vide ou mal rempli : chaque message d'erreur doit être visible, nommer le champ concerné et être restitué (étiquette, aria-describedby ou aria-invalid avec son message).", "wcag": ["3.3.1", "3.3.2"]},
    {"id": "raweb-12-6", "ref": "12.6", "theme_ruxal": "Navigation & Structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "3a", "libelle": "Les zones de regroupement de contenus présentes dans plusieurs pages web (à l’exception des zones principales constituant la structure du document) peuvent-elles être atteintes ou évitées, si nécessaire ?", "impact": "RAWeb 12.6 (WCAG 1.3.1 / 2.4.1 / 4.1.2) : les blocs répétés de page en page (menu secondaire, encart, outils) sans moyen de les identifier ou de les éviter obligent à les reparcourir à chaque page.", "explication": "Repère les zones de contenu qui se répètent sur plusieurs pages, hors en-tête, navigation principale, contenu principal et pied de page. Chacune doit avoir un repère (landmark adapté), un titre, ou pouvoir être masquée ou évitée par un lien ou un bouton placé juste avant.", "wcag": ["1.3.1", "2.4.1", "4.1.2"]},
    {"id": "raweb-12-7", "ref": "12.7", "theme_ruxal": "Navigation & Structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, un lien d’évitement ou d’accès rapide à la zone de contenu principal est-il présent (hors cas particuliers) ?", "impact": "RAWeb 12.7 (WCAG 2.4.1 / 2.4.3 / 3.2.3) : sans lien d'évitement, l'utilisateur au clavier doit traverser tout l'en-tête et le menu, à chaque page, avant d'atteindre le contenu.", "explication": "Charge la page et appuie sur Tab : un lien « Aller au contenu » (visible au moins quand il reçoit le focus) doit apparaître parmi les premiers et amener réellement le focus au début du contenu principal. Il doit être au même endroit sur toutes les pages.", "wcag": ["2.4.1", "2.4.3", "3.2.3"]},
    {"id": "raweb-12-8", "ref": "12.8", "theme_ruxal": "Navigation & Structure", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, l’ordre de tabulation est-il cohérent ?", "impact": "RAWeb 12.8 (WCAG 2.4.3) : un ordre de tabulation illogique désoriente l'utilisateur au clavier, qui saute d'une zone à l'autre et perd le fil.", "explication": "Parcours la page avec Tab et Maj+Tab : l'ordre doit rester logique et suivre le sens de lecture. Vérifie aussi après une action qui insère ou met à jour un contenu (fenêtre modale, message, liste filtrée). Repère les tabindex positifs à l'inspecteur.", "wcag": ["2.4.3"]},
    {"id": "raweb-12-9", "ref": "12.9", "theme_ruxal": "Navigation & Structure", "theme_ref": "12. Navigation", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, la navigation ne doit pas contenir de piège au clavier. Cette règle est-elle respectée ?", "impact": "RAWeb 12.9 (WCAG 2.1.1 / 2.1.2) : un piège au clavier bloque totalement l'utilisateur, qui ne peut plus quitter un composant ni continuer dans la page.", "explication": "Au clavier seul, parcours toute la page, y compris les lecteurs vidéo, cartes, iframes et fenêtres modales : depuis chaque élément, Tab et Maj+Tab (ou une touche dont l'utilisateur est informé, comme les flèches ou Échap) doivent permettre d'en sortir.", "wcag": ["2.1.1", "2.1.2"]},
    {"id": "raweb-12-11", "ref": "12.11", "theme_ruxal": "Composants Interactifs", "theme_ref": "12. Navigation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "4", "libelle": "Dans chaque page web, les contenus additionnels apparaissant au survol, à la prise de focus ou à l’activation d’un composant d’interface sont-ils si nécessaire atteignables au clavier ?", "impact": "RAWeb 12.11 (WCAG 2.1.1) : un contenu additionnel (sous-menu, info-bulle, panneau) qui apparaît mais reste hors d'atteinte au clavier prive l'utilisateur de ses liens et de ses informations.", "explication": "Fais apparaître chaque contenu additionnel (survol, focus ou activation d'un composant) puis, au clavier, essaie d'y entrer : ses liens, boutons et informations doivent être atteignables avec Tab ou les flèches.", "wcag": ["2.1.1"]},
    {"id": "raweb-13-1", "ref": "13.1", "theme_ruxal": "Composants Interactifs", "theme_ref": "13. Consultation", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Pour chaque page web, l’utilisateur a-t-il le contrôle de chaque limite de temps modifiant le contenu (hors cas particuliers) ?", "impact": "RAWeb 13.1 (WCAG 2.2.1 / 2.2.2) : une limite de temps non contrôlable (session qui expire, page qui se recharge ou redirige seule) fait perdre la saisie ou le contenu aux personnes qui lisent ou saisissent plus lentement.", "explication": "Repère les rafraîchissements, les redirections automatiques et les limites de session. Pour chacun, l'utilisateur doit pouvoir arrêter ou supprimer la limite, l'allonger, ou être prévenu avant l'échéance avec la possibilité de la prolonger. Une redirection automatique doit être immédiate. Une limite de session d'au moins 20 heures est acceptée.", "wcag": ["2.2.1", "2.2.2"]},
    {"id": "raweb-13-7", "ref": "13.7", "theme_ruxal": "Contenu & Lisibilité", "theme_ref": "13. Consultation", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les changements brusques de luminosité ou les effets de flash sont-ils correctement utilisés ?", "impact": "RAWeb 13.7 (WCAG 2.3.1) : un flash ou un changement brusque de luminosité au-delà du seuil peut déclencher une crise chez les personnes épileptiques photosensibles.", "explication": "Repère tout contenu qui clignote ou flashe rapidement (vidéo, animation, image animée). L'effet doit rester sous 3 flashs par seconde, ou couvrir une très petite surface. En cas de doute, utilise un outil d'analyse des flashs.", "wcag": ["2.3.1"]},
    {"id": "raweb-13-8", "ref": "13.8", "theme_ruxal": "Contenu & Lisibilité", "theme_ref": "13. Consultation", "niveau": "serieux", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, chaque contenu en mouvement ou clignotant est-il contrôlable par l’utilisateur (hors cas particuliers) ?", "impact": "RAWeb 13.8 (WCAG 2.2.1 / 2.2.2) : un contenu qui bouge ou clignote sans fin (carrousel, bandeau défilant, animation) gêne la lecture et la concentration, et peut devenir illisible pour certaines personnes.", "explication": "Repère chaque contenu en mouvement ou clignotant lancé automatiquement (carrousel, bandeau défilant, animation) : il doit durer 5 secondes au plus, ou pouvoir être arrêté et relancé, masqué, ou affiché sans mouvement, par un contrôle atteignable au clavier.", "wcag": ["2.2.1", "2.2.2"]},
    {"id": "raweb-13-11", "ref": "13.11", "theme_ruxal": "Composants Interactifs", "theme_ref": "13. Consultation", "niveau": "modere", "niveau_wcag": "A", "siPresent": false, "horsSelection": true, "declencheur": "", "etape": "1", "libelle": "Dans chaque page web, les actions déclenchées au moyen d’un dispositif de pointage sur un point unique de l’écran peuvent-elles faire l’objet d’une annulation (hors cas particuliers) ?", "impact": "RAWeb 13.11 (WCAG 2.5.2) : une action déclenchée dès l'appui (mousedown, touchstart) part sur une simple erreur de visée, sans rattrapage possible, ce qui pénalise surtout les personnes qui ont des tremblements ou une motricité réduite.", "explication": "Sur les boutons, liens et contrôles qui déclenchent une action, appuie (souris ou doigt), puis fais glisser le pointeur hors de la cible avant de relâcher : l'action ne doit pas avoir lieu. Elle doit se déclencher au relâchement (événement click) et pas dès l'appui, sauf si l'action peut être annulée ensuite, ou si l'appui est indispensable (touche de piano virtuel, par exemple). À l'inspecteur, repère les gestionnaires mousedown, pointerdown ou touchstart qui déclenchent une action.", "wcag": ["2.5.2"]},
    {"id": "bp1", "horsRef": true, "ref": "", "theme_ruxal": "Composants Interactifs", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "1", "niveau": "modere", "niveau_wcag": "", "libelle": "Chaque cible isolée (bouton, icône, case à cocher, lien hors d'un texte) mesure au moins 24×24 px CSS, ou est assez espacée de ses voisines pour être activée sans erreur.", "impact": "Une cible trop petite, ou collée à sa voisine, provoque des clics ou des appuis ratés ou involontaires, surtout pour les personnes ayant des tremblements, une préhension limitée, ou sur écran tactile.", "explication": "Mesure à l'inspecteur la zone cliquable réelle des boutons, icônes, cases et liens isolés (pas seulement l'icône visible) : au moins 24 × 24 px CSS, ou assez d'espace autour pour qu'un cercle de 24 px centré sur la cible ne touche aucune autre cible. Les liens dans un paragraphe de texte ne sont pas concernés.", "note": "Pas une exigence du RAWeb 1.1 : le référentiel repose sur les WCAG 2.1, où la taille de cible n'est qu'un critère AAA (2.5.5, 44 × 44 px). Le seuil de 24 px vient du critère 2.5.8 des WCAG 2.2 (niveau AA).", "sources": [{"t": "W3C, WCAG 2.2, SC 2.5.8 Target Size (Minimum), niveau AA : 24×24 px", "u": "https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html"}, {"t": "W3C, WCAG 2.1, SC 2.5.5 Target Size, niveau AAA : 44×44 px", "u": "https://www.w3.org/WAI/WCAG21/Understanding/target-size.html"}]},
    {"id": "bp2", "horsRef": true, "ref": "", "theme_ruxal": "Navigation & Structure", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "4", "niveau": "serieux", "niveau_wcag": "", "libelle": "Chaque fenêtre modale se ferme par un bouton visible atteignable au clavier et par la touche Échap.", "impact": "Sans moyen évident de fermer une fenêtre modale, l'utilisateur au clavier ou au lecteur d'écran reste bloqué devant, ou doit recharger la page et perd ce qu'il faisait.", "explication": "Ouvre chaque fenêtre modale (boîte de dialogue, panneau, bannière de consentement) : elle doit se fermer par un bouton visible et atteignable au clavier, et par la touche Échap. Vérifie aussi que le focus est placé dans la fenêtre à l'ouverture.", "note": "Aucun critère du RAWeb 1.1 ne l'exige en tant que tel ; une fenêtre impossible à quitter au clavier relève en revanche du critère 12.9 (piège au clavier). Pattern décrit par les WAI-ARIA Authoring Practices.", "sources": [{"t": "W3C, WAI-ARIA Authoring Practices, Modal Dialog Pattern (Keyboard Interaction : Échap ferme la fenêtre)", "u": "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}]},
    {"id": "bp3", "horsRef": true, "ref": "", "theme_ruxal": "Navigation & Structure", "theme_ref": "Hors référentiel RAWeb, bonne pratique", "etape": "4", "niveau": "modere", "niveau_wcag": "", "libelle": "Quand une fenêtre modale se ferme, le focus revient sur l'élément qui l'avait ouverte (s'il existe encore).", "impact": "Le focus retombe en haut de la page ou sur un élément sans rapport : l'utilisateur de lecteur d'écran ou de clavier perd sa position et doit reparcourir la page depuis le début.", "explication": "Au clavier, ouvre une fenêtre modale depuis un bouton puis ferme-la (bouton Fermer, Échap) : le focus doit revenir sur ce bouton (ou, s'il n'existe plus, sur un élément logique proche). Un focus perdu ou renvoyé au début de la page est à signaler ; selon l'appréciation de l'auditeur, il peut aussi se rattacher au critère 12.8 (ordre de tabulation).", "note": "Aucun critère du RAWeb 1.1 ne l'exige en tant que tel. Pattern décrit par les WAI-ARIA Authoring Practices.", "sources": [{"t": "W3C, WAI-ARIA Authoring Practices, Modal Dialog Pattern (Keyboard Interaction : le focus revient à l'élément qui a ouvert la fenêtre)", "u": "https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/"}]}
  ];

  function badgePartage(o, x){

  function ligneObs(o, x, e){

      (origine ? '<span class="doux petit">observé sur '+esc(origine)+'</span>' : '')+(invalide ? '<span class="doux petit">remplacé par un retest</span>' : '')+'</span></div>' +
      (origine ? '' : '<span class="rangee" style="flex:none">'+(x.tag !== 'nt' ? (brouillon.modif === x.id ? '<span class="doux petit">en cours de modification</span>' : '<button type="button" class="btn btn-s" data-action="modif-obs" data-id="'+x.id+'" aria-label="Modifier l\'observation : '+esc(x.texte.length > 60 ? x.texte.slice(0, 58)+'...' : x.texte)+'">'+ico('crayon')+'Modifier</button>') : '')+
        '<button type="button" class="btn btn-s btn-danger" data-action="suppr-obs" data-id="'+x.id+'">'+ico('corbeille')+(confirmation === 'obs-'+x.id ? 'Confirmer' : 'Supprimer')+'</button></span>')+'</div>';
  }

  function criteresProposes(){
    var s = SYMPTOMES.filter(function(x){ return x.id === brouillon.point; })[0];
    if(!s) return [];
    var l = s.criteres.slice();
    s.selon.forEach(function(x, i){ if(String(i) === brouillon.element) l = l.concat(x.criteres); });
    return l.filter(function(id, i){ return l.indexOf(id) === i; });
  }

  // Cadre commun aux vues Saisie et Grille : titre de l'onglet, puis les écrans (colonne qui reste visible) et le contenu.
  // Ordre « étape d'abord » : une étape se fait sur tous les écrans de l'onglet avant de passer à la suivante.
  // À chaque étape, les fonctions primaires passent en premier, puis les écrans : ce sont les « cibles » de l'étape.
  function cibles(o){
    return fonctionsOnglet(o).map(function(f){ return {type:'f', id:f.id, nom:f.nom, ref:f}; })
      .concat(o.ecrans.map(function(e){ return {type:'e', id:e.id, nom:e.nom, ref:e}; }));
  }
  function cibleFaite(c, etId){ return !!(c.ref.etapes || {})[etId]; }
  function cibleCourante(o){ var f = fonctionCourante(o); return f ? f.id : state.ecranId; }
  function allerCible(c){ if(c.type === 'f') state.fonctionId = c.id; else { state.fonctionId = null; state.ecranId = c.id; } }
  function faitsEtape(o, etId){ return cibles(o).filter(function(c){ return cibleFaite(c, etId); }).length; }
  function etapeComplete(o, etId){ return o.ecrans.length > 0 && faitsEtape(o, etId) === cibles(o).length; }
  // Cible suivante non faite pour l'étape, en partant de la cible donnée (ordre de la liste, en boucle).
  function ecranSuivant(o, etId, depuis){
    var l = cibles(o), i = l.map(function(x){ return x.id; }).indexOf(depuis), n = l.length;
    for(var k = 1; k <= n; k++){ var x = l[(i + k) % n]; if(x.id !== depuis && !cibleFaite(x, etId)) return x; }
    return null;
  }
  // Étape suivante pas encore faite partout ; « finie » est l'étape en cours, considérée comme terminée.
  function etapeSuivante(o, finie){
    var reste = ETAPES.filter(function(et){ return et.id !== finie.id && !etapeComplete(o, et.id); });
    return reste.filter(function(et){ return et.i > finie.i; })[0] || reste[0] || null;
  }
  function cadreOnglet(o, vue, info, contenu){
    var e = ecranDe(o, state.ecranId) || o.ecrans[0]; state.ecranId = e.id;
    var html = '<div class="rangee entre titre-onglet"><span class="rangee"><h1>'+esc(o.nom)+'</h1>'+bascule(vue)+'</span><span class="rangee">'+info+'</span></div>';
