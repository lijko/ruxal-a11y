    var cl = x.tag === 'nt' ? 'NT' : (x.criteres.length ? x.tag.toUpperCase() : 'NOTE');
    var lib = {C:'C', NC:'NC', NA:'NA', NT:'Retest', NOTE:'Note'}[cl];
    return '<div class="obs'+(invalide ? ' invalide' : '')+'"><span class="pastille s-'+cl+'">'+lib+'</span><div class="corps">' +
      '<span class="texte">'+esc(x.texte)+(x.attendu ? ' <span class="doux">Attendu : '+esc(x.attendu)+'</span>' : '')+'</span>' +
      '<span class="rangee">'+x.criteres.map(function(id){ return '<span class="etiq etiq-ref">'+esc(refTxt(PAR_ID[id]))+'</span>'; }).join('')+badgePartage(o, x)+
      (origine ? '<span class="doux petit">observé sur '+esc(origine)+'</span>' : '')+(invalide ? '<span class="doux petit">remplacé par un retest</span>' : '')+'</span></div>' +
      ('<span class="fixe rangee">'+(x.tag !== 'nt' ? (brouillon.modif === x.id ? '<span class="doux petit">en cours de modification</span>' : '<button type="button" class="btn btn-s" data-action="modif-obs" data-id="'+x.id+'" aria-label="Modifier l\'observation : '+esc(x.texte.length > 60 ? x.texte.slice(0, 58)+'...' : x.texte)+'">'+ico('crayon')+'Modifier</button>') : '')+
        (origine ? '' : '<button type="button" class="btn btn-s btn-danger" data-action="suppr-obs" data-id="'+x.id+'">'+ico('corbeille')+(ui.confirmation === 'obs-'+x.id ? 'Confirmer' : 'Supprimer')+'</button>')+'</span>')+'</div>';
  }

  function criteresProposes(){
    var s = SYMPTOMES.filter(function(x){ return x.id === brouillon.point; })[0];
    if(!s) return [];
    var l = s.criteres.slice();
    s.selon.forEach(function(x, i){ if(String(i) === brouillon.element) l = l.concat(x.criteres); });
    return l.filter(function(id, i){ return l.indexOf(id) === i; });
  }

  // ---------- Rendu : étapes de test (vue Saisie) ----------
  // Cadre commun aux vues Saisie et Grille : titre de l'onglet, puis les écrans (colonne qui reste visible) et le contenu.
  // Ordre « étape d'abord » : une étape se fait sur tous les écrans de l'onglet avant de passer à la suivante.
  // À chaque étape, les fonctions primaires passent en premier, puis les écrans : ce sont les « cibles » de l'étape.
  function cibles(o){
    return fonctionsOnglet(o).map(function(f){ return {type:'f', id:f.id, nom:f.nom, ref:f}; })
      .concat(o.ecrans.map(function(e){ return {type:'e', id:e.id, nom:e.nom, ref:e}; }));
  }
  function cibleFaite(c, etId){ return !!(c.ref.etapes || {})[etId]; }
  function cibleCourante(o){ var f = fonctionCourante(o); return f ? f.id : state.ecranId; }
  function allerCible(c){ if(c.type === 'f') state.fonctionId = c.id; else { state.fonctionId = null; state.ecranId = c.id; } }
  function faitsEtape(o, etId){ return cibles(o).filter(function(c){ return cibleFaite(c, etId); }).length; }
  function etapeComplete(o, etId){ return o.ecrans.length > 0 && faitsEtape(o, etId) === cibles(o).length; }
  // Cible suivante non faite pour l'étape, en partant de la cible donnée (ordre de la liste, en boucle).
  function cibleSuivante(o, etId, depuis){
    var l = cibles(o), i = l.map(function(x){ return x.id; }).indexOf(depuis), n = l.length;
    for(var k = 1; k <= n; k++){ var x = l[(i + k) % n]; if(x.id !== depuis && !cibleFaite(x, etId)) return x; }
    return null;
  }
  // Étape suivante pas encore faite partout ; « finie » est l'étape en cours, considérée comme terminée.
  function etapeSuivante(o, finie){
    var reste = ETAPES.filter(function(et){ return et.id !== finie.id && !etapeComplete(o, et.id); });
    return reste.filter(function(et){ return et.i > finie.i; })[0] || reste[0] || null;
  }
  function cadreOnglet(o, vue, info, contenu){
    var e = ecranDe(o, state.ecranId) || o.ecrans[0]; state.ecranId = e.id;
    var html = '<div class="rangee entre titre-onglet"><span class="rangee"><h1>'+esc(o.nom)+'</h1>'+bascule(vue)+'</span><span class="rangee">'+info+'</span></div>';
    var fC = vue === 'audit' ? fonctionCourante(o) : null;
    html += '<div class="audit"><nav class="ecrans" aria-label="Écrans et éléments partagés">';
    var fo = fonctionsOnglet(o);
    if(fo.length){
      html += '<div class="carte"><h2>Fonctions primaires</h2>' + fo.map(function(f){
        var fait = vue === 'audit' && (f.etapes || {})[state.etape];
        var ncF = obsF().filter(function(x){ return x.fonction === f.id && x.tag === 'nc' && x.criteres.length && !obsFRemplacee(x); });
        var bpF = ncF.filter(function(x){ return x.criteres.every(function(id){ return (PAR_ID[id] || {}).horsRef; }); }).length;
        return '<button type="button" data-action="cible-fonction" data-id="'+f.id+'"'+(fC === f ? ' aria-current="true"' : '')+'><span>'+(fait ? '<span class="coche" aria-hidden="true">&#10003;</span>' : '')+esc(f.nom)+(fait ? '<span class="sr"> (étape faite)</span>' : '')+'</span><span class="petit">'+compteurNC(ncF.length - bpF, bpF)+'</span></button>';
      }).join('') + '</div>';
    }
    html += '<div class="carte"><h2>Écrans</h2>';
    o.ecrans.forEach(function(x, i){
      var nc = RAWEB.filter(function(c){ return statutEcran(o, x, c).s === 'NC'; }).length;
      var bp = CRITERES.filter(function(c){ return c.horsRef && statutEcran(o, x, c).s === 'NC'; }).length;
      var faitIci = vue === 'audit' && (x.etapes || {})[state.etape];
      html += '<button type="button" data-action="ecran" data-id="'+x.id+'"'+(x.id === e.id && !fC ? ' aria-current="true"' : '')+'><span>'+(faitIci ? '<span class="coche" aria-hidden="true">&#10003;</span>' : '')+(o.type === 'scenario' ? (i+1)+'. ' : '')+esc(x.nom)+(faitIci ? '<span class="sr"> (étape faite)</span>' : '')+'</span><span class="petit">'+compteurNC(nc, bp)+'</span></button>';
    });
    html += '<button class="lien-action" type="button" data-action="configurer">Contenus et fonctions</button>' +
      '<button class="lien-action" type="button" data-action="vue" data-vue="preparer">Gérer les écrans</button></div>';
    var elts = {};
    // Un élément est répété quand ses observations, une ou plusieurs, touchent au moins deux écrans.
    var libelles = {};
    o.obs.forEach(function(x){ if(x.elementNom){ var k = cleNom(x.elementNom); libelles[k] = libelles[k] || x.elementNom; var l = elts[k] = elts[k] || []; [x.ecran].concat(x.partage ? x.partage.ecrans : []).forEach(function(id){ if(l.indexOf(id) === -1) l.push(id); }); } });
    var noms = Object.keys(elts).filter(function(n){ return elts[n].length > 1; });
    html += '<div class="carte"><h2>Éléments répétés</h2>' + (noms.length ? noms.map(function(n){ return '<div class="elt"><span>'+esc(libelles[n])+'</span><span class="doux petit">'+elts[n].length+' écrans</span></div>'; }).join('')
      : '<p class="marge-4-8 doux petit">Un élément observé sur plusieurs écrans apparaît ici.</p>') + '</div>';
    return html + '</nav><div class="centre">' + contenu + '</div></div>';
  }
  // Fin d'étape : l'outil passe à la cible suivante (fonction ou écran), puis à l'étape suivante.
  function boutonFin(o, et, curId){
    var nx = cibleSuivante(o, et.id, curId), nxEt = nx ? null : etapeSuivante(o, et);
    var lib = 'Valider puis passer à : ' + (nx ? esc(nx.nom) : (nxEt ? 'étape '+esc(nxEt.nom) : 'la grille'));
    return '<div class="a-droite rangee"><button type="button" class="btn btn-p" data-action="etape-faite">'+lib+'</button></div>';
  }
  function ligneObsF(x){
    var remplacee = x.tag !== 'nt' && obsFRemplacee(x);
    var cl = x.tag === 'nt' ? 'NT' : (x.criteres.length ? x.tag.toUpperCase() : 'NOTE');
    var lib = {C:'C', NC:'NC', NA:'NA', NT:'Retest', NOTE:'Note'}[cl];
    return '<div class="obs'+(remplacee ? ' invalide' : '')+'"><span class="pastille s-'+cl+'">'+lib+'</span><div class="corps">' +
      '<span class="texte">'+esc(x.texte)+(x.attendu ? ' <span class="doux">Attendu : '+esc(x.attendu)+'</span>' : '')+'</span>' +
      '<span class="rangee">'+x.criteres.map(function(id){ return '<span class="etiq etiq-ref">'+esc(refTxt(PAR_ID[id]))+'</span>'; }).join('')+(remplacee ? '<span class="doux petit">remplacé par un retest</span>' : '')+'</span></div>' +
      '<span class="fixe rangee">'+(x.tag === 'nc' && x.criteres.length && !remplacee ? '<button type="button" class="btn btn-s" data-action="retest-fonction" data-id="'+x.id+'">Retester</button>' : '') +
      (x.tag !== 'nt' ? (brouillon.modif === x.id ? '<span class="doux petit">en cours de modification</span>' : '<button type="button" class="btn btn-s" data-action="modif-obs" data-id="'+x.id+'">'+ico('crayon')+'Modifier</button>') : '') +
      '<button type="button" class="btn btn-s btn-danger" data-action="suppr-obs" data-id="'+x.id+'">'+ico('corbeille')+(ui.confirmation === 'obs-'+x.id ? 'Confirmer' : 'Supprimer')+'</button></span></div>';
  }
  function vueFonction(o, f, et){
    var ecr = [];
    state.onglets.forEach(function(x){ ecransFonction(x, f.id).forEach(function(id){ ecr.push((x.id === o.id ? '' : x.nom+' : ')+ecranDe(x, id).nom); }); });
    var html = '<div class="rangee entre"><span class="rangee"><h2 class="titre-ecran">'+esc(f.nom)+'</h2><span class="pastille s-NT">fonction primaire</span></span><span class="doux petit">'+esc(etatFonction(f))+'</span></div>';
    html += '<p class="sans-marge doux petit">Vaut sur : '+esc(ecr.join(', '))+'. Une observation ici s\'applique à tous ces écrans, dans tous les onglets du projet.</p>';
    html += formulaireObs(o, null, et, f);
    var liste = obsF().filter(function(x){ return x.fonction === f.id; }).slice().reverse();
    html += '<section class="carte" aria-labelledby="t-obs"><h2 id="t-obs">Observations de cette fonction ('+liste.length+')</h2>' + (liste.length ? liste.map(ligneObsF).join('') : '<p class="doux">Aucune observation pour l\'instant.</p>') + '</section>';
    return cadreOnglet(o, 'audit', infoOnglet(o), html + boutonFin(o, et, f.id));
  }
  function vueAudit(o){
    if(!o.ecrans.length){ state.vue = 'preparer'; return vuePreparer(o); }
    var fC = fonctionCourante(o); if(fC) return vueFonction(o, fC, ETAPE[state.etape] || ETAPES[0]);
    var e = ecranDe(o, state.ecranId) || o.ecrans[0]; state.ecranId = e.id;
    var et = ETAPE[state.etape] || ETAPES[0];
    var nte = ntEcran(o, e);
    var html = '<div class="rangee entre"><span class="rangee"><h2 class="titre-ecran">'+esc(e.nom)+'</h2>'+(nte ? '<button type="button" class="pastille s-NT pastille-btn" data-action="vue" data-vue="grille" title="Voir et définir dans la grille">'+nte+' à définir sur cet écran</button>' : '<span class="pastille s-C">tous les statuts définis</span>')+'</span><span class="rangee">' +
        '<button type="button" class="btn btn-s" data-action="coller-obs">'+ico('coller')+'Coller des observations</button>' +
        '<button type="button" class="btn btn-s" data-action="import-auto">'+ico('import')+'Importer axe ou Lighthouse</button></span></div>';
    if(et.id === 'vide'){
      var att = pistesEnAttente(o, e).length;
      html += '<section class="carte rangee entre" aria-labelledby="t-import-vide">' +
          '<div><h2 class="titre-encadre" id="t-import-vide">Import automatique</h2>' +
          '<p class="marge-haut-2 doux petit">'+(att ? pluriel(att, 'piste axe ou Lighthouse en attente', 'pistes axe ou Lighthouse en attente')+' : elles apparaîtront à l\'étape où chaque critère se vérifie.' : 'Lance axe ou Lighthouse pendant ton tour à vide, puis importe le rapport. Les pistes apparaîtront plus tard, à l\'étape où chaque critère se vérifie.')+'</p></div>' +
          '<button type="button" class="btn btn-s" data-action="import-auto">'+ico('import')+'Importer axe ou Lighthouse</button></section>';
    }
    html += formulaireObs(o, e, et);
    html += vueCandidats(o, e);
    // Les statuts définis sans observation (C, NA) restent dans la grille ; ici, une seule ligne les résume.
    var liste = o.obs.filter(function(x){ return x.ecran === e.id || (x.partage && x.partage.ecrans.indexOf(e.id) > -1); });
    var sansObs = function(x){ return estStatutGrille(x) && x.tag !== 'nc'; };
    var dansGrille = liste.filter(sansObs).length;
    liste = liste.filter(function(x){ return !sansObs(x); }).reverse();
    html += '<section class="carte" aria-labelledby="t-obs"><h2 id="t-obs">Observations de cet écran ('+liste.length+')</h2>' + (liste.length ? liste.map(function(x){ return ligneObs(o, x, e); }).join('') : '<p class="doux">Aucune observation pour l\'instant.</p>') +
      (dansGrille ? '<p class="marge-haut-8 doux petit">'+dansGrille+' statut(s) défini(s) sans observation (grille) : voir la ' +
          '<button type="button" class="ref-btn" data-action="vue" data-vue="grille">grille</button>.</p>' : '') + '</section>';
    // Observations des fonctions primaires présentes sur cet écran : rappel, elles se modifient depuis la fonction.
    var lf = obsF().filter(function(x){ var f = fonctionDe(x.fonction); return f && f.presente && x.tag !== 'nt' && !obsFRemplacee(x) && ecransFonction(o, x.fonction).indexOf(e.id) > -1; });
    if(lf.length) html += '<section class="carte" aria-labelledby="t-obs-f"><h2 id="t-obs-f">Fonctions primaires sur cet écran ('+lf.length+')</h2>' + lf.map(function(x){
      var f = fonctionDe(x.fonction), cl = x.criteres.length ? x.tag.toUpperCase() : 'NOTE';
      return '<div class="obs"><span class="pastille s-'+cl+'">'+({C:'C', NC:'NC', NA:'NA', NOTE:'Note'}[cl])+'</span>' +
          '<div class="corps"><span class="texte">'+esc(x.texte)+'</span><span class="rangee"><span class="etiq">'+esc(f.nom)+'</span>'+x.criteres.map(function(id){ return '<span class="etiq etiq-ref">'+esc(refTxt(PAR_ID[id]))+'</span>'; }).join('')+'</span></div>' +
          '<button type="button" class="fixe btn btn-s" data-action="cible-fonction" data-id="'+f.id+'">Ouvrir la fonction</button></div>';
    }).join('') + '</section>';
    html += boutonFin(o, et, e.id);
    return cadreOnglet(o, 'audit', infoOnglet(o), html);
  }

  // Résultats d'un outil automatique : jamais un statut, seulement des pistes à reprendre dans une observation.
  // Une piste automatique se montre à l'étape où son critère se vérifie (sans critère : étape Code et outils).
  // Ainsi le tour à vide reste sans outil : l'import y est lancé, mais ses pistes n'orientent pas le regard.
  function etapeDuCritere(c, etId){ return !!c && (c.etape === etId || (c.etape === '3' && /^3/.test(etId))); }
  function pisteVisible(k, etId){
    if(k.source === 'collage') return true;
    if(!k.criteres.length) return etId === '2';
    return k.criteres.some(function(id){ return etapeDuCritere(PAR_ID[id], etId); });
  }
  function pistesEnAttente(o, e){ return (o.candidats || []).filter(function(k){ return k.ecran === e.id && k.etat === 'ouvert' && k.source !== 'collage'; }); }
  function vueCandidats(o, e){
    var l = (o.candidats || []).filter(function(k){ return k.ecran === e.id && k.etat === 'ouvert' && (state.vue !== 'audit' || pisteVisible(k, state.etape)); });
    if(!l.length) return '';
    var sources = []; l.forEach(function(k){ if(sources.indexOf(k.outil) === -1) sources.push(k.outil); });
    return '<section class="carte" aria-labelledby="t-auto"><h2 id="t-auto">Pistes à vérifier ('+l.length+')</h2>' +
        '<p class="marge-haut-4 doux petit">'+esc(sources.join(', '))+'. Une piste ne compte pas tant que tu ne l\'as pas reprise dans une observation.</p>' + l.map(function(k){
      var colle = k.source === 'collage';
      var pastille = colle ? '<span class="pastille-84 pastille s-'+(k.tag || 'nc').toUpperCase()+'">'+(k.tag || 'nc').toUpperCase()+'</span>'
        : '<span class="pastille-84 pastille '+(k.type === 'violation' ? 's-NC' : 's-NT')+'">'+(k.type === 'violation' ? 'échec' : 'à vérifier')+'</span>';
      return '<div class="obs">'+pastille+'<div class="corps"><span class="texte">'+esc(k.titre)+'</span>' +
        '<span class="rangee">'+(k.element ? '<span class="etiq">'+esc(k.element)+'</span>' : '')+(k.point ? '<span class="doux petit">'+esc((SYMPTOMES.filter(function(x){ return x.id === k.point; })[0] || {}).controle || '')+'</span>' : '')+(k.regle ? '<span class="etiq etiq-ref">'+esc(k.regle)+'</span>' : '')+k.criteres.map(function(id){ return '<span class="etiq etiq-ref">'+esc(refTxt(PAR_ID[id]))+'</span>'; }).join('') +
        (colle ? (k.propose ? '<span class="doux petit">proposé d\'après les mots de l\'observation</span>' : (k.criteres.length ? '' : '<span class="doux petit">aucun critère : à choisir</span>')) : '<span class="doux petit">'+k.nb+' élément'+(k.nb > 1 ? 's' : '')+'</span>')+'</span>' +
        (k.autresEcrans && k.autresEcrans.length ? '<span class="doux petit">aussi sur : '+esc(k.autresEcrans.map(function(id){ return (ecranDe(o, id) || {}).nom; }).filter(Boolean).join(', '))+'</span>' : '') +
        (k.exemples && k.exemples.length ? '<code class="coupe-mots petit doux">'+esc(k.exemples.join(' · '))+'</code>' : '') + '</div>' +
        '<span class="fixe rangee"><button type="button" class="btn btn-s btn-l" data-action="reprendre" data-id="'+k.id+'">Reprendre</button>' +
            '<button type="button" class="btn btn-s" data-action="ecarter" data-id="'+k.id+'">Écarter</button></span></div>';
    }).join('') + '</section>';
  }

  // ---------- Rendu : formulaire d'observation ----------
  // Récapitulatif au pied du formulaire : ce qui sera enregistré.
  // Formulaire d'observation en trois questions, dans l'ordre où l'auditeur pense : ce qu'il a vu, les critères, le résultat.
  // Les points de contrôle ne sont plus un champ : ils servent en coulisse aux suggestions et à la recherche de critères.

  // Une seule recherche, une ligne par critère : numéro, noms simples (points de contrôle) et début de l'intitulé officiel,
  // pour qu'un mot, un numéro ou l'intitulé retrouvent le même critère, sans doublon.
  function optionsRecherche(){
    return CRITERES.map(function(c){
      var noms = [], point = '', elt = '';
      SYMPTOMES.forEach(function(sy){
        if(sy.criteres.indexOf(c.id) > -1){ noms.push(sy.controle); if(!point) point = sy.id; }
        sy.selon.forEach(function(x, i){ if(x.criteres.indexOf(c.id) > -1){ noms.push(sy.controle+', '+x.element); if(!point){ point = sy.id; elt = String(i); } } });
      });
      noms = noms.filter(function(n, k){ return noms.indexOf(n) === k; });
      var lib = c.libelle.length > 90 ? c.libelle.slice(0, 88)+'...' : c.libelle;
      return '<option value="'+esc(refTxt(c)+' · '+(noms.length ? noms.join(' / ')+' · ' : '')+lib)+'" data-crit="'+c.id+'" data-point="'+point+'" data-element="'+elt+'">';
    }).join('');
  }
  // Nom court d'un critère : le nom du premier point de contrôle qui y mène, sinon le début de son intitulé.
  function nomCourt(c){
    var sy = SYMPTOMES.filter(function(x){ return x.criteres.indexOf(c.id) > -1 || x.selon.some(function(y){ return y.criteres.indexOf(c.id) > -1; }); })[0];
    if(sy) return sy.controle;
    return c.libelle.length > 60 ? c.libelle.slice(0, 58).trim()+'...' : c.libelle;
  }
  var TEXTES_RESULTAT = {
    c:'Conforme ici ; sur les autres écrans cochés, les critères restent à confirmer.',
    nc:'Les critères passent non conformes sur les écrans concernés.',
    na:'Les critères passent non applicables sur les écrans concernés.'
  };
  function formulaireObs(o, e, et, f){
    var enModif = brouillon.modif ? o.obs.concat(obsF()).filter(function(x){ return x.id === brouillon.modif; })[0] : null;
    var html = '<form class="carte pile'+(enModif ? ' form-modif' : '')+'" id="form-obs" novalidate>' +
        '<div class="rangee entre"><h2 id="form-obs-titre">'+(enModif ? 'Modifier l\'observation' : 'Nouvelle observation <span class="doux petit">· '+esc(et.nom)+'</span>')+'</h2>' +
        '<span class="rangee"><span class="doux petit"><span class="oblig" aria-hidden="true">*</span> obligatoire</span><button type="button" class="ref-btn petit" data-action="referentiel">Aide</button></span></div>';
    // Deux chemins séparés : ici on part d'une observation ; on part d'un critère dans la grille.
    if(!f && !enModif) html += '<p class="sans-marge doux petit">Tu pars d\'un critère plutôt que d\'une observation ? <button type="button" class="ref-btn" data-action="vue" data-vue="grille">Va dans la grille</button>.</p>';
    // 1. Ce que l'auditeur a vu.
    html += '<h3 class="sous-titre-form">1. Qu\'as-tu vu ?</h3>';
    html += '<div class="champ"><label class="lbl" for="obs-texte">Observation<span class="oblig" aria-hidden="true">*</span></label>' +
        '<textarea id="obs-texte" rows="2" aria-required="true" placeholder="Ce que tu vois, entends ou atteins.">'+esc(brouillon.texte)+'</textarea></div>';
    if(!f){
      var noms = {}; o.obs.forEach(function(x){ if(x.elementNom) noms[x.elementNom] = true; });
      html += '<div class="grille2"><div class="champ"><label class="lbl" for="obs-partage-nom">Élément</label>' +
          '<input type="text" id="obs-partage-nom" list="noms-partages" value="'+esc(brouillon.nomPartage)+'" placeholder="Ex. &quot;Payer&quot; button" autocomplete="off" aria-describedby="aide-element">' +
          '<p class="sans-marge doux petit" id="aide-element">Libellé puis type, sans l\'écran ni crochets.</p><datalist id="noms-partages">'+Object.keys(noms).map(function(n){ return '<option value="'+esc(n)+'">'; }).join('')+'</datalist></div>' +
        '<fieldset class="groupe-nu champ"><legend class="sans-retrait lbl">Écrans concernés</legend><div class="ecart-col-20 rangee">' + o.ecrans.map(function(x){

        '<p class="sans-marge doux petit" id="aide-attendu">Repris dans le ticket Jira (« Expected behavior »). Vide : l\'intitulé du critère.</p></details>';

      html += '<div class="champ"><span class="lbl" id="lbl-retenus">Critères retenus</span><ul class="crit-retenus" aria-labelledby="lbl-retenus">' + choisis.map(function(id){

          '<button type="button" class="btn btn-s" data-action="retirer-crit" data-retirer="'+id+'" aria-label="Retirer '+esc(refTxt(c))+'">Retirer</button></li>';

        return '<button type="button" class="ref-btn" data-action="remettre-crit" data-retirer="'+id+'">Remettre '+esc(refTxt(c))+' · '+esc(nomCourt(c))+'</button>'; }).join(', ')+'</p>';

    html += '<details class="champ" id="det-ajout"'+(brouillon.rechercheOuverte ? ' open' : '')+'><summary class="ref-btn petit">Le bon critère n\'est pas proposé ?</summary>' +

      '</div><p class="sans-marge souple-260 doux petit" id="aide-resultat">'+(TEXTES_RESULTAT[brouillon.tag] || '')+'</p></div><span class="rangee">' +

  }

  function cellule(s, conflit, n){
    var lib = {C:'C', NC:'NC', NT:'NT', NA:'NA', AC:'C ?'}[s];

  }

  // ---------- Rendu : grille et référentiel ----------
  // Regroupement des critères : thématiques officielles du RAWeb (triées par numéro) ou thèmes RUXAL.
  function groupesCriteres(officiel){
    var noms = [];
    if(officiel){
      CRITERES.forEach(function(c){ var g = c.horsRef ? 'Bonnes pratiques hors RAWeb' : c.theme_ref; if(noms.indexOf(g) === -1) noms.push(g); });
      noms.sort(function(a, b){ return (parseInt(a, 10) || 99) - (parseInt(b, 10) || 99); });
    } else noms = THEMES_RUXAL;
    return noms.map(function(th){
      var cs = CRITERES.filter(function(c){ return officiel ? (c.horsRef ? 'Bonnes pratiques hors RAWeb' : c.theme_ref) === th : c.theme_ruxal === th; });
      if(officiel) cs.sort(function(a, b){ var x = String(a.ref || '99.'+a.id).split('.').map(Number), y = String(b.ref || '99.'+b.id).split('.').map(Number); return (x[0]-y[0]) || ((x[1]||0)-(y[1]||0)); });
      return {th:th, cs:cs};
    }).filter(function(g){ return g.cs.length; });
  }
  function boutonsRegroupement(nu){
    var officiel = state.theming !== 'ruxal';
    return (nu ? '' : '<div class="rangee">') + '<span class="lbl" id="lbl-regroup">Regrouper par</span><div class="tags" role="group" aria-labelledby="lbl-regroup">' +
      [['officiel','Thématiques RAWeb'],['ruxal','Thèmes RUXAL']].map(function(v){ var on = (v[0] === 'officiel') === officiel; return '<button type="button" class="tag" data-action="theming" data-v="'+v[0]+'" aria-pressed="'+on+'">'+v[1]+'</button>'; }).join('') + '</div>' + (nu ? '' : '</div>');
  }
  // Référentiel : toutes les fiches, pour apprendre les critères ou les imprimer (PDF par l'impression du navigateur).
  function vueReferentiel(){
    var officiel = state.theming !== 'ruxal';
    var html = '<div class="rangee entre ref-tete"><h1>Référentiel</h1><button type="button" class="btn btn-s" data-action="imprimer-ref">'+ico('imprimer')+'Imprimer ou enregistrer en PDF</button></div>' +
      '<p class="sans-marge doux">'+RAWEB.length+' critères RAWeb 1.1 ('+SELECTION.length+' de la sélection SIP, '+(RAWEB.length - SELECTION.length)+' hors sélection) et '+(CRITERES.length - RAWEB.length)+' bonnes pratiques hors RAWeb. Chaque fiche dit comment vérifier le critère, à quelle étape, son impact et sa gravité.</p>' +
      '<div class="ref-outils">'+boutonsRegroupement()+'</div>' +
      '<section class="carte pile" aria-labelledby="t-noter"><h2 id="t-noter">Noter les éléments</h2>' +
      '<p class="sans-marge">Dans une observation, le champ Élément reçoit le libellé entre guillemets puis le type, par exemple <code>"Payer" button</code>. Sans libellé visible, le type seul : <code>list</code>. Dans un autre élément, du plus large au plus précis, séparés par une virgule : <code>"Livraison" form, "Code postal" field</code>. L\'état entre parenthèses seulement s\'il faut le provoquer pour voir le défaut : <code>"Payer" button (disabled)</code> ; sinon, dis-le dans l\'observation. Pas de points, pas de crochets.</p>' +
      '<p class="sans-marge">L\'export Jira ajoute l\'écran devant : <code>Panier ["Payer" button]</code>. Un élément présent sur tous les écrans est noté <code>All screens [Menu principal]</code> ; sur quelques écrans, ils sont listés : <code>Panier, Paiement [Menu principal]</code>. Un passage d\'un écran à l\'autre, dans un scénario, est noté <code>Panier -> Paiement</code>.</p></section>' +
      '<section class="carte pile" aria-labelledby="t-ia"><h2 id="t-ia">Convertir des notes avec une IA</h2>' +
          '<p class="sans-marge">Tu peux écrire tes observations librement, puis les faire convertir par une IA au format du bouton « Coller des observations » (dans la Saisie) : une ligne par observation, avec les numéros des critères RAWeb. L\'outil les ajoute comme pistes à vérifier. Avec Microsoft 365 Copilot, installe plutôt l\'agent prêt à l\'emploi : <a href="'+URL_AGENTS+'" target="_blank" rel="noopener">agents Copilot de RUXAWEB</a> (guide d\'installation compris).</p>' + blocConsigne(onglet(), 'consigne-ref') + '</section>';
    groupesCriteres(officiel).forEach(function(g){
      html += '<section class="ref-groupe" aria-labelledby="g-'+g.cs[0].id+'"><h2 id="g-'+g.cs[0].id+'">'+esc(g.th)+' <span class="doux petit">('+g.cs.length+')</span></h2>' +
        g.cs.map(function(c){ return '<article class="carte pile ref-fiche"><h3 class="sans-marge">'+esc(refTxt(c))+' <span class="grav grav-'+c.niveau+'">'+GRAVITE[c.niveau]+'</span></h3>'+infoCritere(c, 'h4', true)+'</article>'; }).join('') + '</section>';
    });
    return html;
  }
  // Nombre d'observations (hors statuts posés dans la grille) qui définissent un critère sur un écran.
  function nbObs(o, e, c){
    return o.obs.filter(function(x){ return x.tag !== 'nt' && !estStatutGrille(x) && x.criteres.indexOf(c.id) > -1 && concerne(x, e.id, c); }).length;
  }
  // Grille : le lieu des statuts. Une case s'ouvre sur la fiche du critère, avec C / NC / NA par écran.
  // Les NC des observations de la Saisie s'y reportent ; la colonne Résultat donne le statut retenu pour l'onglet.
  function vueGrille(o){
    var html = '<h2 class="sr">Grille des critères</h2>';
    var officiel = state.theming !== 'ruxal', filtre = ui.grilleFiltre === 'definir';
    var nDef = criteresADefinir(o).length;
    // Barre d'outils en grille : libellés dans une colonne, groupes de boutons alignés, Valider à droite.
    html += '<div class="outils-grille">' + boutonsRegroupement(true) + '<span></span>' +
      '<span class="lbl" id="lbl-filtre">Afficher</span><div class="tags" role="group" aria-labelledby="lbl-filtre">' +
        [['tous','Tous les critères'],['definir','À définir ('+nDef+')']].map(function(v){ var on = (v[0] === 'definir') === filtre; return '<button type="button" class="tag" data-action="grille-filtre" data-v="'+v[0]+'" aria-pressed="'+on+'">'+v[1]+'</button>'; }).join('') +
      '</div><button type="button" class="btn btn-p" data-action="valider">'+(o.valide ? 'Onglet validé, voir le résumé' : 'Valider l\'onglet')+'</button></div>';
    html += blocAlertes(o);
    html += '<p class="sans-marge doux petit">Clique sur une case pour définir son statut ; au clavier, les flèches passent d\'une case à l\'autre. Le chiffre compte les observations ; Résultat : le statut retenu pour l\'onglet.</p>';
    var groupes = groupesCriteres(officiel).map(function(g){
      return {th:g.th, cs:filtre ? g.cs.filter(function(c){ return o.ecrans.some(function(e){ var r = statutEcran(o, e, c).s; return r === 'NT' || r === 'AC'; }); }) : g.cs};
    }).filter(function(g){ return g.cs.length; });
    if(filtre && !groupes.length) return cadreOnglet(o, 'grille', infoGrille(o), html + '<div class="carte"><p class="sans-marge">Tous les critères ont un statut. Tu peux valider l\'onglet.</p></div>');
    html += '<div class="tableau"><table><thead><tr><th scope="col">Critère</th><th scope="col">Intitulé</th>' + o.ecrans.map(function(e){ return '<th scope="col" class="col-ecran'+(e.id === state.ecranId ? ' col-ici' : '')+'">'+esc(e.nom)+'</th>'; }).join('') + '<th scope="col" class="col-ecran col-resultat">Résultat</th></tr></thead>';
    groupes.forEach(function(g){
      // Un tbody par thème : l'en-tête du groupe porte scope="rowgroup".
      html += '<tbody><tr class="theme"><th colspan="'+(o.ecrans.length + 3)+'" scope="rowgroup">'+esc(g.th)+'</th></tr>';
      g.cs.forEach(function(c){
        html += '<tr><th scope="row"><button type="button" class="ref-btn" data-action="critere" data-id="'+c.id+'">'+esc(refTxt(c))+'</button>' +
            '<div class="grav grav-'+c.niveau+'">'+GRAVITE[c.niveau]+'</div>'+(c.horsSelection ? '<div class="doux petit">hors sélection</div>' : '')+(c.horsRef ? '<div class="doux petit">hors taux</div>' : '')+'</th><td class="intitule">'+esc(c.libelle)+'</td>' +
          o.ecrans.map(function(e){
            var r = statutEcran(o, e, c), ici = e.id === state.ecranId ? ' col-ici' : '';
            if(r.cfg) return '<td class="statut'+ici+'" title="Contenu absent de cet écran">'+cellule(r.s)+'</td>';
            var n = nbObs(o, e, c);
            return '<td class="statut'+ici+'"><button type="button" class="cel-btn" tabindex="-1" data-action="cellule" data-id="'+c.id+'" data-ecran="'+e.id+'">' +
              '<span class="sr">'+esc(refTxt(c))+' sur '+esc(e.nom)+' : </span>'+cellule(r.s, r.conflit, n)+'</button></td>';
          }).join('') +
          '<td class="statut col-resultat"><span class="sr">Résultat : </span>'+cellule(statutOnglet(o, c))+'</td></tr>';
      });
      html += '</tbody>';
    });
    return cadreOnglet(o, 'grille', infoGrille(o), html + '</table></div>');
  }
  // Contrôle avant validation : C dont le texte décrit un défaut, NC sans élément (le ticket Jira n'aurait que l'écran).
  var MOTS_DEFAUT = /\b(not|no|missing|cannot|can't|isn't|aren't|doesn't|don't|lack|lacks|unable|pas|aucun|aucune|manque|manquant|impossible|absent|absente|jamais|insuffisant|insuffisante)\b/i;
  function alertesValidation(o){
    var l = [];
    o.obs.forEach(function(x){
      if(!x.criteres.length || x.tag === 'nt') return;
      if(obsRetestee(o, x)) return;
      var c = PAR_ID[x.criteres[0]], e = ecranDe(o, x.ecran) || {};
      if(x.tag === 'c' && !estStatutGrille(x) && MOTS_DEFAUT.test(x.texte)) l.push({c:c, e:e, raison:'conforme, mais le texte semble décrire un défaut : « '+x.texte+' »'});
      if(x.tag === 'nc' && !x.elementNom) l.push({c:c, e:e, raison:'non conforme sans élément : le ticket Jira n\'indiquera que l\'écran'});
    });
    return l;
  }
  function blocAlertes(o){
    if(ui.confirmation !== 'valider-'+o.id) return '';
    var l = alertesValidation(o);
    return '<section class="carte pile alerte" aria-labelledby="t-alertes"><h2 id="t-alertes">À vérifier avant de valider ('+l.length+')</h2>' +
      '<ul class="sans-puce">' + l.map(function(x){ return '<li><button type="button" class="ref-btn" data-action="cellule" data-id="'+x.c.id+'" data-ecran="'+x.e.id+'">'+esc(refTxt(x.c))+' · '+esc(x.e.nom || '')+'</button> <span class="doux">'+esc(x.raison)+'</span></li>'; }).join('') + '</ul>' +
      '<div class="rangee"><button type="button" class="btn btn-p" data-action="valider">Valider quand même</button></div></section>';
  }
  // Grille : le nombre de critères à définir figure déjà sur le filtre « À définir » ; l'en-tête ne montre que les taux.
  function infoGrille(o){ return taux(o, SELECTION).complet ? infoOnglet(o) : ''; }
  function infoOnglet(o){
    var t = taux(o, SELECTION), te = taux(o, RAWEB), n = criteresADefinir(o).length;
    return '<span class="doux">'+(t.complet ? 'Sélection SIP <b class="niv-'+niveauTaux(t.pct).cle+'">'+t.pct+' % ('+niveauTaux(t.pct).lib.toLowerCase()+')</b>'+(o.type === 'scenario' ? '' : ' · élargi '+te.pct+' %') : n+' critère'+(n > 1 ? 's' : '')+' à définir sur l\'ensemble des écrans')+'</span>';
  }

  function aDefinir(o){
    var l = [];
    o.ecrans.forEach(function(e){ CRITERES.forEach(function(c){ var s = statutEcran(o, e, c).s; if(s === 'NT' || s === 'AC') l.push({e:e, c:c, s:s}); }); });
    return l;
  }
  // ---------- Rendu : statuts posés dans la grille, résumé et fiche d'un critère ----------
  // « Tous les écrans » pose le même statut sur chaque écran modifiable, critère par critère.
  function criteresADefinir(o){
    var l = aDefinir(o), ids = [];
    l.forEach(function(x){ if(ids.indexOf(x.c.id) === -1) ids.push(x.c.id); });
    ids.sort(function(a, b){ return CRITERES.indexOf(PAR_ID[a]) - CRITERES.indexOf(PAR_ID[b]); });
    return ids.map(function(id){ return {c:PAR_ID[id], ecrans:l.filter(function(x){ return x.c.id === id; })}; });
  }
  // Statut posé dans la grille pour un critère sur un écran (le dernier), toujours modifiable.
  // Un statut posé pour « tous les écrans » avec un NC est une seule observation partagée (un seul ticket Jira).
  function estGrille(x, cid){ return estStatutGrille(x) && x.criteres.length === 1 && x.criteres[0] === cid && x.tag !== 'nt'; }
  function obsGrille(o, eid, cid){
    var l = o.obs.filter(function(x){ return estGrille(x, cid) && (x.ecran === eid || (x.partage && x.partage.ecrans.indexOf(eid) > -1)); });
    return l[l.length - 1] || null;
  }
  // Retire l'écran du statut posé dans la grille (une observation partagée garde ses autres écrans).
  function retirerStatut(o, eid, cid){
    o.obs = o.obs.filter(function(x){
      if(!estGrille(x, cid)) return true;
      if(x.partage && x.partage.ecrans.indexOf(eid) > -1){ x.partage.ecrans = x.partage.ecrans.filter(function(id){ return id !== eid; }); if(!x.partage.ecrans.length) x.partage = null; return true; }
      if(x.ecran !== eid) return true;
      if(x.partage){ x.ecran = x.partage.ecrans.shift(); if(!x.partage.ecrans.length) x.partage = null; return true; }
      return false;
    });
  }
  function poserStatut(o, eids, cid, tag, texte){
    eids = [].concat(eids); if(!eids.length) return;
    eids.forEach(function(eid){ retirerStatut(o, eid, cid); });
    if(tag === 'nc') o.obs.push({id:uid(), n:suivant(), ecran:eids[0], etape:ETAPE_GRILLE, texte:texte, attendu:'', point:'', criteres:[cid], tag:'nc', partage:eids.length > 1 ? {nom:'', ecrans:eids.slice(1)} : null});
    else eids.forEach(function(eid){ o.obs.push({id:uid(), n:suivant(), ecran:eid, etape:ETAPE_GRILLE, texte:'', attendu:'', point:'', criteres:[cid], tag:tag, partage:null}); });
    o.valide = false;
  }
  // Écrans où le statut d'un critère peut se poser depuis la fiche (pas de contenu absent, pas défini par une observation de l'audit).
  function ecransModifiables(o, c){
    return o.ecrans.filter(function(e){ var r = statutEcran(o, e, c); return !r.cfg && (!!obsGrille(o, e.id, c.id) || r.s === 'NT' || r.s === 'AC'); });
  }
  // Statut d'un critère sur chaque écran, à poser sans observation (C, NA) ou avec une courte observation (NC).
  // Un statut venu d'une observation de l'audit n'est pas modifiable ici : on le retest.
  function ligneStatut(c, eid, nom, note, sel, modifiable, extra){
    var cle = eid+'|'+c.id;
    return '<div class="centre-v obs'+(ui.ficheEcran === eid ? ' cible-fiche' : '')+(eid === 'tous' ? ' ligne-tous' : '')+'" data-bloc-ecran="'+eid+'"><div class="corps"><span><b>'+esc(nom)+'</b>'+(note ? ' <span class="doux petit">('+esc(note)+')</span>' : '')+'</span>' +
        (ui.saisieNc === cle ? '<div class="rangee"><label class="sr" for="statut-txt">Observation de non-conformité, '+esc(nom)+'</label>' +
            '<input class="souple-240" type="text" id="statut-txt" aria-required="true" placeholder="Observation (obligatoire pour un NC)" autocomplete="off">' +
            '<button type="button" class="btn btn-s btn-p" data-action="statut-nc-ok" data-ecran="'+eid+'" data-crit="'+c.id+'">Enregistrer</button></div>' : '') + (extra || '') + '</div>' +
      '<div class="tags" role="group" aria-label="Statut, '+esc(nom)+'">' +
        [['c','C','statut'],['nc','NC','statut-nc'],['na','NA','statut']].map(function(t){
          var on = sel === t[1] || (t[0] === 'nc' && ui.saisieNc === cle);
          return '<button type="button" class="tag tag-'+t[0]+'" data-action="'+t[2]+'" data-tag="'+t[0]+'" data-ecran="'+eid+'" data-crit="'+c.id+'" aria-pressed="'+on+'"'+(modifiable ? '' : ' disabled')+'>'+t[1]+'</button>';
        }).join('') + '</div></div>';
  }
  function blocStatuts(o, c){
    var mods = ecransModifiables(o, c);

    var selTous = sels.length && sels.every(function(x){ return x && x === sels[0]; }) ? sels[0] : '';
    var fixes = o.ecrans.filter(function(e){ return !statutEcran(o, e, c).cfg && mods.indexOf(e) === -1; });
    var html = mods.length > 1 ? ligneStatut(c, 'tous', 'Tous les écrans', fixes.length ? 'sauf '+fixes.map(function(e){ return e.nom; }).join(', ')+', défini par une observation' : '', selTous, true) : '';
    html += o.ecrans.map(function(e){
      var r = statutEcran(o, e, c); if(r.cfg) return '';
      var clo = obsGrille(o, e.id, c.id);
      var modifiable = !!clo || r.s === 'NT' || r.s === 'AC';
      var sel = r.s === 'AC' || r.s === 'NT' ? '' : r.s;
      var note = r.s === 'AC' ? 'conforme sur un autre écran, à confirmer ici' : (!modifiable ? 'défini par une observation' : (clo && clo.tag === 'nc' ? clo.texte : ''));

  // ---------- Messages, focus et enregistrement des observations ----------
  function message(txt, erreur){
    var s = document.getElementById('statut'); s.textContent = txt; s.className = erreur ? 'erreur' : ''; s.hidden = false;
    clearTimeout(message.t); message.t = setTimeout(function(){ s.hidden = true; }, 6000);
  }
  function lireBrouillon(){
    var f = document.getElementById('form-obs'); if(!f) return;

    if(g('obs-texte') !== null) brouillon.texte = g('obs-texte');
    if(g('obs-attendu') !== null) brouillon.attendu = g('obs-attendu');
    if(g('obs-partage-nom') !== null) brouillon.nomPartage = g('obs-partage-nom');
    if(g('obs-vers') !== null) brouillon.vers = g('obs-vers');
    // Les critères retenus ne se lisent pas dans le formulaire : Retirer et Remettre modifient directement le brouillon.
    var ep = f.querySelectorAll('[data-ecran-partage]');
    if(ep.length) brouillon.ecransPartage = Array.prototype.filter.call(ep, function(x){ return x.checked; }).map(function(x){ return x.getAttribute('data-ecran-partage'); });
  }
  function viderBrouillon(){ brouillon = {texte:'', attendu:'', point:'', element:'', crits:[], retires:[], tag:brouillon.modif ? 'nc' : brouillon.tag, nomPartage:'', ecransPartage:[], vers:'', candidat:null, modif:null}; }
  var MAX_AUDIT = 5;

  function enregistrerObs(){

      var avf = brouillon.modif ? obsF().filter(function(y){ return y.id === brouillon.modif; })[0] : null;

  // ---------- Actions ----------

    else if(t.name === 'onglet-type'){
      // Un nom encore par défaut suit le type choisi (« Audit 2 » devient « Scénario 2 »).
      var m = /^(Audit rapide|Audit|Scénario) (\d+)$/.exec(o.nom);
      o.type = t.value; if(m) o.nom = (o.type === 'scenario' ? 'Scénario ' : 'Audit ')+m[2];
      rendre(); var r = document.querySelector('input[name="onglet-type"][value="'+o.type+'"]'); if(r) r.focus();
    }
    else if(t.hasAttribute('data-fonction-ecran')){
      var fid = t.getAttribute('data-fonction-ecran'); o.fonctionsEcrans = o.fonctionsEcrans || {};
      var lst = ecransFonction(o, fid).filter(function(id){ return id !== t.value; }); if(t.checked) lst.push(t.value);
      o.fonctionsEcrans[fid] = o.ecrans.map(function(x){ return x.id; }).filter(function(id){ return lst.indexOf(id) > -1; });
      o.valide = false; sauver();
      if(ui.dlg === 'config') rendre(); // la fenêtre reste telle quelle (focus gardé) ; la page derrière se met à jour
    }
    else if(t.hasAttribute('data-ecran-nom')){ var e = ecranDe(o, t.getAttribute('data-ecran-nom')); e.nom = t.value.trim() || e.nom; sauver(); }
    else if(t.hasAttribute('data-crit') || t.hasAttribute('data-ecran-partage')){
      lireBrouillon();
    }
    else if(t.id === 'obs-ajout' && t.value){ if(!ajouterRecherche(t)) message('Choisis une proposition de la liste : tape un mot ou un numéro, puis sélectionne.', true); }
    else if(t.id === 'fichier-auto' && t.files[0]){
      var fa = new FileReader(); fa.onload = function(){ importerRapport(fa.result); t.value = ''; }; fa.readAsText(t.files[0]);
    }
    else if(t.id === 'fichier-import' && t.files[0]){
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var s = JSON.parse(fr.result);
          if(s && s.v === 2 && Array.isArray(s.onglets)){ state = normaliser(s); state.vue = 'projet'; rendre(true); message('Sauvegarde ouverte.'); }
          else if(s && s.outil === 'RUXAWEB-etat' && s.state && Array.isArray(s.state.onglets)){
            state = normaliser(migrerV1(s.state)); sauver(); rendre(true);
            message('Sauvegarde '+(s.outilVersion || '1.x')+' convertie : les statuts sont repris. Les critères ajoutés depuis restent à définir dans la grille.');
          }
          else message('Ce fichier n\'est pas une sauvegarde de RUXAWEB.', true);
        }catch(e){ message('Fichier illisible : choisis un fichier .json enregistré par RUXAWEB 2.', true); }
        t.value = '';
      };
      fr.readAsText(t.files[0]);
    }
  });

  // ---------- Exports ----------
  function nomFichier(type, ext){
    var nom = (state.auditNom || 'projet').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0, 50) || 'projet';
    var d = new Date(), p = function(n){ return String(n).padStart(2, '0'); };
    return 'projet-a11y_'+nom+'_'+type+'_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+ext;
  }
  function telecharger(nom, data){
    var types = {json:'application/json', csv:'text/csv;charset=utf-8', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
    var blob = new Blob([data], {type: types[nom.split('.').pop()] || 'application/octet-stream'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = nom; a.hidden = true; document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 10000);
  }
  function exporterXlsx(){
    if(!state.onglets.length){ message('Rien à exporter : crée d\'abord un onglet.', true); return; }
    var lignes = [];
    state.onglets.forEach(function(o){
      CRITERES.forEach(function(c){
        var s = statutOnglet(o, c);
        var ecr = o.ecrans.filter(function(e){ return statutEcran(o, e, c).s === 'NC'; }).map(function(e){ return e.nom; });
        var observations = o.obs.filter(function(x){ return x.tag === 'nc' && x.criteres.indexOf(c.id) > -1; }).map(function(x){ return ((ecranDe(o, x.ecran) || {}).nom || '') + ' : ' + x.texte; });
        lignes.push([o.nom, c.horsRef ? 'Bonne pratique' : c.ref, c.horsRef ? 'Hors RAWeb, hors taux' : (c.horsSelection ? 'Hors sélection SIP' : 'Sélection SIP'), c.theme_ref, c.libelle, c.niveau_wcag, s, ecr.join(', '), observations.join('\n')]);
      });
      if(o.type === 'scenario') HEURISTIQUES.forEach(function(h, k){
        var cur = (o.heuristiques || {})[h.id] || {};
        lignes.push([o.nom, 'POUR/UX '+(k+1), 'Lecture qualitative, hors taux', 'Parcours entier', h.texte, '', ({succes:'Succès', difficile:'Difficile', echec:'Échec', na:'N/A'})[cur.statut] || 'Sans réponse', '', cur.commentaire || '']);
      });
    });
    var x = construireXlsx({nom:'Critères', colonnes:[['Onglet',26],['Critère',10],['Sélection',22],['Thématique RAWeb',26],['Intitulé',70],['Niveau',8],['Statut',8],['Écrans non conformes',28],['Observations',70]].map(function(c){ return {titre:c[0], largeur:c[1], statut:c[0] === 'Statut'}; }), lignes:lignes});
    telecharger(nomFichier('grille','xlsx'), x); message('Grille des critères téléchargée (Excel).');
  }
  function csv(v){ var t = String(v == null ? '' : v); return /[,"\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; }
  function pluriel(n, un, plusieurs){ return n + ' ' + (n > 1 ? plusieurs : un); }
  // Une ligne de ticket Jira (CSV) pour une observation non conforme ; objet et zone disent où elle se trouve.
  // Noms anglais des thèmes RUXAL, utilisés dans le titre des tickets Jira (l'interface garde les noms français).
  var THEME_EN = {'Navigation & structure':'Navigation & structure', 'Composants interactifs':'Interactive components', 'Images & médias':'Images & media',
    'Couleurs & contrastes':'Colors & contrast', 'Contenu & lisibilité':'Content & readability', 'Fondations techniques':'Technical foundations', 'Formulaires':'Forms'};
  // Tags Jira indicatifs (le product owner trie), selon le point de contrôle : design, code, ou les deux quand le
  // correctif dépend de la cause (ou sans point de contrôle).
  var TAGS_POINT = {};
  ['contraste','couleur-seule','forme-position','cible-petite','flash'].forEach(function(id){ TAGS_POINT[id] = ['design']; });
  ['nom-absent','decoratif-restitue','cache-restitue','role-etat','message-non-restitue','langue','zones','listes','tableau','code-invalide',
   'non-atteignable','ordre-focus','piege','commandes-media','annulation-pointeur'].forEach(function(id){ TAGS_POINT[id] = ['code']; });
  function ticketJira(x, objet, zone){
        var cs = x.criteres.map(function(id){ return PAR_ID[id]; }).sort(function(a, b){ return RANG_GRAVITE[a.niveau] - RANG_GRAVITE[b.niveau]; });
        // Défaut : le symptôme en 8 mots au plus, sinon à compléter (une phrase coupée n'est pas un titre).
        var defaut = x.texte.replace(/\s+/g, ' ').trim().replace(/[.!]+$/, '');
        if(!defaut || defaut.split(' ').length > 8) defaut = '<defect>';
        var summary = '[A11Y] | '+(state.auditNom || 'Projet A11Y')+' | '+(THEME_EN[cs[0].theme_ruxal] || cs[0].theme_ruxal)+' | '+objet+': '+defaut;
        var desc = ['h1. Flow(s) / Screen(s) / Element(s) in concern', zone, '',
          'h1. Actual behavior / Impact', x.texte, 'Impact: '+String(cs[0].impact || '').replace(/^RAWeb [\d.]+ \([^)]*\)\s*:\s*/, ''), '',
          'h1. Expected behavior', x.attendu || cs[0].libelle_en, '', 'h1. Recommendations', '- <to be completed>', '', 'h1. Reference']
          .concat(cs.map(function(c){ return c.horsRef ? '- Good practice outside RAWeb 1.1: '+c.libelle_en : '- RAWeb 1.1, Criterion '+c.ref+': '+c.libelle_en+'\n  '+URL_CRITERE.replace('/fr/','/en/')+c.ref.replace('.', '-'); })).join('\n');
        var labels = ['accessibilite', state.support === 'mobile' ? 'mobile-web' : 'desktop', cs[0].horsRef ? 'hors-raweb' : 'RAWeb-'+cs[0].ref, cs[0].theme_ruxal.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')].concat(TAGS_POINT[x.point] || ['design', 'code']);
        while(labels.length < 6) labels.push('');
        return [summary, desc, 'Task', PRIORITE[cs[0].niveau] || 'Medium'].concat(labels).map(csv).join(',');
  }
  // Un ticket par observation non conforme encore valide (pas remplacée par un retest). Une observation qui vaut sur
  // plusieurs écrans donne un seul ticket, qui les liste tous.
  // Mémoire des exports : un ticket déjà exporté ne repart pas, sauf demande « tout réexporter ».
  function exporterJira(tout){
    var deja = state.exportesJira || [], nouveaux = [], ignores = 0;
    var lignes = [['Summary','Description','Issue Type','Priority','Labels','Labels','Labels','Labels','Labels','Labels'].map(csv).join(',')], n = 0;
    state.onglets.forEach(function(o){
      o.obs.forEach(function(x){
        if(x.tag !== 'nc' || !x.criteres.length) return;
        // Une observation retestée sur tous les écrans qu'elle touche ne sort plus de l'export.
        if(obsRetestee(o, x)) return;
        var cle = o.id + ':' + x.id;
        if(!tout && deja.indexOf(cle) > -1){ ignores++; return; }
        nouveaux.push(cle);
        var e = ecranDe(o, x.ecran) || {nom:''};
        var ecrans = [e.nom].concat(x.partage ? x.partage.ecrans.map(function(id){ return (ecranDe(o, id) || {}).nom; }) : []).filter(Boolean);
        var versE = x.vers ? ecranDe(o, x.vers) : null;
        var tous = ecrans.length > 1 && o.ecrans.every(function(y){ return ecrans.indexOf(y.nom) > -1; });
        var objet = versE ? e.nom+' -> '+versE.nom : (x.elementNom ? (x.partage ? (tous ? 'All screens' : ecrans.join(', '))+' ['+x.elementNom+']' : e.nom+' ['+x.elementNom+']') : (x.partage ? (tous ? 'All screens' : ecrans.join(', ')) : e.nom));
        lignes.push(ticketJira(x, objet, x.partage ? (x.elementNom ? objet : ecrans.join(', ')) : objet));
        n++;
      });
    });
    // Fonctions primaires : un ticket par observation non conforme, une seule fois pour tout le projet.
    obsF().forEach(function(x){
      var f = fonctionDe(x.fonction);
      if(!f || !f.presente || x.tag !== 'nc' || !x.criteres.length || obsFRemplacee(x)) return;
      var cle = 'projet:' + x.id;
      if(!tout && deja.indexOf(cle) > -1){ ignores++; return; }
      nouveaux.push(cle);
      var ecr = []; state.onglets.forEach(function(o){ ecransFonction(o, f.id).forEach(function(id){ ecr.push((state.onglets.length > 1 ? o.nom+' : ' : '')+ecranDe(o, id).nom); }); });
      lignes.push(ticketJira(x, 'All screens ['+f.nom+']', 'All screens ['+f.nom+'] ('+ecr.join(', ')+')'));
      n++;
    });
    if(!n){
      if(ignores) message('Aucun nouveau ticket : '+(ignores > 1 ? 'les '+ignores+' tickets ont déjà été exportés' : 'le ticket a déjà été exporté')+'. Pour les reprendre : Fichier, « Tickets Jira : tout réexporter ».', true);
      else message('Aucun ticket à créer : aucune observation non conforme.', true);
      return;
    }
    telecharger(nomFichier('jira','csv'), '﻿' + lignes.join('\r\n'));
    state.exportesJira = deja.concat(nouveaux.filter(function(k){ return deja.indexOf(k) === -1; })); sauver();
    message((tout ? pluriel(n, 'ticket Jira réexporté', 'tickets Jira réexportés') : pluriel(n, 'nouveau ticket Jira', 'nouveaux tickets Jira'))+' (CSV, à importer dans Jira).'+(ignores ? ' '+pluriel(ignores, 'ticket déjà exporté non repris', 'tickets déjà exportés non repris')+'.' : ''));
  }

  // Classeur Excel écrit sans bibliothèque (archive ZIP sans compression).
  var CRC = (function(){ var t = [], c; for(var n = 0; n < 256; n++){ c = n; for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(u){ var c = 0xFFFFFFFF; for(var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(fichiers){
    var enc = new TextEncoder(), m = [], central = [], off = 0;
    fichiers.forEach(function(f){
      var nom = enc.encode(f.nom), data = enc.encode(f.contenu), crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nom.length, true);
      m.push(new Uint8Array(h.buffer), nom, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nom.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nom);
      off += 30 + nom.length + data.length;
    });
    var tc = central.reduce(function(t, x){ return t + x.length; }, 0), fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, fichiers.length, true); fin.setUint16(10, fichiers.length, true); fin.setUint32(12, tc, true); fin.setUint32(16, off, true);
    var tout = m.concat(central, [new Uint8Array(fin.buffer)]), out = new Uint8Array(tout.reduce(function(t, x){ return t + x.length; }, 0)), p = 0;
    tout.forEach(function(x){ out.set(x, p); p += x.length; });
    return out;
  }
  function xmlEsc(v){ return String(v == null ? '' : v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function col(i){ var t = ''; i++; while(i > 0){ var m = (i - 1) % 26; t = String.fromCharCode(65 + m) + t; i = Math.floor((i - 1) / 26); } return t; }
  var STYLE_STATUT = {C:3, NC:4, NT:5, NA:6};
  function construireXlsx(f){
    var der = col(f.colonnes.length - 1) + (f.lignes.length + 1);
    var cel = function(r, v, s){ return '<c r="'+r+'" t="inlineStr" s="'+s+'"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>'; };
    var rows = ['<row r="1">' + f.colonnes.map(function(c, i){ return cel(col(i)+'1', c.titre, 1); }).join('') + '</row>'];
    f.lignes.forEach(function(l, r){ rows.push('<row r="'+(r+2)+'">' + l.map(function(v, i){ return cel(col(i)+(r+2), v, (f.colonnes[i].statut && STYLE_STATUT[v]) ? STYLE_STATUT[v] : 2); }).join('') + '</row>'); });
    var ent = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', NS = 'http://schemas.openxmlformats.org/', NSR = NS+'officeDocument/2006/relationships';
    var fill = function(rgb){ return '<fill><patternFill patternType="solid"><fgColor rgb="FF'+rgb+'"/><bgColor indexed="64"/></patternFill></fill>'; };
    var xf = function(p, fo, c){ return '<xf numFmtId="49" fontId="'+p+'" fillId="'+fo+'" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"'+(c ? ' horizontal="center"' : '')+'/></xf>'; };
    return zip([
      {nom:'[Content_Types].xml', contenu: ent+'<Types xmlns="'+NS+'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
      {nom:'_rels/.rels', contenu: ent+'<Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NSR+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
      {nom:'xl/workbook.xml', contenu: ent+'<workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NSR+'"><sheets><sheet name="'+xmlEsc(f.nom)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
      {nom:'xl/_rels/workbook.xml.rels', contenu: ent+'<Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NSR+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+NSR+'/styles" Target="styles.xml"/></Relationships>'},
      {nom:'xl/styles.xml', contenu: ent+'<styleSheet xmlns="'+NS+'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="7"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+fill('E0EEF2')+fill('E0F3E8')+fill('FBE5E2')+fill('FBF1D3')+fill('E6ECF0')+'</fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+xf(1,2,false)+xf(0,0,false)+xf(1,3,true)+xf(1,4,true)+xf(1,5,true)+xf(1,6,true)+'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
      {nom:'xl/worksheets/sheet1.xml', contenu: ent+'<worksheet xmlns="'+NS+'spreadsheetml/2006/main"><dimension ref="A1:'+der+'"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+f.colonnes.map(function(c, i){ return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c.largeur+'" customWidth="1"/>'; }).join('')+'</cols><sheetData>'+rows.join('')+'</sheetData><autoFilter ref="A1:'+der+'"/></worksheet>'}
    ]);
  }

  // ---------- Démarrage ----------
  // La hauteur de l'en-tête change avec la largeur (onglets, retour à la ligne) : le panneau des étapes, la colonne des écrans et l'en-tête de la grille se calent toujours dessous.
  (function(){
    var barre = document.querySelector('header.barre');
    function caler(){
      document.documentElement.style.setProperty('--barre-h', barre.offsetHeight + 'px');
      focusPanneauEtapes();
    }
    caler();
    if(window.ResizeObserver) new ResizeObserver(caler).observe(barre); else window.addEventListener('resize', caler);
  })();

  // Haut de page : visible après un écran de défilement ; le focus revient sur le titre de la page.
  (function(){
    var b = document.getElementById('btn-haut');
    function maj(){ var cache = window.scrollY < Math.max(600, window.innerHeight); if(b.hidden !== cache) b.hidden = cache; }
    window.addEventListener('scroll', maj, {passive:true}); window.addEventListener('resize', maj);
    b.addEventListener('click', function(){
      var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0, behavior: reduit ? 'auto' : 'smooth'});
      var h = $main.querySelector('h1'); if(h){ h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); }
    });
  })();

  window.RUXAWEB = {state: function(){ return state; }, taux: function(id, elargi){ var o = state.onglets.filter(function(x){ return x.id === id; })[0]; return taux(o, elargi ? RAWEB : SELECTION); }, alertes: function(id){ var o = state.onglets.filter(function(x){ return x.id === id; })[0]; return alertesValidation(o).map(function(x){ return x.c.id+'|'+x.e.id+'|'+x.raison; }); }, version: VERSION};
  rendre();
})();
