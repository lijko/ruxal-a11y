<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier RUXAWEB 2</title>

<style>
  /* =========================================================================
     RUXAWEB : feuille de style. Ordre : jetons, base, en-tête, onglets,
     mise en page, composants, panneau des étapes, vues, impression, écrans.
     ========================================================================= */

  /* ---------- Jetons ---------- */
  :root{
    --ink:#1c2630; --ink-soft:#4a5864; --ink-faint:#5c6a76;
    --surface:#ffffff; --surface-alt:#f1f4f6; --surface-raised:#ffffff; --surface-sunk:#e9eef1;
    --border:#cdd6dc; --border-soft:#e3e8ec;
    --accent:#2f6a7d; --accent-soft:#e0eef2; --accent-ink:#ffffff;
    --accent-fill:#2f6a7d; --accent-fill-ink:#ffffff;
    --c-conforme:#1f7a4d; --c-conforme-soft:#e0f3e8; --c-bon:#4b7612;
    --c-nc:#b83a30; --c-nc-soft:#fbe5e2;
    --c-nt:#7a5c00; --c-nt-soft:#fbf1d3; --c-nt-ink:#3d2e00;
    --c-na:#4d5f6c; --c-na-soft:#e6ecf0;
    --c-ref:#6b4fd1; --c-ref-ink:#ffffff;
    --c-pourux:#a82f93; --c-pourux-ink:#ffffff;
    --radius:10px; --radius-lg:14px; --radius-pill:999px;
    --shadow:0 1px 2px rgba(20,30,40,.06), 0 2px 10px rgba(20,30,40,.06);
    --shadow-pop:0 8px 28px rgba(20,30,40,.18);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --largeur:1320px; --gouttiere:24px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7edf2; --ink-soft:#aebac3; --ink-faint:#8693a0;
      --surface:#141a1f; --surface-alt:#1b232a; --surface-raised:#1f2830; --surface-sunk:#11161a;
      --border:#33404a; --border-soft:#28323b;
      --accent:#8fb6c1; --accent-soft:#1f3640; --accent-ink:#0d1418;
      --accent-fill:#357a8f; --accent-fill-ink:#ffffff;
      --c-conforme:#57b585; --c-conforme-soft:#17301f; --c-bon:#a9c95e;
      --c-nc:#e2776e; --c-nc-soft:#3a201d;
      --c-nt:#d8b969; --c-nt-soft:#332a15; --c-nt-ink:#241d08;
      --c-na:#93a7b6; --c-na-soft:#1e2932;
      --c-ref:#a58ff0; --c-ref-ink:#1c1533;
      --c-pourux:#e08fce; --c-pourux-ink:#2e1526;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
      --shadow-pop:0 8px 28px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7edf2; --ink-soft:#aebac3; --ink-faint:#8693a0;
    --surface:#141a1f; --surface-alt:#1b232a; --surface-raised:#1f2830; --surface-sunk:#11161a;
    --border:#33404a; --border-soft:#28323b;
    --accent:#8fb6c1; --accent-soft:#1f3640; --accent-ink:#0d1418;
    --accent-fill:#357a8f; --accent-fill-ink:#ffffff;
    --c-conforme:#57b585; --c-conforme-soft:#17301f; --c-bon:#a9c95e;
    --c-nc:#e2776e; --c-nc-soft:#3a201d;
    --c-nt:#d8b969; --c-nt-soft:#332a15; --c-nt-ink:#241d08;
    --c-na:#93a7b6; --c-na-soft:#1e2932;
    --c-ref:#a58ff0; --c-ref-ink:#1c1533;
    --c-pourux:#e08fce; --c-pourux-ink:#2e1526;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
    --shadow-pop:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  /* ---------- Base ---------- */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-top:calc(var(--barre-h, 130px) + 72px)} /* le focus ne passe pas sous l'en-tête ni sous l'en-tête collant de la grille */
  body{margin:0;background:var(--surface-alt);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-underline-offset:3px}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
  h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
  h2{font-size:17px;font-weight:800}
  h3{font-size:15px;font-weight:700}
  p{margin:0}
  code{font-family:var(--mono);font-size:.9em;background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:6px;padding:1px 5px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .lien-evitement{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:30}
  .lien-evitement:focus{top:8px}
  .doux{color:var(--ink-soft)}
  .petit{font-size:13px}
  .pile{display:flex;flex-direction:column;gap:12px}
  .rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .outils-grille{display:grid;grid-template-columns:max-content max-content 1fr;gap:10px 12px;align-items:center}
  .outils-grille > .tags{justify-self:start}
  .outils-grille > .btn{justify-self:end;min-height:38px}
  @media (max-width:640px){ .outils-grille{grid-template-columns:1fr} .outils-grille > span:empty{display:none} .outils-grille > .btn{justify-self:start} }
  .entre{justify-content:space-between}
  .espace{flex:1}

  /* ---------- En-tête ---------- */
  header.barre{position:sticky;top:0;z-index:10;background:var(--surface-raised);border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border-soft)}
  .barre-in{max-width:var(--largeur);margin:0 auto;padding:12px var(--gouttiere) 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
  .marque{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;line-height:1.15}
  .marque-nom{font-weight:800;font-size:19px;letter-spacing:.01em}
  .marque small{font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
  .projet-champ{display:flex;align-items:baseline;gap:6px;flex:1 1 320px;min-width:0;padding-left:20px;border-left:1px solid var(--border)}
  .prefixe-projet{font-weight:800;font-size:17px;white-space:nowrap}
  .barre input.nom-audit{flex:1 1 auto;min-width:120px;max-width:420px;min-height:36px;padding:4px 6px;font-size:17px;font-weight:700;border:0;border-bottom:1px dashed var(--ink-faint);border-radius:0;background:transparent}
  .barre input.nom-audit::placeholder{font-weight:500;color:var(--ink-faint)}
  .barre input.nom-audit:hover{border-bottom-color:var(--accent)}
  .barre input.nom-audit:focus{border-bottom:1px solid var(--accent);background:var(--surface-alt)}
  .barre .tags .tag{min-height:34px;font-weight:700;padding:0 14px}

  /* ---------- Onglets ---------- */
  nav.onglets{max-width:var(--largeur);margin:0 auto;padding:0 var(--gouttiere) 12px;display:flex;gap:8px;overflow-x:auto;align-items:stretch}
  .onglet-tab{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;padding:7px 14px;min-height:52px;min-width:120px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer}
  .onglet-tab:hover{border-color:var(--accent)}
  .onglet-tab b{font-size:13.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .onglet-tab span{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .onglet-tab[aria-current="page"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-ink)}
  .onglet-tab[aria-current="page"] span{color:var(--accent-fill-ink)}
  .onglet-tab.ajout{border-style:dashed;color:var(--ink-soft);font-weight:700;align-items:center;min-width:0}
  .onglet-tab.ajout:hover{color:var(--accent)}

  /* ---------- Mise en page ---------- */
  .page{max-width:var(--largeur);margin:0 auto;padding:24px var(--gouttiere);min-height:calc(100vh - var(--barre-h, 130px));display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
  main:focus{outline:none}
  /* Mentions : à la fin de la colonne centrale, pour que les colonnes latérales collantes gardent toute leur hauteur jusqu'en bas. */
  .pied{margin:8px 0 0;font-size:12.5px;color:var(--ink-soft)}
  .tete-page{display:flex;flex-direction:column;gap:4px}

  /* ---------- Cartes ---------- */
  .carte{background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
  .carte > h2:first-child,.carte > .rangee:first-child h2{margin:0}
  .grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}

  /* ---------- Boutons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-p{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-ink);font-weight:700}
  .btn-p:hover{color:var(--accent-fill-ink);filter:brightness(1.08)}
  .btn-l{border-color:var(--accent);color:var(--accent)}
  .btn-d{border-style:dashed}
  .btn-s{min-height:34px;padding:0 12px;font-size:13px}
  .btn-danger{border-color:var(--c-nc);color:var(--c-nc)}
  .btn-danger:hover{background:var(--c-nc-soft);color:var(--c-nc);border-color:var(--c-nc)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .ico{width:16px;height:16px;flex:none}
  .ref-btn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .lien-etapes{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--accent);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .lien-etapes:hover{text-decoration-thickness:2px}

  /* ---------- Champs ---------- */
  label.lbl,.lbl{font-weight:700;font-size:13px;color:var(--ink-soft)}
  input[type=text],select,textarea{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:9px 12px;min-height:42px;width:100%}
  input[type=text]:hover,select:hover,textarea:hover{border-color:var(--ink-faint)}
  textarea{resize:vertical;min-height:76px;line-height:1.45}
  .champ{display:flex;flex-direction:column;gap:6px;min-width:0}
  .choix{display:flex;gap:10px;align-items:center;min-height:34px}
  .choix input{width:18px;height:18px;accent-color:var(--accent-fill);flex:none}
  fieldset{border:0;margin:0;padding:0;min-width:0}
  .oblig{color:var(--c-nc);font-weight:800;margin-left:3px}
  [aria-invalid="true"]{border-color:var(--c-nc)!important;box-shadow:0 0 0 1px var(--c-nc)}

  /* ---------- Sélecteurs segmentés (C / NC / NA, vues, support) ---------- */
  .tags{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex:none;align-self:center;background:var(--surface)}
  .tag{min-width:48px;min-height:36px;padding:0 12px;border:0;border-right:1px solid var(--border);background:transparent;color:var(--ink-soft);cursor:pointer;font-weight:800;font-size:13px}
  .tag:last-child{border-right:0}
  .tag:hover{background:var(--surface-alt);color:var(--ink)}
  .tag[disabled]{cursor:not-allowed;opacity:.6}
  .tag[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-fill-ink)}
  .tag-c[aria-pressed="true"]{background:var(--c-conforme);color:var(--surface)}
  .tag-nc[aria-pressed="true"]{background:var(--c-nc);color:var(--surface)}
  .tag-na[aria-pressed="true"]{background:var(--c-na);color:var(--surface)}
  .tag:focus-visible{outline-offset:-3px}

  /* ---------- Interrupteurs ---------- */
  .switch{position:relative;width:42px;height:24px;border-radius:var(--radius-pill);border:2px solid var(--ink-faint);background:var(--surface-alt);cursor:pointer;padding:0;vertical-align:middle;flex:none}
  .switch .bouton{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink-faint)}
  .switch[aria-checked="true"]{background:var(--accent-fill);border-color:var(--accent-fill)}
  .switch[aria-checked="true"] .bouton{top:1px;left:19px;width:18px;height:18px;background:var(--accent-fill-ink)}
  @media (prefers-reduced-motion: no-preference){ .switch .bouton{transition:left .15s,width .15s,height .15s,top .15s} }

  /* ---------- Pastilles et étiquettes ---------- */
  .pastille{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:2px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:800;line-height:1.5;flex:none;white-space:nowrap}
  .pastille-btn{border:1px solid currentColor;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
  .pastille-btn:hover{text-decoration:underline}
  .s-C{background:var(--c-conforme-soft);color:var(--c-conforme)}
  .s-NC{background:var(--c-nc-soft);color:var(--c-nc)}
  .s-NT{background:var(--c-nt-soft);color:var(--c-nt)}
  .s-NA{background:var(--c-na-soft);color:var(--c-na)}
  .s-AC{background:var(--c-nt-soft);color:var(--c-nt);outline:1px dashed var(--c-nt);outline-offset:-1px}
  .s-NOTE{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border)}
  .etiq{display:inline-flex;align-items:center;padding:1px 8px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700;background:var(--c-ref);color:var(--c-ref-ink);white-space:nowrap}
  .etiq-ref{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);font-family:var(--mono);font-weight:600}
  .coche{color:var(--c-conforme);font-weight:800;margin-right:6px}
  .grav{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .grav::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
  .grav-critique::before{background:var(--c-nc)}
  .grav-serieux::before{background:var(--c-nt)}
  h3 .grav{margin-left:8px;vertical-align:middle}

  /* ---------- Menu, fenêtre, message ---------- */
  .menu{position:relative}
  .menu-liste{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:6px;min-width:270px;display:flex;flex-direction:column;z-index:20;box-shadow:var(--shadow-pop)}
  /* Menus : un nom d'action tient toujours sur une ligne ; le menu s'élargit au besoin, sans dépasser l'écran. */
  .menu-liste{max-width:calc(100vw - 32px)}
  .menu-liste button{text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap}
  .menu-liste button:hover{background:var(--accent-soft)}
  dialog{border:1px solid var(--border);border-radius:var(--radius-lg);padding:0;max-width:760px;width:calc(100% - 32px);background:var(--surface-raised);color:var(--ink);box-shadow:var(--shadow-pop)}
  dialog::backdrop{background:rgba(10,15,20,.55)}
  /* Fenêtre : seul le corps défile ; l'en-tête (titre et Fermer) reste visible. La marge de défilement garde
     l'élément qui reçoit le focus sous l'en-tête, jamais derrière (WCAG 2.2, 2.4.11 Focus non masqué). */
  .dlg{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px;max-height:82vh;overflow:auto;scroll-padding-top:88px;overscroll-behavior:contain}
  .dlg-tete{position:sticky;top:0;z-index:1;margin:0 -24px;padding:20px 24px 12px;background:var(--surface-raised);border-bottom:1px solid var(--border-soft)}
  @media (max-width:640px){
    dialog{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0;border:0}
    .dlg{max-height:100dvh;height:100%;padding:0 16px 16px}
    .dlg-tete{margin:0 -16px;padding:14px 16px 10px}
  }
  .dlg h2{font-size:19px}
  #statut{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--radius);max-width:min(440px,calc(100% - 48px));z-index:40;font-weight:600;font-size:14px;box-shadow:var(--shadow-pop)}
  #statut.erreur{background:var(--c-nc);color:var(--surface)}
  /* Haut de page : en bas à gauche, affiché seulement après défilement (hors de l'ordre de tabulation sinon). */
  .btn-haut{position:fixed;left:max(16px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));z-index:30;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-pill);padding:9px 14px;box-shadow:var(--shadow-pop);cursor:pointer}
  .btn-haut:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- Panneau des étapes ---------- */
  aside.panneau-etapes{flex:1 1 280px;max-width:330px;position:sticky;top:calc(var(--barre-h, 130px) + 24px);min-height:220px;overflow-y:auto;background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
  aside.panneau-etapes h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
  aside.panneau-etapes p{font-size:14.5px}
  aside.panneau-etapes:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .etape-courante{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
  .etape-courante .points{display:flex;gap:5px;flex-wrap:wrap}
  .etape-courante .points i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-faint);background:transparent}
  .etape-courante .points i.fait{background:var(--c-conforme);border-color:var(--c-conforme)}
  .etape-courante .points i.ici{background:var(--accent-fill);border-color:var(--accent-fill);box-shadow:0 0 0 2px var(--accent-soft)}
  .etape-courante .en-cours{font-weight:700;line-height:1.35}
  .nav-etapes{gap:8px}
  .liste-etapes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .liste-etapes .phase{padding:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
  .liste-etapes .phase:first-child{padding-top:0}
  .liste-etapes .pas-li{position:relative}
  .liste-etapes .pas-li:not(.fin)::after{content:"";position:absolute;left:21px;top:40px;bottom:-6px;width:2px;background:var(--border);border-radius:2px}
  .liste-etapes .pas-li.ok:not(.fin)::after{background:var(--c-conforme)}
  .liste-etapes button,.liste-etapes span.pas{position:relative;z-index:1;width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:6px 8px;min-height:46px}
  .liste-etapes button{cursor:pointer}
  .liste-etapes button:hover{background:var(--surface-alt)}
  .liste-etapes .lib{display:flex;flex-direction:column;line-height:1.25}
  .liste-etapes .lib small{font-size:12px;color:var(--ink-soft);font-weight:500}
  .liste-etapes .rond{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface-raised);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-soft)}
  .liste-etapes .rond svg{width:15px;height:15px}
  .liste-etapes .fait .rond{background:var(--c-conforme);border-color:var(--c-conforme);color:var(--surface)}
  .liste-etapes .ici{background:var(--accent-soft)}
  .liste-etapes .ici .lib{font-weight:800;color:var(--accent)}
  .liste-etapes .ici .rond{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-ink);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent-fill)}
  @media (prefers-reduced-motion: no-preference){ .liste-etapes .ici .rond{transition:box-shadow .2s} }

  /* ---------- Onglet : cadre Saisie / Grille ---------- */
  .titre-onglet{gap:12px}
  .titre-onglet h1{margin-right:4px}
  .audit{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .centre{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .ecrans{flex:1 1 200px;max-width:240px;display:flex;flex-direction:column;gap:12px}
  .ecrans .carte{padding:8px;display:flex;flex-direction:column;gap:2px}
  .ecrans h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px 4px}
  .ecrans button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;min-height:40px;cursor:pointer;line-height:1.3}
  .ecrans button .petit{flex:none;white-space:nowrap;font-weight:700;font-size:12px}
  .ecrans button:hover{background:var(--surface-alt)}
  .ecrans button[aria-current="true"]{background:var(--accent-fill);color:var(--accent-fill-ink);font-weight:700}
  .ecrans .carte > p{padding:4px 8px 8px;font-size:13px;color:var(--ink-soft)}
  .elt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px;font-size:14px}
  h2.titre-ecran{font-size:21px}

  /* ---------- Formulaire d'observation ---------- */
  #form-obs{gap:14px}
  .sous-titre-form{margin:4px 0 -4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--border-soft);padding-top:14px}
  .form-modif{outline:2px solid var(--accent-fill);outline-offset:2px}
  .pied-form{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border-soft);padding-top:14px}
  #form-obs .pied-form{border-top:0;padding-top:0}
  .sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crit-retenus{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .crit-retenus li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface-sunk)}
  .sugg:empty{display:none}
  .sugg-btn{min-height:30px;border-radius:var(--radius-pill);font-weight:600;white-space:normal;text-align:left}
  .crit-choix{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius);padding:6px 10px;background:var(--surface)}
  .consigne summary{cursor:pointer;font-weight:700;color:var(--accent)}
  .consigne textarea{font-size:12.5px;font-family:var(--mono)}

  /* ---------- Observations ---------- */
  .obs{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-soft)}
  .obs:last-child{border-bottom:0;padding-bottom:0}
  .obs .pastille{min-width:52px;margin-top:1px}
  .obs .corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .obs .texte{overflow-wrap:anywhere}
  .obs.invalide .texte{text-decoration:line-through;color:var(--ink-soft)}
  .obs > .rangee,.obs > .btn{flex:none}

  /* ---------- Tableaux ---------- */
  .tableau{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-raised);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  /* Coins du tableau : les cellules d'angle suivent l'arrondi du cadre (pas d'overflow:hidden, qui casserait l'en-tête collant). */
  .tableau thead tr:first-child > :first-child{border-top-left-radius:calc(var(--radius-lg) - 1px)}
  .tableau thead tr:first-child > :last-child{border-top-right-radius:calc(var(--radius-lg) - 1px)}
  .tableau tbody:last-child tr:last-child > :first-child{border-bottom-left-radius:calc(var(--radius-lg) - 1px)}
  .tableau tbody:last-child tr:last-child > :last-child{border-bottom-right-radius:calc(var(--radius-lg) - 1px)}
  .tableau tbody:last-child tr:last-child > *{border-bottom:0}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top}
  thead th{position:sticky;top:0;background:var(--surface-alt);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;vertical-align:middle}
  tbody th{font-weight:400}
  tbody tr:hover td,tbody tr:hover th{background:color-mix(in srgb, var(--surface-alt) 60%, transparent)}
  tr.theme th{background:var(--surface-alt);font-weight:800;font-size:13px}
  /* Toutes les cellules d'une ligne s'alignent sur la première ligne de texte : statuts en haut, comme le critère et l'intitulé. */
  td.statut{text-align:center;white-space:nowrap;vertical-align:top;padding-top:6px}
  td.statut > .pastille{margin-top:2px}
  thead th.col-ecran{white-space:normal;text-align:center;min-width:64px;max-width:120px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:700;overflow-wrap:break-word}
  tbody th .ref-btn{white-space:nowrap}
  td.statut .pastille{min-width:34px;padding:2px 8px}
  th.col-ici{color:var(--accent)}
  td.col-ici{background:var(--accent-soft)}
  .col-resultat{border-left:2px solid var(--border)}
  thead th.col-resultat{font-weight:800}
  /* Case de statut : toute la case est cliquable ; survol par le fond, comme les listes d'écrans et d'étapes. */
  td.statut:has(.cel-btn){padding:0;height:1px}
  .cel-btn{display:flex;width:100%;height:100%;gap:4px;justify-content:center;align-items:flex-start;padding:8px 10px;border:0;border-radius:0;background:none;cursor:pointer;font:inherit;color:inherit}
  .cel-btn:hover{background:color-mix(in srgb, var(--surface-raised), var(--ink) 9%)}
  td.col-ici .cel-btn:hover{background:color-mix(in srgb, var(--accent-soft), var(--ink) 12%)}
  .cel-btn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
  .nb-obs{font-size:11px;font-weight:700;opacity:.8}
  .alerte{border-color:var(--c-nt)}
  .sans-puce{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .obs.ligne-tous{border-bottom:2px solid var(--border)}
  .obs.cible-fiche{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
  td.intitule{min-width:220px}
  table.contenus-table{table-layout:fixed}
  table.contenus-table th,table.contenus-table td{text-align:center;vertical-align:middle}
  table.contenus-table th:first-child,table.contenus-table tbody th{text-align:left}
  table.contenus-table thead th:first-child{width:28%}
  table.contenus-table thead th{white-space:normal;overflow-wrap:break-word;hyphens:auto}
  table.contenus-table thead th:not(:first-child){text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700}
  .carte .tableau{box-shadow:none}

  /* ---------- Page Projet ---------- */
  .modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .tuile{text-align:left;background:var(--surface-raised);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:130px}
  .tuile:hover{border-color:var(--accent)}
  .tuile b{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .modules .tuile b{color:var(--accent)}
  .tuile .val{font-size:28px;font-weight:800;font-family:var(--mono);line-height:1.1}
  .tuile-info{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:auto;padding-top:6px}
  .tuile-avenir{border-style:dashed;cursor:default;box-shadow:none;background:transparent}
  .tuile-avenir:hover{border-color:var(--border)}
  .modules .tuile-avenir b{color:var(--ink-soft)}
  /* Carte d'onglet : le bouton du titre s'étend à toute la carte ; les actions passent au-dessus de cette zone. */
  .tuile-onglet{position:relative}
  .tuile-titre{margin:0;font-size:17px}
  .tuile-lien{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-align:left;cursor:pointer}
  .tuile-lien::after{content:"";position:absolute;inset:0;border-radius:inherit}
  .tuile-lien:focus-visible{outline:none}
  .tuile-onglet:has(.tuile-lien:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
  .tuile-onglet .tuile-titre{padding-right:40px}
  .tuile-menu{position:absolute;top:10px;right:10px;z-index:2}
  .tuile-menu .menu-liste{min-width:260px}
  .btn-kebab{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink-soft);cursor:pointer}
  .btn-kebab:hover,.btn-kebab[aria-expanded="true"]{background:var(--surface-alt);color:var(--ink);border-color:var(--border)}
  .menu-liste .menu-danger{display:flex;align-items:center;gap:8px;color:var(--c-nc);font-weight:600}
  .menu-liste .menu-danger:hover{background:var(--c-nc-soft)}
  .liste-fonctions{display:flex;flex-direction:column}
  .actions-objet{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border-soft)}
  .fonction-ligne{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border-soft)}
  .fonction-nom{font-weight:600}
  .ajout-fonction input{flex:1 1 240px;width:auto}

  /* ---------- Page de l'onglet (écrans) ---------- */
  .ecran-ligne{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft)}
  .ecran-ligne:last-child{border-bottom:0}
  .ecran-ligne input[type=text]{flex:1 1 200px;width:auto}
  .ecran-ligne .btn-danger{border-color:var(--border)}
  .fonction-ecrans{padding:10px 0;border-top:1px solid var(--border-soft)}
  .fonction-ecrans legend{float:left;width:100%;padding:0;margin-bottom:4px}
  .fonction-ecrans legend + *{clear:both}
  .fonction-ecrans .rangee{column-gap:20px}

  /* ---------- Résumé ---------- */
  .taux{display:flex;flex-wrap:wrap;gap:20px 56px;align-items:flex-start}
  .taux > div{display:flex;flex-direction:column;gap:4px;min-width:180px}
  .taux .val{font-size:40px;font-weight:800;line-height:1.1;font-family:var(--mono);min-height:48px;display:flex;align-items:center}
  .taux .val .pastille{font-family:var(--sans);font-size:15px}
  /* Niveau d'un taux : mêmes couleurs que les statuts (C, NT, NC), avec un libellé écrit, jamais la couleur seule. */
  .niv-conforme{color:var(--c-conforme)} .niv-bon{color:var(--c-bon)} .niv-ameliorer{color:var(--c-nt)} .niv-insuffisant{color:var(--c-nc)}
  .niveau{font-weight:800;font-size:14px}
  .taux .val.second{color:var(--ink-soft);font-size:30px}

  /* ---------- Référentiel ---------- */
  .ref-groupe{display:flex;flex-direction:column;gap:12px}
  .ref-groupe h2{margin:12px 0 0;font-size:19px}
  .ref-fiche{gap:8px}

  /* ---------- Impression (référentiel en PDF) ---------- */
  @media print{
    :root{color-scheme:light}
    body{background:#fff!important}
    .barre,aside.panneau-etapes,.lien-evitement,.ref-tete button,.ref-outils,#statut,.btn-haut,.pied{display:none!important}
    .page{display:block;padding:0;max-width:none;zoom:.8}
    .carte{box-shadow:none!important;border:1px solid #888!important;background:#fff!important;break-inside:avoid;display:block!important;margin-bottom:10px}
    .carte > * + *{margin-top:6px!important}
    main,.ref-groupe{display:block!important}
    .ref-groupe h2{break-after:avoid;margin:14px 0 8px!important}
    main,main *{color:#000!important}
    a{text-decoration:underline}
  }

  /* ---------- Ajustements ponctuels ---------- */
  /* Petites corrections d'espacement ou de taille, posées sur un élément précis ; elles priment sur les règles des composants. */
  .sans-marge{margin:0!important}
  .marge-haut-4{margin:4px 0 0!important}
  .marge-haut-2{margin:2px 0 0!important}
  .marge-haut-8{margin:8px 0 0!important}
  .marge-v-8{margin:8px 0!important}
  .marge-4-8{margin:4px 8px!important}
  .ecart-haut-8{margin-top:8px!important}
  .ecart-haut-6{margin-top:6px!important}
  .fixe{flex:none!important}
  .groupe-nu{border:0!important;padding:0!important;margin:0!important}
  .sans-retrait{padding:0!important}
  .sans-bord{border:0!important}
  .pastille-84{min-width:84px!important}
  .tag-80{min-width:80px!important}
  .a-droite{justify-content:flex-end!important}
  .centre-v{align-items:center!important}
  .titre-encadre{font-size:16px!important;margin:0!important}
  .taille-15{font-size:15px!important}
  .coupe-mots{overflow-wrap:anywhere!important}
  .largeur-420{max-width:420px!important}
  .souple-260{flex:1 1 260px!important}
  .souple-320{flex:1 1 320px!important}
  .souple-240{flex:1 1 240px!important;width:auto!important}
  .retour-ligne{flex-wrap:wrap!important}
  .ecart-col-20{column-gap:20px!important}
  .lien-action{color:var(--accent)!important;font-weight:600!important;margin-top:4px!important}

  /* ---------- Largeurs d'écran ---------- */
  @media (max-width:900px){
    aside.panneau-etapes{position:static;max-width:none;max-height:none;flex-basis:100%;order:-1}
    .projet-champ{border-left:0;padding-left:0;flex-basis:100%}
  }
  /* Écran large : la page défile ; l'en-tête, la colonne des écrans, le panneau des étapes et l'en-tête de la grille restent visibles. */
  @media (min-width:901px){
    /* Colonnes latérales collantes, sur toute la hauteur disponible sous l'en-tête (24 px de marge en haut et en bas). */
    .ecrans,aside.panneau-etapes{position:sticky;top:calc(var(--barre-h, 130px) + 24px);height:calc(100vh - var(--barre-h, 130px) - 48px);overflow-y:auto}
    .ecrans > .carte:last-child{flex:1 0 auto}
    .tableau{overflow:visible}
    .tableau.large{overflow-x:auto}
    thead th{top:var(--barre-h, 130px);z-index:2}
    .contenus-table thead th{position:static}
  }
  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

<body>
<a class="lien-evitement" href="#main">Aller au contenu</a>
<header class="barre">

</header>
<div class="page">

</div>
<p class="pied" id="pied">Critères : RAWeb 1.1, Service information et presse (SIP), Luxembourg, CC BY 3.0 LU, intitulés non modifiés. Sélection de la méthode de contrôle simplifié v1.2.1, plus critères hors sélection. Pré-diagnostic, pas un audit de conformité. Code : EUPL-1.2.</p>

<button type="button" class="btn-haut" id="btn-haut" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>Haut de page</button>

<script>
(function(){

  var CRITERES = [
    {"id": "raweb-1-1", "ref": "1.1", "theme_ruxal": "Images & médias", "theme_ref": "1. Images", "niveau": "critique", "niveau_wcag": "A", "siPresent": false, "horsSelection": false, "declencheur": "", "etape": "2", "libelle": "Chaque image porteuse d’information a-t-elle une alternative textuelle ?", "libelle_en": "Does each image conveying information have a text alternative?", "impact": "RAWeb 1.1 (WCAG 1.1.1) : sans alternative textuelle, une image porteuse d'information (icône de lien, bouton image, logo, graphique) n'existe pas pour l'utilisateur de lecteur d'écran, qui entend au mieux un nom de fichier.", "explication": "Repère chaque image qui porte une information (photo de produit, icône de lien ou de bouton, logo cliquable, graphique). Avec le lecteur d'écran, ou dans l'inspecteur du navigateur, vérifie qu'elle a une alternative textuelle (attribut alt ou équivalent). Un outil automatique signale les images sans alternative, mais c'est à toi de décider si une image porte une information.", "wcag": ["1.1.1"]},
